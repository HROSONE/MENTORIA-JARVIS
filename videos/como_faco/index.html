<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Como eu faço um vídeo (Short)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;max-height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// O vídeo inteiro é uma função do tempo: window.__setTime(t) / window.__frame(t, opções).
import { construir, desenhar, quadro, TOTAL } from './js/cena.js';
const Q = new URLSearchParams(location.search);
await construir();
window.__setTime = t => desenhar(t);
window.__frame = (t, opc = {}) => quadro(t, opc);
window.__total = TOTAL;
window.__ready = true;
desenhar(Q.has('t') ? +Q.get('t') : 0);
</script>
</body>
</html>
