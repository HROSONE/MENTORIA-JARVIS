<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal do Gato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00E5FF; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #c{display:block;width:1080px;height:1920px}
  .ov{position:absolute;left:50px;right:50px;top:var(--y);text-align:center;color:#fff;font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1;
    opacity:0;transform:translateY(40px) scale(.92);transition:opacity .25s ease, transform .45s cubic-bezier(.2,.9,.3,1.25);
    text-shadow:0 10px 40px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.7);pointer-events:none}
  .ov.on{opacity:1;transform:none}
  .btn{display:inline-block;border:10px solid var(--accent);border-radius:999px;padding:.28em .75em;background:rgba(0,0,0,.45);box-shadow:0 0 60px rgba(0,229,255,.35)}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font:800 54px 'Montserrat',sans-serif;background:rgba(0,0,0,.55);cursor:pointer;gap:30px;text-align:center}
  #start small{font-size:30px;opacity:.6}
  #start.hide{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="texts"></div>
  <div id="start">▶ CLIQUE ou ESPAÇO<small>com som · ESPAÇO pausa · R reinicia</small></div>
</div>
