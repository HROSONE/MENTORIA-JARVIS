<head>
<meta charset="utf-8">

<title>A Origem do Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#ffb02e; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #c{display:block;width:1080px;height:1920px}
  #flash{position:absolute;inset:0;background:radial-gradient(circle,#f3d9ff 0%,#9b4dff 55%,#2a0a4a 100%);opacity:0;pointer-events:none}
  .ov{position:absolute;left:40px;right:40px;top:var(--y);text-align:center;color:#fff;font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1.05;
    opacity:0;transform:translateY(40px) scale(.92);transition:opacity .25s ease, transform .45s cubic-bezier(.2,.9,.3,1.25);
    text-shadow:0 10px 40px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.8);pointer-events:none}
  .ov.on{opacity:1;transform:none}
  .a{color:var(--accent)}
  .sub{display:block;font-size:.4em;letter-spacing:.12em;margin-top:.25em;color:#ffe2b0}
  .tag{display:inline-block;border:8px solid var(--accent);border-radius:28px;padding:.2em .55em;background:rgba(20,8,30,.55)}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font:800 54px 'Montserrat',sans-serif;background:rgba(0,0,0,.55);cursor:pointer;gap:30px;text-align:center}
  #start small{font-size:30px;opacity:.6}
  #start.hide{display:none}
</style>
</head>

<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
