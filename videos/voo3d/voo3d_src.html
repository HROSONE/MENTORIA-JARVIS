const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .22, .4, .97); composer.addPass(bloom); composer.addPass(new OutputPass());
const flash = document.getElementById('flash'), lines = document.getElementById('lines');

/* ---------------- linha do tempo ----------------
   0.0–4.2  câmera acompanha o avião (perto, de lado), passando por nuvens
   4.2–5.0  whip-pan + zoom rápido: a câmera "puxa" para a cadeira que surge no meio das nuvens
   5.0–12   close na cadeira: tremor de vento, Larry acena com a cerveja, avião passa ao fundo */
function frame(t) {
  // avião: voa em +x; rig fixo perto da origem
  const px = lerp(-140, 260, t / TOTAL), py = 30 + Math.sin(t * .6) * 1.5;
  plane.position.set(px, py, -60); plane.rotation.set(Math.sin(t * .8) * .03, 0, .04 + Math.sin(t * .5) * .02);
  { const k = range(t, 7.6, 11.6); plane2.position.set(lerp(260, -320, k), lerp(26, 22, k), -300); plane2.rotation.set(0, Math.PI, -.03); plane2.visible = k > 0 && k < 1; }
  trails.forEach((m, i) => { m.position.set(px - 95, py - 4.4, -60 + (i ? 14 : -14)); });
  // Larry & cadeira
  const gust = noise(t * 1.4, 1), sway = gust * .06;
  rig.position.set(0, Math.sin(t * .9) * .25, 0); rig.rotation.set(sway * .4, Math.sin(t * .4) * .25 - .35, sway);
  B.forEach((b, i) => { b.m.position.set(b.base.x + Math.sin(t * 1.3 + b.ph) * .05 + gust * .12, b.base.y + Math.sin(t * 1.7 + b.ph) * .04, b.base.z + Math.cos(t * 1.1 + b.ph) * .05); });
  updStrings();
  const wave = t > 6.2 ? Math.sin((t - 6.2) * 7) : 0, lift = ss(range(t, 5.6, 6.3));
  setArm(armR, 1, [lerp(.25, .3, lift), lerp(.36, .58, lift), lerp(.08, .02, lift)], [lerp(.16, .28 + wave * .05, lift), lerp(.22, .82, lift), lerp(.18, .06, lift)], true);
  setArm(armL, -1, [-.25, .34, .06], [-.19, .16, .2], false);
  setLegs(Math.sin(t * 2.3) * .7);
  head.rotation.set(-.05 + gust * .03, lerp(.35, .15, ss(range(t, 5.2, 6))), gust * .04);
  // nuvens derivam
  clouds.forEach((c, i) => { c.position.x += 0; c.position.x = ((c.userData.x0 ?? (c.userData.x0 = c.position.x)) - t * c.userData.v * 6 + 3000) % 2600 - 1300; });
  // câmera
  const shake = (k) => [noise(t * 9, 2) * k, noise(t * 8, 5) * k, noise(t * 7, 9) * k];
  let cam, look, fov;
  const z = ss(range(t, 4.2, 5.0));
  if (t < 4.2) { const k = t / 4.2; cam = new THREE.Vector3(px + lerp(-70, -20, k), py + lerp(16, 8, k), -60 + lerp(120, 92, k)); look = new THREE.Vector3(px + 4, py, -60); fov = lerp(46, 40, k); const sh = shake(.5); cam.x += sh[0]; cam.y += sh[1]; }
  else {
    const close = new THREE.Vector3(.8, .9, 2.4), lookC = new THREE.Vector3(0, .55, 0);
    const farC = new THREE.Vector3(px - 20, py + 8, 32), farL = new THREE.Vector3(px + 4, py, -60);
    cam = farC.clone().lerp(close, z); look = farL.clone().lerp(lookC, z); fov = lerp(40, 34, z);
    const k2 = ss(range(t, 7.2, TOTAL)); cam.add(new THREE.Vector3(lerp(0, 1.6, k2), lerp(0, -.6, k2), lerp(0, 6.4, k2))); look.y += lerp(0, 2.1, k2); fov = lerp(fov, 42, k2);
    const sh = shake(lerp(.6, .05, ss(range(t, 4.6, 5.6))) + .04 + Math.abs(gust) * .05); cam.x += sh[0]; cam.y += sh[1]; cam.z += sh[2] * .5;
  }
  camera.position.copy(cam); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(look);
  camera.rotation.z += (t > 4.2 && t < 5.2 ? (1 - range(t, 4.2, 5.2)) * .25 : 0) + noise(t * 3, 4) * .01;
  sun.target.position.copy(rig.position); sun.position.set(rig.position.x + 30, rig.position.y + 18, rig.position.z - 24);
  // overlays: flash no zoom, linhas de velocidade
  flash.style.opacity = (t > 4.9 && t < 5.15 ? (1 - range(t, 4.9, 5.15)) * .85 : 0).toFixed(3);
  const sp = t < 4.2 ? .35 : (t < 5.1 ? 1 : Math.max(0, .5 - (t - 5.1) * .4));
  let svg = ''; if (sp > 0) for (let i = 0; i < 26; i++) { const a = i * .78 + Math.floor(t * 24) * .37, r0 = 380 + (i * 97 % 300), r1 = r0 + 260 * sp; svg += `<line x1="${540 + Math.cos(a) * r0}" y1="${960 + Math.sin(a) * r0 * 1.6}" x2="${540 + Math.cos(a) * r1}" y2="${960 + Math.sin(a) * r1 * 1.6}" stroke="white" stroke-width="${3 + i % 3 * 2}" opacity="${(.25 * sp).toFixed(2)}"/>`; }
  lines.innerHTML = svg;
  composer.render();
}
const params = new URLSearchParams(location.search);
window.__total = TOTAL;
window.__seek = (t) => frame(t);
frame(0);
window.__ready = true;
if (!params.has('still')) { const st = performance.now(); const loop = () => { frame(((performance.now() - st) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
</script>
