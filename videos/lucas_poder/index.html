<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ele podia voar (Short, ficção)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Protocolo do projeto: window.__total (s), window.__frame(t, { jpeg, subs }) -> dataURL, window.__planos. Planos em js/planos.js.
import { desenharTela, capturar } from './js/motor.js';
import { construirTudo, atualizar, efeitos, acharPlano } from './js/planos.js';
const Q = new URLSearchParams(location.search);
const S = await construirTudo();
const desenhar = t => { atualizar(t); desenharTela(); };
window.__frame = (t, opc = {}) => {
  const e = efeitos(t), pl = acharPlano(t), lo = pl.t0, hi = pl.t0 + pl.dur - 1e-4;
  return capturar(tk => desenhar(Math.min(Math.max(tk, lo), hi)), t, { subs: opc.subs ?? e.subs ?? 1, obturador: e.obturador ?? 0.5, fade: e.fade || 0, flash: e.flash || 0, flashCor: e.flashCor, jpeg: opc.jpeg ?? 0.93 });
};
window.__total = S.total;
window.__planos = S.planos.map(p => ({ nome: p.id, t0: p.t0, t1: p.t0 + p.dur }));
if (Q.has('t')) desenhar(+Q.get('t'));
window.__ready = true;
</script>
</body>
</html>
