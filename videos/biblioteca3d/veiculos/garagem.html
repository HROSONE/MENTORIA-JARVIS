<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Garagem — todos os veículos</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#aab4bf}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><script type="module">
// Todos os veículos da biblioteca lado a lado (para comparar escala): ?noite para as luzes ligadas
import * as THREE from 'three';
import { criarViatura, criarAmbiente } from './policia/viatura.js';
import { criarAmbulancia } from './ambulancia/ambulancia.js';
const Q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight, noite = Q.has('noite');
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(noite ? 0x0b1220 : 0xaab4bf); sc.environment = criarAmbiente(r); sc.environmentIntensity = noite ? 0.06 : 1;
const sol = new THREE.DirectionalLight(0xfff2e0, noite ? 0.08 : 2.2); sol.position.set(-8, 14, 10); sol.castShadow = true; sol.shadow.mapSize.set(4096, 4096); Object.assign(sol.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 60 }); sc.add(sol);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: noite ? 0x2a2d30 : 0x777c80, roughness: 0.95 })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; sc.add(chao);
const lista = [];
const pol = criarViatura({ livery: 'preto-branco' }); lista.push(pol);
lista.push(criarAmbulancia({}));
for (const n of ['bombeiros', 'onibus', 'picape', 'taxi', 'hatch']) lista.push((await import(`./${n}/${n}.js`)).criar({}));
let x = 0; const larg = [2.0, 2.49, 2.54, 2.44, 2.01, 1.84, 1.80];
lista.forEach((v, i) => { x += (i ? larg[i - 1] / 2 : 0) + larg[i] / 2 + (i ? 1.1 : 0); v.grupo.position.x = -x; sc.add(v.grupo); if (noite) { v.farois && v.farois(true, 30); v.luzes && v.luzes(0.05 + i * 0.13, 'ligado'); v.posicao && v.posicao(true); } });
const cx = -x / 2, cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 300); cam.position.set(cx + 14, 9, 26); cam.lookAt(cx + 1, 1.3, 0); r.render(sc, cam); window.__ready = true;
</script></body></html>
