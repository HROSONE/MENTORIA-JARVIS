<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Cidade Hryz — mapa oficial</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5}
  body.noite{background:#0a1226}
  canvas{display:block}
  #info{position:absolute;left:12px;top:10px;color:#fff;font:600 14px system-ui,sans-serif;text-shadow:0 1px 3px #000;max-width:calc(100% - 24px)}
  #carga{position:absolute;left:12px;bottom:12px;color:#fff;font:600 14px system-ui,sans-serif;text-shadow:0 1px 3px #000}
  body.still #info, body.still #carga{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="info">Cidade Hryz — mapa oficial (arraste para girar, roda para zoom) · ?cam=aereo|topo|centro|rua|aeroporto|pista|rodovia|condominio|predios|estadio|parque|bairro · ?noite · ?pessoas=0 · ?still</div>
<div id="carga">carregando…</div>
<script type="module">
// ======================================================================================================
// Cidade oficial do canal: tudo o que a biblioteca tem, montado numa cidade só (unidades: metros; ladrilho de 12 m).
//   norte = -Z, leste = +X. A rodovia corre no oeste (x = 12), o aeroporto fica no sul, o estádio no leste.
//   Quadras de 5 x 5 ladrilhos (60 x 60 m) entre ruas a cada 6 ladrilhos: gx = 3, 9, 15, 21, 27, 33 e gz = 2, 8, 14, 20, 26, 32.
// ======================================================================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Kit, TILE, CALCADA, ESCALA_VEICULO } from './kit.js';

const Q = new URLSearchParams(location.search);
const NOITE = Q.has('noite');
const CAM = Q.get('cam') || 'aereo';
const PESSOAS = Q.get('pessoas') !== '0';
if (Q.has('still')) document.body.classList.add('still');
if (NOITE) document.body.classList.add('noite');
const carga = document.getElementById('carga');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = NOITE ? 1.1 : 1.0;
document.body.prepend(renderer.domElement);

const FUNDO = NOITE ? 0x0a1226 : 0xbfe3f5;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FUNDO);
scene.fog = new THREE.Fog(FUNDO, 700, 2200);
scene.add(NOITE ? new THREE.HemisphereLight(0x6a82b8, 0x1b2438, 1.1) : new THREE.HemisphereLight(0xffffff, 0x8fa3b5, 1.5));
const sun = new THREE.DirectionalLight(NOITE ? 0x9db4ea : 0xfff4e0, NOITE ? 0.9 : 2.8);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

const kit = await Kit.carregar();
const mundo = new THREE.Group();
scene.add(mundo);
const P = [];                                                       // promessas de carga (tudo carrega em paralelo)

// ---- chão: grama um pouco abaixo do asfalto (as quadras ganham ladrilhos de grama ou calçada em y = 0,15)
const chao = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: NOITE ? 0x2c4a2a : 0x6fa94c, roughness: 1 }));
chao.rotation.x = -Math.PI / 2; chao.position.set(300, -0.03, 300); chao.receiveShadow = true;
scene.add(chao);

// ---- carga de GLB com cache (as cópias dividem a geometria)
const loader = new GLTFLoader();
const cache = new Map();
async function glb(url) {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url));
  const o = (await cache.get(url)).scene.clone(true);
  o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  return o;
}

function aleatorio(semente) {                                       // pseudoaleatório repetível (mulberry32)
  let a = semente;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const R = aleatorio(2026);
const escolha = l => l[Math.floor(R() * l.length)];

// halo das lâmpadas à noite
const HALO = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,238,200,1)'); r.addColorStop(0.22, 'rgba(255,217,138,0.5)'); r.addColorStop(1, 'rgba(255,217,138,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.SpriteMaterial({ map: t, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
})();

/** peça do kit em coordenadas do mundo; à noite acende lâmpadas, janelas e letreiros e põe halos nas lâmpadas */
function colocar(nome, x, z, ang = 0, y = CALCADA, { escala = 1, halo = false } = {}) {
  P.push((async () => {
    const o = await kit.peca(nome);
    o.position.set(x, y, z); o.rotation.y = ang;
    if (escala !== 1) o.scale.setScalar(escala);
    if (NOITE) {
      kit.luzEstado(o, true);
      if (halo) for (const l of kit.luzesDe(o).slice(0, 2)) { const h = new THREE.Sprite(HALO); h.position.copy(l.pos); h.scale.setScalar(l.alcance > 20 ? 5 : 3); mundo.add(h); }
    }
    mundo.add(o);
  })());
}
const OCUPADO = new Set();                                         // ladrilhos de chão já usados (o piso das quadras não pode ficar por cima: piscaria)
const ladrilho = (nome, gx, gz, rot = 0, lados = null) => (OCUPADO.add(gx + ',' + gz), P.push(kit.ladrilho(nome, gx, gz, rot, lados).then(o => { if (NOITE) kit.luzEstado(o, true); mundo.add(o); })));
function modelo(url, x, z, ang = 0, y = CALCADA, escala = 1) {
  P.push(glb(url).then(o => { o.position.set(x, y, z); o.rotation.y = ang; if (escala !== 1) o.scale.setScalar(escala); mundo.add(o); return o; }));
}

// ---- veículos do Kenney (escala 1,7)
const CARROS = ['sedan', 'sedan-sports', 'hatchback-sports', 'suv', 'suv-luxury', 'taxi', 'van', 'police', 'delivery'];
const PESADOS = ['truck', 'truck-flat', 'delivery', 'delivery-flat', 'van', 'garbage-truck'];
const carro = (nome, x, z, ry, y = 0) => modelo(`../veiculos/${nome}.glb`, x, z, ry, y, ESCALA_VEICULO);

// ======================================================================================================
// 1. Ruas: a rede é uma lista de ladrilhos; cada um vira reta, curva, T, cruzamento ou fim conforme os vizinhos
// ======================================================================================================
const k = (x, z) => x + ',' + z;
const RUA = new Set();
const VX = [3, 9, 15, 21, 27, 33], HZ = [2, 8, 14, 20, 26, 32];
for (const gx of VX) for (let gz = 2; gz <= 32; gz++) RUA.add(k(gx, gz));
for (const gz of HZ) for (let gx = 3; gx <= 33; gx++) RUA.add(k(gx, gz));
for (let gx = 28; gx <= 32; gx++) RUA.delete(k(gx, 8));                // o parque junta duas quadras
for (let gx = 34; gx <= 47; gx++) RUA.add(k(gx, 2));                   // rua do estádio
RUA.add(k(3, 33)); for (let gx = 3; gx <= 25; gx++) RUA.add(k(gx, 34)); // avenida do aeroporto
const ROT = [21, 20];                                                   // rotatória (3 x 3 ladrilhos)
const naRot = (gx, gz) => Math.abs(gx - ROT[0]) <= 1 && Math.abs(gz - ROT[1]) <= 1;
for (const c of [...RUA]) { const [x, z] = c.split(',').map(Number); if (naRot(x, z)) RUA.delete(c); }
const BLOQUEIO = new Set([k(26, 26) + '|' + k(27, 26)]);               // a rua do condomínio termina antes da rua 27
const SAIDAS = new Set([k(3, 8) + 'W', k(3, 34) + 'W']);               // ligações com a rodovia
const DIR = { N: [0, -1], S: [0, 1], E: [1, 0], W: [-1, 0] };
function liga(gx, gz, d) {
  const [dx, dz] = DIR[d], nx = gx + dx, nz = gz + dz;
  if (BLOQUEIO.has(k(gx, gz) + '|' + k(nx, nz)) || BLOQUEIO.has(k(nx, nz) + '|' + k(gx, gz))) return false;
  if (SAIDAS.has(k(gx, gz) + d)) return true;
  if (RUA.has(k(nx, nz))) return true;
  return naRot(nx, nz) && (nx === ROT[0] || nz === ROT[1]);            // braço da rotatória
}
const TIPO = {};                                                        // tipo de cada ladrilho de rua (para postes, semáforos e carros)
for (const c of RUA) {
  const [gx, gz] = c.split(',').map(Number);
  const l = ['N', 'S', 'E', 'W'].filter(d => liga(gx, gz, d));
  let nome;
  if (l.length === 4) nome = 'rua-cruzamento';
  else if (l.length === 3) nome = 'rua-t';
  else if (l.length === 2) nome = (l.includes('N') && l.includes('S')) || (l.includes('E') && l.includes('W')) ? 'rua-reta' : 'rua-curva';
  else if (l.length === 1) nome = 'rua-fim';
  else continue;
  TIPO[c] = { nome, l };
  ladrilho(nome, gx, gz, 0, nome === 'rua-cruzamento' ? null : l);
}
ladrilho('rotatoria', ROT[0], ROT[1]);
colocar('poste-luz-duplo', ROT[0] * TILE, ROT[1] * TILE, Math.PI / 2, CALCADA, { halo: true });
colocar('arvore-palmeira', ROT[0] * TILE + 2.2, ROT[1] * TILE + 1.5, 0.4);
colocar('arvore-palmeira', ROT[0] * TILE - 2.0, ROT[1] * TILE - 1.8, 1.9);

// postes de luz nas retas (um ladrilho sim, outro não, alternando o lado) e semáforos no centro
for (const [c, t] of Object.entries(TIPO)) {
  const [gx, gz] = c.split(',').map(Number);
  if (t.nome === 'rua-reta' && (gx + gz) % 2 === 0) {
    const lado = (gx + gz) % 4 === 0 ? 1 : -1;
    if (t.l.includes('N')) colocar('poste-luz', gx * TILE + 4.85 * lado, gz * TILE, lado > 0 ? -Math.PI / 2 : Math.PI / 2, CALCADA, { halo: true });
    else colocar('poste-luz', gx * TILE, gz * TILE + 4.85 * lado, lado > 0 ? Math.PI : 0, CALCADA, { halo: true });
  }
  if (t.nome === 'rua-cruzamento' && gx >= 9 && gx <= 27 && gz >= 8 && gz <= 20) {
    const ns = (gx + gz) % 2 ? 'vermelho' : 'verde', lo = ns === 'verde' ? 'vermelho' : 'verde';
    for (const [x, z, a, e] of [[4.7, 4.7, 0, ns], [-4.7, -4.7, Math.PI, ns], [-4.7, 4.7, -Math.PI / 2, lo], [4.7, -4.7, Math.PI / 2, lo]]) {
      P.push(kit.prop('semaforo-apagado', gx, gz, x, z, { rotY: a }).then(o => { kit.semaforoEstado(o, e); mundo.add(o); }));
    }
  }
  if (t.nome === 'rua-t' && R() < 0.5) {
    P.push(kit.prop('placa-pare', gx, gz, -4.8, 4.7, { rotY: -Math.PI / 2 }).then(o => mundo.add(o)));
  }
}
// hidrantes e placas espalhados pelas calçadas
for (const [c, t] of Object.entries(TIPO)) {
  const [gx, gz] = c.split(',').map(Number);
  if (t.nome !== 'rua-reta' || R() > 0.18) continue;
  const vert = t.l.includes('N'), s = R() < 0.5 ? 1 : -1, nome = escolha(['hidrante', 'hidrante-amarelo', 'placa-velocidade-40', 'placa-proibido-estacionar', 'placa-pedestres']);
  colocar(nome, gx * TILE + (vert ? 4.8 * s : 2.5), gz * TILE + (vert ? 2.5 : 4.8 * s), vert ? (s > 0 ? -Math.PI / 2 : Math.PI / 2) : (s > 0 ? Math.PI : 0));
}
colocar('placa-rua-hryz', 9 * TILE + 4.8, 14 * TILE + 4.8, Math.PI / 4);

// carros nas ruas (mão direita; parados ou andando)
for (const [c, t] of Object.entries(TIPO)) {
  const [gx, gz] = c.split(',').map(Number);
  if (t.nome !== 'rua-reta' || R() > 0.35) continue;
  const vert = t.l.includes('N'), sentido = R() < 0.5 ? 1 : -1;
  const p = kit.naPista(gx, gz, vert ? 0 : 1, sentido, (R() - 0.5) * 6);
  carro(escolha(CARROS), p.x, p.z, p.ry);
}

// ======================================================================================================
// 2. Quadras
// ======================================================================================================
const quadra = (c, r) => ({ x0: 4 + 6 * c, x1: 8 + 6 * c, z0: 3 + 6 * r, z1: 7 + 6 * r });
const livre = (gx, gz) => !RUA.has(k(gx, gz)) && !naRot(gx, gz);
const PISOS = [];                                                   // o piso das quadras é posto no fim, só onde não há outro ladrilho
function piso(gx0, gx1, gz0, gz1, nome) { for (let gx = gx0; gx <= gx1; gx++) for (let gz = gz0; gz <= gz1; gz++) if (livre(gx, gz)) PISOS.push([nome, gx, gz]); }
const ARVORES = ['arvore-redonda', 'arvore-frondosa', 'arvore-ipe-amarelo', 'arvore-ipe-rosa', 'arvore-pinheiro', 'arvore-cipreste'];
const arvore = (x, z, esc = 0.85 + R() * 0.3) => colocar(escolha(ARVORES), x, z, R() * 6.28, CALCADA, { escala: esc });
const CASAS_KIT = ['casa-simples', 'casa-sobrado', 'casa-moderna', 'casa-colonial'];
const CERCAS = ['cerca-madeira-portao', 'muro-portao', 'grade-ferro', 'cerca-madeira'];
const casaDrummy = () => `../casas/casa${2 + Math.floor(R() * 5)}-${escolha(['a', 'b', 'c'])}.glb`;

/** lotes em volta da quadra, cada casa de frente para a rua mais próxima; o miolo vira quintal com árvores */
function bairro(c, r, estilo) {
  const q = quadra(c, r);
  piso(q.x0, q.x1, q.z0, q.z1, 'chao-grama');
  const lotes = [];
  for (let gx = q.x0; gx <= q.x1; gx++) { lotes.push([gx, q.z0, Math.PI]); lotes.push([gx, q.z1, 0]); }
  for (let gz = q.z0 + 1; gz < q.z1; gz++) { lotes.push([q.x0, gz, -Math.PI / 2]); lotes.push([q.x1, gz, Math.PI / 2]); }
  for (const [gx, gz, ang] of lotes) {
    if (!livre(gx, gz)) continue;
    const x = gx * TILE, z = gz * TILE, fx = Math.sin(ang), fz = Math.cos(ang);
    const drummy = estilo === 'drummy' || (estilo === 'misto' && R() < 0.5);
    if (drummy) modelo(casaDrummy(), x, z, ang);
    else {
      colocar(escolha(CASAS_KIT), x, z, ang);
      colocar(escolha(CERCAS), x + fx * 5.85, z + fz * 5.85, ang);
    }
    if (R() < 0.7) arvore(x - fz * 4.6 + fx * 4.2, z + fx * 4.6 + fz * 4.2, 0.7 + R() * 0.2);
  }
  for (let gx = q.x0 + 1; gx < q.x1; gx++) for (let gz = q.z0 + 1; gz < q.z1; gz++) {
    if (!livre(gx, gz)) continue;
    for (let j = 0; j < 2; j++) arvore(gx * TILE + (R() - 0.5) * 9, gz * TILE + (R() - 0.5) * 9);
  }
}

/** muro em volta de um retângulo de ladrilhos, com um portão; lados = trechos de 12 m na borda das quadras */
function muro(gx0, gx1, gz0, gz1, portao = null, pular = []) {
  const ix = 0.4;
  for (let gx = gx0; gx <= gx1; gx++) {
    for (const [gz, z, ang] of [[gz0, (gz0 - 0.5) * TILE + ix, Math.PI], [gz1, (gz1 + 0.5) * TILE - ix, 0]]) {
      if (pular.includes(k(gx, gz))) continue;
      colocar(portao === k(gx, gz) + (ang ? 'N' : 'S') ? 'muro-portao' : 'muro', gx * TILE, z, ang);
    }
  }
  for (let gz = gz0; gz <= gz1; gz++) {
    for (const [gx, x, ang] of [[gx0, (gx0 - 0.5) * TILE + ix, -Math.PI / 2], [gx1, (gx1 + 0.5) * TILE - ix, Math.PI / 2]]) {
      if (pular.includes(k(gx, gz))) continue;
      colocar(portao === k(gx, gz) + (ang < 0 ? 'W' : 'E') ? 'muro-portao' : 'muro', x, gz * TILE, ang);
    }
  }
}

// ---- bairros de casas
bairro(0, 0, 'kit'); bairro(1, 0, 'drummy'); bairro(0, 1, 'misto'); bairro(0, 3, 'kit'); bairro(1, 3, 'drummy');
bairro(0, 4, 'drummy'); bairro(1, 4, 'kit'); bairro(4, 2, 'misto'); bairro(4, 3, 'kit'); bairro(4, 4, 'drummy');

// ---- centro: hospital e delegacia (quadra 1,1)
{
  const q = quadra(1, 1);
  piso(q.x0, q.x1, q.z0, q.z1, 'calcada-lisa');
  colocar('hospital', 12 * 12, 12 * 9.5, Math.PI);                   // de frente para a rua de cima
  colocar('delegacia', 12 * 11.5, 12 * 13, 0);
  colocar('predio-loja-3', 12 * 10, 12 * 13, 0);
  colocar('predio-loja-3', 12 * 13.5 + 6, 12 * 13, 0);
  for (const gx of [10, 14]) ladrilho('estacionamento', gx, 11, 0);
  P.push(glb('../veiculos/ambulance.glb').then(o => { o.scale.setScalar(ESCALA_VEICULO); o.position.set(144, CALCADA, 12 * 9.5 - 13); o.rotation.y = Math.PI; mundo.add(o); }));
  carro('police', 12 * 11.5 + 4, 12 * 13 + 5.4, Math.PI / 2, CALCADA);
}
// ---- praça central (quadra 2,1): canteiros, palmeiras, bancos, mesas e postes de pedestre
{
  const q = quadra(2, 1);
  for (let gx = q.x0; gx <= q.x1; gx++) for (let gz = q.z0; gz <= q.z1; gz++) ladrilho((gx + gz) % 2 ? 'calcada-lisa' : (gx === 18 && gz === 11 ? 'calcada-cruzamento' : 'gramado-flores'), gx, gz);
  const cx = 18 * TILE, cz = 11 * TILE;
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; colocar('arvore-palmeira', cx + Math.cos(a) * 16, cz + Math.sin(a) * 16, a); }
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; colocar('banco-praca', cx + Math.cos(a) * 9, cz + Math.sin(a) * 9, -a + Math.PI / 2); }
  for (const [dx, dz] of [[-22, -22], [22, -22], [-22, 22], [22, 22]]) {
    colocar('mesa-redonda', cx + dx, cz + dz, 0);
    for (let c = 0; c < 4; c++) { const a = c * Math.PI / 2 + 0.4; colocar('cadeira-plastica', cx + dx + Math.sin(a) * 0.72, cz + dz + Math.cos(a) * 0.72, a + Math.PI); }
  }
  for (const [dx, dz] of [[-12, -12], [12, -12], [-12, 12], [12, 12], [0, -24], [0, 24], [-24, 0], [24, 0]]) colocar('poste-luz-pedestre', cx + dx, cz + dz, 0, CALCADA, { halo: true });
  colocar('arvore-ipe-amarelo', cx - 26, cz - 4, 0.3); colocar('arvore-ipe-rosa', cx + 26, cz + 4, 1.2);
}
// ---- torres comerciais (quadra 3,1)
{
  const q = quadra(3, 1);
  piso(q.x0, q.x1, q.z0, q.z1, 'calcada-lisa');
  colocar('predio-comercial-10', 12 * 22.5 + 6, 12 * 9, Math.PI);
  colocar('predio-comercial-10', 12 * 25 + 6, 12 * 9, Math.PI);
  colocar('predio-residencial-12', 12 * 22, 12 * 13, 0);
  colocar('predio-comercial-10', 12 * 23.5 + 6, 12 * 13, 0);
  colocar('predio-residencial-12', 12 * 26, 12 * 13, 0);
  for (let gz = 10; gz <= 12; gz++) for (let gx = 22; gx <= 26; gx += 2) arvore(gx * TILE, gz * TILE, 0.7);
}
// ---- supermercado com estacionamento (quadra 2,0)
{
  const q = quadra(2, 0);
  piso(q.x0, q.x1, q.z0, q.z1, 'calcada-lisa');
  colocar('supermercado', 12 * 18, 12 * 3.5, Math.PI);
  for (let gx = q.x0; gx <= q.x1; gx++) for (const gz of [6, 7]) {
    ladrilho('estacionamento', gx, gz, gz === 6 ? 2 : 0);
    for (const bx of [-4.5, -1.5, 1.5, 4.5]) if (R() < 0.6) carro(escolha(CARROS), gx * TILE + bx, gz * TILE + (gz === 6 ? 3.5 : -3.5), gz === 6 ? 0 : Math.PI, CALCADA);
  }
}
// ---- prédios residenciais (quadra 3,0)
{
  const q = quadra(3, 0);
  piso(q.x0, q.x1, q.z0, q.z1, 'chao-grama');
  for (const [gx, gz, a, n] of [[22, 3, Math.PI, 6], [24, 3, Math.PI, 12], [26, 3, Math.PI, 6], [22, 7, 0, 12], [24, 7, 0, 6], [26, 7, 0, 12]]) colocar(`predio-residencial-${n}`, gx * TILE, gz * TILE, a);
  for (let gx = 22; gx <= 26; gx++) arvore(gx * TILE, 5 * TILE);
}
// ---- cinema e lojas (quadra 1,2)
{
  const q = quadra(1, 2);
  piso(q.x0, q.x1, q.z0, q.z1, 'calcada-lisa');
  colocar('cinema', 12 * 12, 12 * 15.5, Math.PI);
  for (const gx of [10, 14]) colocar('predio-loja-3', gx * TILE, 12 * 15, Math.PI);
  for (const gx of [10, 12, 14]) colocar(gx === 12 ? 'predio-residencial-6' : 'predio-loja-3', gx * TILE, 12 * 19, 0);
  for (const gx of [11, 13]) arvore(gx * TILE, 12 * 17.5, 0.75);
}
// ---- comércio e moradia (quadras 2,2 / 2,3 / 2,4 / 3,2)
for (const [c, r] of [[2, 2], [2, 3], [2, 4], [3, 2]]) {
  const q = quadra(c, r);
  piso(q.x0, q.x1, q.z0, q.z1, 'calcada-lisa');
  for (let gx = q.x0; gx <= q.x1; gx += 2) {
    if (livre(gx, q.z0)) colocar(escolha(['predio-loja-3', 'predio-residencial-6', 'predio-residencial-6']), gx * TILE, q.z0 * TILE, Math.PI);
    if (livre(gx, q.z1)) colocar(escolha(['predio-loja-3', 'predio-residencial-6', 'predio-residencial-12']), gx * TILE, q.z1 * TILE, 0);
  }
  for (let gz = q.z0 + 1; gz < q.z1; gz++) for (let gx = q.x0; gx <= q.x1; gx++) {
    if (!livre(gx, gz)) continue;
    if (gz === q.z0 + 2) { ladrilho('estacionamento', gx, gz, 0); if (R() < 0.6) carro(escolha(CARROS), gx * TILE + escolha([-4.5, -1.5, 1.5, 4.5]), gz * TILE - 3.5, Math.PI, CALCADA); }
    else if (R() < 0.5) arvore(gx * TILE, gz * TILE, 0.7);
  }
}
// ---- condomínio de prédios (quadra 0,2): torres, piscina, muro com portão e guarita
{
  const q = quadra(0, 2);
  piso(q.x0, q.x1, q.z0, q.z1, 'gramado-detalhado');
  for (const [gx, gz, a] of [[4, 15, Math.PI], [8, 15, Math.PI], [4, 19, 0], [8, 19, 0]]) colocar('predio-residencial-12', gx * TILE, gz * TILE, a);
  colocar('predio-residencial-6', 6 * TILE, 15 * TILE, Math.PI);
  colocar('piscina', 6 * TILE, 17 * TILE, 0);
  for (const [x, z] of [[5, 16], [7, 16], [5, 18.2], [7, 18.2]]) colocar('arvore-palmeira', x * TILE, z * TILE, R() * 6);
  colocar('banco-praca', 6 * TILE - 5, 18.2 * TILE, 0); colocar('banco-praca', 6 * TILE + 5, 18.2 * TILE, 0);
  muro(q.x0, q.x1, q.z0, q.z1, k(6, 19) + 'S');
}
// ---- condomínio fechado de casas "Jardim Hryz" (quadras 3,3 e 3,4): rua interna com portaria, casas, piscina e área verde
{
  const gx0 = 22, gx1 = 26, gz0 = 22, gz1 = 31;
  piso(gx0, gx1, 21, gz1, 'chao-grama');
  ladrilho('gramado-flores', 23, 21); ladrilho('gramado-flores', 25, 21);
  for (let gx = 23; gx <= 26; gx++) arvore(gx * TILE, 21 * TILE, 0.8);
  colocar('guarita', 22 * TILE, 26 * TILE, Math.PI / 2, 0);              // portaria em cima da rua interna (a rua corre em X)
  for (let gx = 22; gx <= 26; gx++) {
    for (const [gz, ang] of [[25, 0], [27, Math.PI]]) {
      if (gx === 22) continue;                                           // o primeiro lote de cada lado fica para a portaria
      modelo(casaDrummy(), gx * TILE, gz * TILE, ang);
      arvore(gx * TILE + 4.5, gz * TILE + (ang ? 4.2 : -4.2), 0.7);
    }
  }
  for (let gx = 23; gx <= 26; gx++) for (const gz of [29, 31]) { modelo(casaDrummy(), gx * TILE, gz * TILE, gz === 29 ? Math.PI : 0); }
  colocar('piscina', 24.5 * TILE, 23 * TILE, 0);
  for (const gx of [22, 26]) for (const gz of [23, 24]) arvore(gx * TILE, gz * TILE);
  for (let gx = 23; gx <= 26; gx++) arvore(gx * TILE, 30 * TILE + (R() - 0.5) * 3, 0.8);
  colocar('mesa-piquenique', 23 * TILE, 24 * TILE + 3, 0.3); colocar('mesa-piquenique', 26 * TILE, 24 * TILE + 3, -0.3);
  // muro: norte em z = 21,5, sul em 31,5, oeste em 21,5 (aberto na rua interna), leste em 26,5
  muro(gx0, gx1, gz0, gz1, null, [k(22, 26)]);
  carro('suv-luxury', 22 * TILE - 7, 26 * TILE + 1.75, -Math.PI / 2);   // esperando a cancela
}
// ---- parque com campo de várzea (quadras 4,0 e 4,1 juntas)
{
  piso(28, 32, 3, 13, 'chao-grama');
  P.push(kit.peca('campo-futebol').then(o => { o.position.set(29.5 * TILE, 0, 8.5 * TILE); o.rotation.y = Math.PI / 2; mundo.add(o); }));   // 48 x 72 m: ladrilhos 28..31 x 6..11
  for (let gx = 28; gx <= 31; gx++) for (let gz = 6; gz <= 11; gz++) OCUPADO.add(k(gx, gz));
  for (let gz = 3; gz <= 13; gz++) {
    if (R() < 0.9) arvore(32 * TILE + (R() - 0.5) * 4, gz * TILE + (R() - 0.5) * 4);
    if ((gz < 6 || gz > 11) && R() < 0.9) for (let gx = 28; gx <= 31; gx++) if (R() < 0.4) arvore(gx * TILE + (R() - 0.5) * 6, gz * TILE + (R() - 0.5) * 6);
  }
  for (const gz of [3, 13]) for (let gx = 29; gx <= 31; gx++) { colocar('banco-praca', gx * TILE, gz * TILE + (gz === 3 ? 2 : -2), gz === 3 ? 0 : Math.PI); }
  colocar('mesa-piquenique', 28 * TILE + 2, 3 * TILE + 2, 0.4); colocar('mesa-piquenique', 32 * TILE - 2, 13 * TILE - 2, -0.4);
  for (const gz of [5, 12]) for (const gx of [28, 31]) colocar('poste-luz-pedestre', gx * TILE, gz * TILE, 0, CALCADA, { halo: true });
}

// ======================================================================================================
// 3. Rodovia (oeste, ao longo de Z, centro em x = 12) com saídas para a cidade e para o aeroporto
// ======================================================================================================
const RX = TILE;
for (let gz = -40; gz <= 80; gz++) ladrilho(gz === 8 || gz === 34 ? 'rodovia-acesso' : 'rodovia-reta', 1, gz);
for (let gz = -39; gz <= 80; gz += 3) colocar('poste-rodovia', RX, gz * TILE, 0, CALCADA, { halo: true });
colocar('placa-rodovia-saida', RX + 17.6, 11 * TILE, 0, CALCADA);               // para quem desce (anda para -Z) pelo lado leste
colocar('placa-rodovia-aeroporto', RX + 17.6, 39 * TILE, 0, CALCADA);
colocar('placa-rodovia-cidade', RX - 17.6, -2 * TILE, Math.PI, CALCADA);       // para quem sobe (anda para +Z) pelo lado oeste
colocar('placa-rodovia-saida', RX - 17.6, 30 * TILE, Math.PI, CALCADA);
for (let gz = -40; gz <= 80; gz++) {
  for (const [lx, sent] of [[-5.75, 1], [-9.25, 1], [-12.75, 1], [5.75, -1], [9.25, -1], [12.75, -1]]) {
    if (R() > 0.16) continue;
    const nome = Math.abs(lx) > 12 ? escolha(PESADOS) : escolha(CARROS);
    carro(nome, RX + lx, gz * TILE + (R() - 0.5) * 8, sent > 0 ? 0 : Math.PI);
  }
}

// ======================================================================================================
// 4. Aeroporto (sul): estacionamento, terminal com três aviões nos fingers, pista de táxi, pista de pouso, torre e hangar
// ======================================================================================================
const TX = 15 * TILE;                       // centro do terminal em x
const TZ = 441;                             // centro do terminal em z (a frente, para a avenida, fica em z = 423)
const AP = TZ + 42;                         // centro das posições de avião (pátio)
const TAXI = 519, PISTA = 567;
for (let gx = 9; gx <= 21; gx++) {
  ladrilho('estacionamento', gx, 33, 0);
  for (const bx of [-4.5, -1.5, 1.5, 4.5]) if (R() < 0.65) carro(escolha(CARROS), gx * TILE + bx, 33 * TILE - 3.5, Math.PI, CALCADA);
}
colocar('terminal-aeroporto', TX, TZ, Math.PI, CALCADA, { halo: true });
for (const dx of [-48, 0, 48]) colocar('patio-posicao', TX + dx, AP, 0, 0);
for (const x of [TX - 96, TX + 96, TX + 120, TX + 144]) for (const z of [AP - 12, AP + 12]) colocar('patio', x, z, 0, 0);
for (let x = 84; x <= 516; x += 12) colocar('pista-taxi', x, TAXI, Math.PI / 2, 0);
for (const x of [96, 504]) colocar('pista-taxi', x, (TAXI + PISTA) / 2, 0, 0);
for (let i = 0; i < 10; i++) {
  const x = 84 + 48 * i;
  colocar(i === 0 ? 'pista-cabeceira' : i === 9 ? 'pista-cabeceira' : 'pista-reta', x, PISTA, i === 9 ? -Math.PI / 2 : Math.PI / 2, 0);
}
colocar('torre-controle', TX - 120, TZ, Math.PI, CALCADA, { halo: true });
colocar('hangar', TX + 168, AP, 0, 0.16, { halo: true });
colocar('biruta', 520, PISTA - 36, 0, CALCADA);

// aviões: trem de pouso simples (o modelo não tem rodas) e o jato Hryz
const RODA = new THREE.MeshStandardMaterial({ color: 0x1d1f23, roughness: 0.8 }), PERNA = new THREE.MeshStandardMaterial({ color: 0xb8bec6, metalness: 0.5, roughness: 0.4 });
function aviao(x, y, z, ang, { pitch = 0, rodas = true } = {}) {
  P.push(glb('../aviao/jato-hryz.glb').then(o => {
    const g = new THREE.Group();
    g.add(o);
    if (rodas) {
      for (const [px, pz] of [[0, 15.5], [-3.2, -1.5], [3.2, -1.5]]) {
        const perna = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 4.2, 8), PERNA); perna.position.set(px, -3.5, pz); g.add(perna);
        for (const dx of [-0.45, 0.45]) {
          const r = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.42, 14), RODA); r.rotation.z = Math.PI / 2; r.position.set(px + dx, -5.4, pz); r.castShadow = true; g.add(r);
        }
      }
    }
    g.position.set(x, y, z); g.rotation.set(0, ang, 0, 'YXZ'); g.rotateX(-pitch);
    mundo.add(g);
  }));
}
const YA = 0.16 + 6.0;                                     // altura do eixo da fuselagem com as rodas no chão
for (const dx of [-48, 0, 48]) aviao(TX + dx, YA, AP - 12 + 20, Math.PI);   // nariz na barra de parada (z = AP - 12), virado para o terminal
aviao(330, YA, TAXI, -Math.PI / 2);                                         // taxiando para oeste
aviao(400, 46, PISTA - 4, Math.PI / 2, { pitch: 0.16, rodas: false });       // decolando para leste
for (const dx of [-60, 30]) { carro('delivery-flat', TX + dx, AP + 4, 0, 0.16); carro('van', TX + dx + 8, AP - 2, Math.PI / 2, 0.16); }

// ======================================================================================================
// 5. Estádio (leste) com estacionamento na frente
// ======================================================================================================
P.push(kit.peca('estadio-futebol').then(o => { o.position.set(40.5 * TILE, 0, 7 * TILE); if (NOITE) kit.luzEstado(o, true); mundo.add(o); }));
for (let gz = 3; gz <= 11; gz++) {
  ladrilho('estacionamento', 34, gz, 1);
  for (const bz of [-4.5, -1.5, 1.5, 4.5]) if (R() < 0.6) carro(escolha(CARROS), 34 * TILE + 3.5, gz * TILE + bz, -Math.PI / 2, CALCADA);
}
for (let gx = 36; gx <= 46; gx += 2) colocar('arvore-palmeira', gx * TILE, 1 * TILE - 1.5, R() * 6);

// ======================================================================================================
// 6. Pessoas do elenco na praça, na calçada do hospital e no terminal
// ======================================================================================================
if (PESSOAS) {
  P.push((async () => {
    const { Personagem } = await import('../personagens/elenco/elenco.js');
    const elenco = [['homem', 'Andar'], ['mae', 'Andar'], ['jovem_a', 'Parado'], ['jovem_b', 'Andar'], ['policial', 'Parado'], ['entregador', 'Andar'], ['velha', 'Parado'], ['davi', 'Correr']];
    const lugares = [[18 * TILE - 6, 11 * TILE + 3, 0.6], [18 * TILE + 5, 11 * TILE - 6, 2.2], [18 * TILE + 3, 11 * TILE + 7, 3.4], [18 * TILE - 9, 11 * TILE - 2, 1.4],
                     [12 * 11.5 + 2, 12 * 13 + 4.6, 0], [17 * TILE, 14 * TILE + 5, -Math.PI / 2], [TX - 10, TZ - 22, Math.PI], [18 * TILE + 10, 11 * TILE + 10, 4.0]];
    for (let i = 0; i < elenco.length; i++) {
      const p = await Personagem.carregar(`../personagens/elenco/${elenco[i][0]}.glb`);
      const [x, z, a] = lugares[i];
      p.obj.position.set(x, CALCADA, z); p.obj.rotation.y = a;
      p.pose(elenco[i][1], 0.3 + i * 0.17);
      p.obj.traverse(m => { if (m.isMesh) m.castShadow = true; });
      mundo.add(p.obj);
    }
  })());
}

// ======================================================================================================
// câmeras e sombra
// ======================================================================================================
const CAMS = {
  aereo:      { pos: [760, 520, 980], alvo: [260, 0, 290], fov: 40, raio: 560 },
  topo:       { pos: [270, 1250, 300.1], alvo: [270, 0, 300], fov: 40, raio: 600 },
  centro:     { pos: [330, 120, 300], alvo: [200, 0, 140], fov: 42, raio: 170 },
  rua:        { pos: [112, 1.8, 170.4], alvo: [230, 9, 166], fov: 55, raio: 140 },
  aeroporto:  { pos: [330, 90, 640], alvo: [190, 0, 470], fov: 42, raio: 220 },
  pista:      { pos: [250, 4, 600], alvo: [330, 18, 545], fov: 50, raio: 160 },
  rodovia:    { pos: [62, 26, 300], alvo: [12, 0, 110], fov: 45, raio: 200 },
  condominio: { pos: [390, 80, 400], alvo: [288, 0, 315], fov: 42, raio: 120 },
  predios:    { pos: [-20, 60, 310], alvo: [72, 10, 210], fov: 42, raio: 120 },
  estadio:    { pos: [700, 160, 300], alvo: [486, 0, 84], fov: 42, raio: 200 },
  parque:     { pos: [470, 70, 200], alvo: [360, 0, 96], fov: 42, raio: 130 },
  bairro:     { pos: [120, 45, 400], alvo: [72, 0, 330], fov: 45, raio: 110 },
};
const num = s => s.split(',').map(Number);
const cfg = Q.get('pos') ? { pos: num(Q.get('pos')), alvo: num(Q.get('alvo') || '260,0,290'), fov: +(Q.get('fov') || 45), raio: +(Q.get('raio') || 200) } : (CAMS[CAM] || CAMS.aereo);
const camera = new THREE.PerspectiveCamera(cfg.fov, innerWidth / innerHeight, 0.3, 6000);
camera.position.set(...cfg.pos);
const alvo = new THREE.Vector3(...cfg.alvo);
camera.lookAt(alvo);
const ctl = new OrbitControls(camera, renderer.domElement);
ctl.target.copy(alvo); ctl.update();
function sombra(c, raio) {
  sun.target.position.copy(c);
  sun.position.copy(c).add((NOITE ? new THREE.Vector3(0.45, 1, -0.55) : new THREE.Vector3(-0.55, 1, 0.45)).multiplyScalar(raio * 2));
  Object.assign(sun.shadow.camera, { left: -raio, right: raio, top: raio, bottom: -raio, near: 1, far: raio * 5 });
  sun.shadow.camera.updateProjectionMatrix();
}
sombra(alvo, cfg.raio);

for (const [nome, gx, gz] of PISOS) if (!OCUPADO.has(k(gx, gz))) ladrilho(nome, gx, gz);
let feitos = 0;
P.forEach(p => p.then(() => { feitos++; if (feitos % 50 === 0) carga.textContent = `carregando… ${feitos}/${P.length}`; }));
await Promise.all(P);
carga.textContent = '';
function frame() { renderer.render(scene, camera); }
ctl.addEventListener('change', () => { sombra(ctl.target, Math.max(120, Math.min(600, camera.position.distanceTo(ctl.target) * 0.7))); frame(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frame(); });
frame();
window.__ready = true;
window.__objetos = mundo.children.length;
</script>
