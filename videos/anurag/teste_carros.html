<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folha de carros</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const Q = new URLSearchParams(location.search);
const lista = (Q.get('c') || 'sedan,sedan-sports,hatchback-sports,suv,suv-luxury,taxi,police,van').split(',');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa0b8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.4));
const sol = new THREE.DirectionalLight(0xffffff, 2.2); sol.position.set(4, 8, 6); scene.add(sol);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x555a63, roughness: 1 })); chao.rotation.x = -Math.PI / 2; scene.add(chao);
const loader = new GLTFLoader();
const cols = 4, esp = 4.6;
for (let i = 0; i < lista.length; i++) {
  const g = (await loader.loadAsync('../biblioteca3d/veiculos/' + lista[i] + '.glb')).scene;
  g.scale.setScalar(1.7);
  g.position.set((i % cols - (cols - 1) / 2) * esp, 0, Math.floor(i / cols) * -6.5);
  g.rotation.y = 0.65;
  scene.add(g);
}
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
cam.position.set(0, 9.5, 17); cam.lookAt(0, 0.4, -3.2);
window.__setTime = () => renderer.render(scene, cam);
window.__ready = true;
</script>
</body>
</html>
