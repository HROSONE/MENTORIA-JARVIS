<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste de desempenho</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Kit } from '../biblioteca3d/cidade/kit.js';
import { Personagem } from '../biblioteca3d/personagens/elenco/elenco.js';

const Q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: Q.get('aa') !== '0', preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = Q.get('sombra') !== '0'; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.FogExp2(0x0a1022, 0.018);
scene.add(new THREE.HemisphereLight(0x5f78b8, 0x16130f, 0.9));

const kit = await Kit.carregar('../biblioteca3d/cidade/');
const tiles = [];
for (let gx = -3; gx <= 3; gx++) tiles.push(kit.ladrilho('rua-reta', gx, 0, 1));
const objs = await Promise.all(tiles);
objs.forEach(o => scene.add(o));
const casa = await kit.prop('casa-simples', 0, -1, 0, 0, { calcada: false });
scene.add(casa); kit.luzEstado(casa, true);
const poste = await kit.prop('poste-luz', 1, 0, 0, -5.2);
scene.add(poste); kit.luzEstado(poste, true);
const luzP = new THREE.PointLight(0xffa850, 90, 26, 2); luzP.position.set(12, 6, -5); luzP.castShadow = Q.get('sombra') !== '0'; scene.add(luzP);

const loader = new GLTFLoader();
async function carro(nome, x, z, ry) {
  const g = (await loader.loadAsync('../biblioteca3d/veiculos/' + nome + '.glb')).scene;
  g.scale.setScalar(1.7); g.position.set(x, 0, z); g.rotation.y = ry;
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g);
  const sp = new THREE.SpotLight(0xfff0d0, 260, 50, 0.5, 0.6, 1.4);
  sp.position.set(x, 0.8, z); scene.add(sp); scene.add(sp.target);
  sp.target.position.set(x + Math.sin(ry) * 10, 0, z + Math.cos(ry) * 10);
  return g;
}
const c1 = await carro('hatchback-sports', -4, -1.75, Math.PI / 2);
const c2 = await carro('suv', -10, -1.75, Math.PI / 2);
const nomes = ['davi.glb', 'teo.glb', 'lia.glb', 'nina.glb', 'maniaco.glb', 'velha.glb'];
const atores = [];
for (let i = 0; i < nomes.length; i++) {
  const p = await Personagem.carregar('../biblioteca3d/personagens/elenco/' + nomes[i]);
  p.obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  p.obj.position.set(2 + i * 0.9, 0.15, 3.8 + (i % 2) * 0.5); p.obj.rotation.y = Math.PI / 2 + 0.2 * i;
  p.tocar('Correr'); scene.add(p.obj); atores.push(p);
}
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
window.__setTime = t => {
  for (const a of atores) a.pose('Correr', t);
  cam.position.set(-3 + t * 2, 1.4, 6.5); cam.lookAt(4 + t * 2, 1.0, 2);
  renderer.render(scene, cam);
};
window.__ready = true;
</script>
</body>
</html>
