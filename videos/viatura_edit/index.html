<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Edit da viatura — cena 3D (render por quadro)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05070d}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Protocolo do projeto: window.__total (s) e window.__frame(t, { jpeg }) -> dataURL. Os cortes e as luzes caem nas batidas (ver js/planos.js).
import * as THREE from 'three';
import { criarViatura } from '../biblioteca3d/veiculos/policia/viatura.js';
import { criarMundo } from './js/cena.js';
import { criarFumaca, criarMarcas } from './js/fumaca.js';
import { PLANOS, planoEm, rampa, loc, B, TOTAL } from './js/planos.js';

const Q = new URLSearchParams(location.search), W = +(Q.get('w') || 720), H = +(Q.get('h') || 1280);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2; document.body.prepend(renderer.domElement);

const mundo = criarMundo(renderer), scene = mundo.scene;
const carro = criarViatura({ livery: Q.get('livery') || 'preto-branco', numero: '117', sujeira: 0.45 });
carro.grupo.rotation.order = 'YXZ'; scene.add(carro.grupo); carro.farois(true, 5);
const fumaca = criarFumaca(scene, H), marcas = criarMarcas(scene);
const camera = new THREE.PerspectiveCamera(46, W / H, 0.04, 400);
const acum = document.createElement('canvas'); acum.width = W; acum.height = H; const actx = acum.getContext('2d');

const pulso = (x, k = 9) => x >= 0 ? Math.exp(-k * x) : 0;
function estrobo(modo, t) {                                                                  // luzes de emergência na batida (t = tempo da linha do tempo)
  const bt = t / B, ph = bt - Math.floor(bt);
  if (modo === 'bar') { const par = Math.floor(bt) % 2, f = Math.max(pulso(ph), pulso(ph - 0.30)); return { v: par ? 0.08 : f, a: par ? f : 0.08, ambar: 0.25, busca: 0, forca: 16 }; }
  if (modo === 'oitavo') { const h = bt * 2, par = Math.floor(h) % 2, p = h - Math.floor(h), f = Math.max(pulso(p, 7), pulso(p - 0.5, 7) * 0.75); return { v: par ? 0.10 : f, a: par ? f : 0.10, ambar: 0.45, busca: 0, forca: 20 }; }
  if (modo === 'meio') { const h = bt / 2, par = Math.floor(h) % 2, p = h - Math.floor(h), f = 0.35 + 0.65 * pulso(p, 3.2); return { v: par ? 0.05 : f, a: par ? f : 0.05, ambar: 0.2, busca: 0, forca: 14 }; }
  return { v: 0, a: 0, ambar: 0, busca: 0, forca: 0 };
}
const tremor = (t, a) => [a * (Math.sin(t * 17.3) + 0.6 * Math.sin(t * 31.1 + 1)), a * (Math.sin(t * 13.7 + 2) + 0.5 * Math.sin(t * 27.9)), a * (Math.sin(t * 11.1 + 4) + 0.5 * Math.sin(t * 23.3 + 3))];

const _p = new THREE.Vector3(), _a = new THREE.Vector3(), _f = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3();
function montar(t) {                                                                         // posiciona carro, câmera, fumaça e luzes para o instante t da linha do tempo
  const pl = planoEm(t), tau = Math.max(0, t - pl.b0 * B), dur = (pl.b1 - pl.b0) * B, u = pl.rampa ? pl.rampa(tau, dur) : tau;
  const c = pl.carro(u);
  carro.grupo.position.set(c.x, 0, c.z); carro.grupo.rotation.set(c.pitch, c.yaw, c.roll, 'YXZ');
  carro.rodar(c.dist); carro.esterco(c.steer); carro.freio(!!c.freio);
  const L = estrobo(pl.luz, t); carro.luzesManual({ ...L, t });
  const k = cam(pl, u, c, t);
  camera.fov = k.fov; camera.position.set(...k.pos); camera.updateProjectionMatrix();
  _a.set(...k.alvo); _f.subVectors(_a, camera.position).normalize();
  if (k.up) _u.set(...k.up); else { _r.crossVectors(_f, new THREE.Vector3(0, 1, 0)).normalize(); _u.crossVectors(_r, _f); const rr = (k.roll || 0) * Math.PI / 180; _u.multiplyScalar(Math.cos(rr)).addScaledVector(_r, Math.sin(rr)); }
  camera.up.copy(_u); camera.lookAt(_a);
  mundo.iluminar(camera.position, _a.set(c.x, 0.7, c.z));
  const barra = loc(c, 0, 1.6, -0.29);
  fumaca.atualizar(u, pl.fumaca, camera, { v: L.v, a: L.a, pos: barra });
  marcas.atualizar(u, pl.marcas);
  mundo.atualizar(t);
  return pl;
}
function cam(pl, u, c, t) {
  const k = pl.cam(u, c), bt = t / B, ph = bt - Math.floor(bt), tm = tremor(t, pl.tremor);
  const d = Math.hypot(k.alvo[0] - k.pos[0], k.alvo[1] - k.pos[1], k.alvo[2] - k.pos[2]);
  return { pos: [k.pos[0] + tm[0] * 0.25, k.pos[1] + tm[1] * 0.25, k.pos[2] + tm[2] * 0.25], alvo: [k.alvo[0] + tm[0] * d * 0.5, k.alvo[1] + tm[1] * d * 0.5, k.alvo[2] + tm[2] * d * 0.5],
    fov: k.fov * (1 - pl.soco * pulso(ph, 11)), roll: (k.roll || 0) + tm[2] * 90, up: k.up };
}

function quadro(t, opc = {}) {
  t = Math.min(Math.max(t, 0), TOTAL - 1e-4);
  const pl = planoEm(t), K = pl.mb || 1, jpeg = opc.jpeg ?? 0.93;
  if (K === 1) { montar(t); renderer.render(scene, camera); return renderer.domElement.toDataURL('image/jpeg', jpeg); }
  const obt = 0.42 / 30;                                                                     // obturador de ~150°
  for (let i = 0; i < K; i++) { montar(Math.min(t + ((i + 0.5) / K - 0.5) * obt, TOTAL - 1e-4)); renderer.render(scene, camera); actx.globalAlpha = 1 / (i + 1); actx.drawImage(renderer.domElement, 0, 0); }
  return acum.toDataURL('image/jpeg', jpeg);
}
window.__total = TOTAL; window.__frame = quadro; window.__planos = PLANOS.map(p => ({ nome: p.nome, b0: p.b0, b1: p.b1, t0: p.b0 * B, t1: p.b1 * B }));
quadro(+(Q.get('t') || 0)); window.__ready = true;
</script>
</body>
</html>
