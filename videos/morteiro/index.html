<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Morteiro 60 mm (animação)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Protocolo do projeto: window.__total (s), window.__frame(t, { jpeg, subs }) -> dataURL, window.__planos.
import { desenharTela, capturar, cam } from '../trex_corrida/js/motor.js';
import { construirTudo, atualizar, efeitos, S } from './js/planos.js';
await construirTudo();
const desenhar = t => { atualizar(t); desenharTela(); };
window.__frame = (t, opc = {}) => { const e = efeitos(t); return capturar(desenhar, t, { subs: opc.subs ?? e.subs ?? 1, obturador: 0.5, fade: e.fade || 0, flash: e.flash || 0, flashCor: '255,230,190', jpeg: opc.jpeg ?? 0.93 }); };
window.__total = S.total;
window.__planos = S.planos.map(p => ({ nome: p.id, t0: p.t0, t1: p.t0 + p.dur }));
window.__vista = (t, pos, alvo, fov = 50) => capturar(() => { atualizar(t); cam.position.set(...pos); cam.lookAt(...alvo); cam.fov = fov; cam.updateProjectionMatrix(); desenharTela(); }, t, { subs: 1, jpeg: 0.88 });
window.__ready = true;
</script>
</body>
</html>
