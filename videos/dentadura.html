<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================

   ===================================================================== */
const SEGMENTS = [
  { id:'molho',      dur:4.5 },  // "Você é a chapra da sua avó." (vovó põe a chapa de molho no copo)

  { id:'arcada',     dur:6.0 },  // "Você é o que os dentistas chamam de arcada dentária, mas para que você serve exatamente?"

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);

    uniform sampler2D tDiffuse; uniform float uVig,uTime; uniform vec2 uRes; uniform vec3 uTint; varying vec2 vUv;

      vec3 col = texture2D(tDiffuse, vUv).rgb * uTint;

/* ---------------- luzes ---------------- */
const hemi = new THREE.HemisphereLight(0xfff0dd, 0x4a3a40, 1.0); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1e0, 2.2);
key.position.set(-4, 9, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);

/* ---------------- cozinha ---------------- */

  const moon = new THREE.Mesh(new THREE.CircleGeometry(.28, 32), new THREE.MeshBasicMaterial({ color: 0xfff6d8 })); moon.position.set(3.5, 3.9, -3.14); scene.add(moon);
  for (let i = 0; i < 14; i++) { const st = new THREE.Mesh(new THREE.CircleGeometry(.018, 6), new THREE.MeshBasicMaterial({ color: 0xffffff })); st.position.set(1.8 + rnd() * 2.2, 2.4 + rnd() * 2.1, -3.14); scene.add(st); }
  const frameM = std(0xf3efe6);
  for (const [x, y, w, h] of [[2.9, 4.65, 2.8, .14], [2.9, 2.15, 2.8, .14], [1.55, 3.4, .14, 2.6], [4.25, 3.4, .14, 2.6], [2.9, 3.4, .08, 2.4], [2.9, 3.4, 2.6, .08]]) {

  for (const x of [-3.4, -1.8]) { const k = new THREE.Mesh(new THREE.SphereGeometry(.06, 12, 8), std(0xd4b37a, { metalness: .8, roughness: .3 })); k.position.set(x, 4.1, -2.38); scene.add(k); }

  for (let i = -3; i <= 3; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(.04, 3.0, .02), std(0x56706a)); l.position.set(i * 1.25, -1.8, 1.56); scene.add(l); }
  // luminária
  const shade = new THREE.Mesh(new THREE.ConeGeometry(.9, .8, 32, 1, true), std(0xe9e1d0, { side: THREE.DoubleSide })); shade.position.set(0, 7.1, .8); scene.add(shade);
  // fruteira e vaso
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(.5, 32, 16, 0, TAU, Math.PI / 2, Math.PI / 2), std(0xd9d2c4, { side: THREE.DoubleSide, roughness: .3 }));
  bowl.position.set(-2.6, .45, -.3); scene.add(bowl);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.3, .24, .55, 24), std(0xb5643c)); pot.position.set(3.7, .27, -.4); scene.add(pot);
  for (let i = 0; i < 9; i++) { const lf = new THREE.Mesh(new THREE.SphereGeometry(.18, 12, 8), std(0x4e8a45)); lf.scale.set(.6, 1.4, .4); lf.position.set(3.7 + (rnd() - .5) * .4, .8 + rnd() * .4, -.4 + (rnd() - .5) * .4); lf.rotation.set(rnd() - .5, rnd() * 3, rnd() - .5); scene.add(lf); }
  shadowAll(scene);
}

/* ---------------- maçã ---------------- */
function appleGeo(bitten) {
  const g = new THREE.SphereGeometry(.2, 64, 48);
  const pos = g.attributes.position, col = [];
  const c = V(0, .05, 1).normalize(), e1 = V(1, 0, 0), e2 = V().crossVectors(c, e1).normalize();
  const v = V();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i); const u = v.clone().normalize();
    let r = .2 * (1 - .1 * Math.pow(Math.max(0, u.y), 8)) * (1 - .06 * Math.max(0, -u.y));
    let flesh = 0;
    if (bitten) {
      const ang = u.angleTo(c), az = Math.atan2(u.dot(e1), u.dot(e2));
      const edge = .6 + .07 * Math.abs(Math.sin(az * 5));
      if (ang < edge) { r -= .07 * Math.sqrt(1 - (ang / edge) ** 2) + .01; flesh = 1; }
    }
    u.multiplyScalar(r); u.y *= .93; pos.setXYZ(i, u.x, u.y, u.z);
    if (flesh) col.push(.97, .9, .66);
    else { const k = .5 + .5 * u.y / .2; col.push(lerp(.62, .78, k), lerp(.05, .12, k), lerp(.04, .06, k)); }
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  return g;
}
const apple = new THREE.Group(); scene.add(apple);

}

const archCurve = new THREE.CatmullRomCurve3([[-.46, -.72], [-.45, -.45], [-.38, -.12], [-.24, .12], [-.1, .225], [0, .24], [.1, .225], [.24, .12], [.38, -.12], [.45, -.45], [.46, -.72]].map(([x, z]) => V(x, 0, z)));

const gumMat = new THREE.MeshPhysicalMaterial({ color: 0xe0707e, roughness: .3, clearcoat: .9, clearcoatRoughness: .2 });

function taper(g, h, fx, fz) {
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const t = clamp(p.getY(i) / h); p.setX(i, p.getX(i) * fx(t)); p.setZ(i, p.getZ(i) * fz(t)); }
  return g;
}

    if (lt < 1.5) p = A0.clone().lerp(A1, easeInOut(range(lt, .2, 1.5)));
    else if (lt < 2.4) p = A1.clone().lerp(A2, pulse(lt, 1.85, 2.4, .2));
    else p = A1.clone().lerp(A0, easeInOut(range(lt, 3.4, 5.0)));
    st.apple = { pos: p, q: qLook(NW().negate()), bitten: false };
    holdHand(p, Q_SIDE, .9);
    const mw = MW(0);
    cam(mw.clone().add(V(.65, .25, 2.45)), mw.clone().add(V(-.12, .02, .2)), 38);
  },
  // "Você é o que os dentistas chamam de arcada dentária, mas para que você serve exatamente?"
  arcada(lt, d) {
    st.dent = { ...st.dent, mode: 'free', ...heroPose(lerp(.7, -.5, easeInOut(lt / d))) };
    const a = lerp(-.25, .25, easeInOut(lt / d));
    cam(HERO.clone().add(V(Math.sin(a) * 1.95, .9, Math.cos(a) * 1.95)), HERO.clone().add(V(0, .16, 0)), 32);
  },
  // incisivos: dentões de coelho, amiguinhos, em cima e embaixo — e a mordida na maçã
  incisivos(lt, d) {
    if (lt < 13) {
      const open = smooth(range(lt, 5.8, 6.6)) * .22;
      st.dent = { ...st.dent, mode: 'free', ...heroPose(0), openUp: open };
      const c1 = smooth(range(lt, .3, .8)), c2 = smooth(range(lt, 3.5, 4.0)), c3 = smooth(range(lt, 6.0, 6.6));
      st.hl = (t) => t.userData.type !== 'inc' ? 0 : t.userData.upper ? (t.userData.i === 0 ? c1 : c2) : c3;
      const k = easeInOut(lt / 13);
      cam(HERO.clone().add(V(lerp(.12, -.1, k), .3, lerp(1.35, 1.15, k))), HERO.clone().add(V(0, .19, .1)), 30);
      st.apple = null;
    } else {
      const l = lt - 13;
      st.head = { rx: .02, ry: .15, rz: 0 }; applyHead();
      const bite = pulse(l, .55, 1.4, .25);
      Object.assign(st.face, { open: Math.max(bite * .7, l > 2 ? Math.abs(Math.sin(l * 6)) * .14 : 0), smile: .2 });
      st.hl = (t) => t.userData.type === 'inc' ? .7 * (1 - range(l, 2.5, 3.5)) : 0;
      const far = MW(.5).add(V(-.1, -.12, 0)), near = MW(.32), inb = MW(.2);
      let p, bitten = l > 1.25;
      if (l < .9) p = far.clone().lerp(near, easeInOut(range(l, 0, .9)));
      else if (l < 1.3) p = near.clone().lerp(inb, pulse(l, .95, 1.4, .18));
      else p = near.clone().lerp(far, easeInOut(range(l, 1.3, 2.0)));
      const toCam = st.camPos.clone().sub(p);
      const qa = qLook(NW().negate()), qb = qLook(V(.9, .1, 2.2));
      st.apple = { pos: p, q: qa.slerp(qb, easeInOut(range(l, 1.4, 2.4))), bitten };
      holdHand(p, Q_SIDE, .9);
      const mw = MW(0);
      cam(mw.clone().add(V(.85, .15, 2.15)), mw.clone().add(V(-.18, -.05, .25)), 38);
    }
  },
  // caninos + a vovó vampira
  caninos(lt, d) {
    if (lt < 5.5) {
      st.dent = { ...st.dent, mode: 'free', ...heroPose(-.5), openUp: .2 }; applyDent();
      const g = smooth(range(lt, .3, .9));
      st.hl = (t) => t.userData.type === 'can' ? g : 0;
      st.canineScale = 1 + .14 * pulse(lt, 2.4, 4.8, .5);
      const k = easeInOut(lt / 5.5);
      const c = findTooth(2, true, 1); const tgt = c ? c.getWorldPosition(V()) : HERO.clone();
      cam(HERO.clone().add(V(lerp(.75, .55, k), .38, lerp(.95, .8, k))), tgt.add(V(0, -.02, 0)), 30);
    } else {
      const l = lt - 5.5, v = smooth(range(l, 0, .5));
      st.head = { rx: -.05 + Math.sin(l * 25) * .01 * v, ry: .05, rz: .04 }; applyHead();
      Object.assign(st.face, { open: .58 * smooth(range(l, .2, .7)), smile: .2, angry: v, pale: v });
      st.fang = lerp(1, 2.0, v);
      st.hl = (t) => t.userData.type === 'can' ? .35 * v : 0;
      st.vamp = v; st.vig = lerp(.35, .8, v);
      const mw = MW(0);
      cam(mw.clone().add(V(.2, -.55, 2.3)), mw.clone().add(V(0, .3, 0)), 40);
    }
  },
  // "Na verdade, eles te ajudam a rasgar a comida e puxar melhor para dentro da boca."
  rasgar(lt, d) {
    st.head = { rx: .02 + .1 * pulse(lt, 4.0, 5.2, .4), ry: .2 - .08 * pulse(lt, 1.4, 2.4, .3), rz: 0 }; applyHead();
    const n = NW(), dir = n.clone().add(V(-.9, -.15, 0)).normalize();
    const bite = smooth(range(lt, .55, .95)) * (1 - smooth(range(lt, 1.05, 1.3)));
    const swallow = pulse(lt, 2.4, 3.6, .25);
    Object.assign(st.face, { open: Math.max(bite * .55, .12 + swallow * .2), smile: .1 });
    if (lt > 1.3 && lt < 2.4) st.face.open = .12;
    if (lt > 3.6) st.face.open = Math.abs(Math.sin(lt * 6)) * .1 * (1 - range(lt, 5, 5.6));
    st.hl = (t) => t.userData.type === 'can' ? .8 * pulse(lt, .7, 3.2, .3) : 0;
    const mw = MW(0);
    const Bin = mw.clone().addScaledVector(dir, .1), Bout = mw.clone().addScaledVector(dir, .6);
    const pull = easeInOut(range(lt, 1.4, 2.4));
    const Bp = lt < 1.0 ? Bout.clone().lerp(Bin, easeInOut(range(lt, 0, 1.0))) : lt < 2.4 ? Bin.clone() : Bin.clone().lerp(MW(-.08), easeInOut(range(lt, 2.4, 3.4)));
    const Ap = (lt < 1.0 ? Bp.clone() : Bin.clone()).addScaledVector(dir, .2 + pull * .32);
    const bScale = 1 - smooth(range(lt, 2.6, 3.5));
    st.meat = { A: Ap, B: Bp, q: new THREE.Quaternion().setFromUnitVectors(V(1, 0, 0), dir.clone().negate()), bScale, fiber: lt > 1.3 && lt < 1.95 ? range(lt, 1.3, 1.95) : -1 };
    holdHand(Ap.clone().addScaledVector(dir, .08), Q_SIDE, .9);
    cam(mw.clone().add(V(.75, .1, 2.15)), mw.clone().add(V(-.3, -.05, .25)), 40);
  },
  // pré-molares: prensa hidráulica
  premolares(lt, d) {
    const openUp = lt < 3.6 ? .5 * smooth(range(lt, 0, 1)) : lt < 6 ? lerp(.5, .085, easeInOut(range(lt, 3.6, 5.3))) : lerp(.085, .5, easeInOut(range(lt, 6, 6.6)));
    st.dent = { ...st.dent, mode: 'free', ...heroPose(-.25), openUp }; applyDent();
    const g = smooth(range(lt, .3, .9));
    st.hl = (t) => t.userData.type === 'pre' ? g : 0;
    const sq = smooth(range(lt, 4.55, 5.3));
    st.chunk = { at: [[3, 4], lt > 6.6 ? [5, 6] : null, easeInOut(range(lt, 6.6, 7.8))], squash: sq };
    const pm = findTooth(3, false, 1).getWorldPosition(V());
    cam(pm.clone().add(V(.6, .5, .55)), pm.clone().add(V(-.03, .05, 0)), 32);
  },
  // molares: trituram — pedacinhos minúsculos
  molares(lt, d) {
    const chomps = lt > 2.6 && lt < 5.0 ? Math.abs(Math.cos((lt - 2.6) / 2.4 * Math.PI * 3)) : 1;
    const openUp = lt < 2.6 ? .5 : lt < 5.0 ? lerp(.07, .5, chomps) : lerp(.07, .4, easeInOut(range(lt, 5.0, 5.6)));
    st.dent = { ...st.dent, mode: 'free', ...heroPose(-.25), openUp }; applyDent();
    const g = smooth(range(lt, .2, .7));
    st.hl = (t) => t.userData.type === 'mol' ? g : 0;
    const burst = 4.4;
    if (lt < burst) st.chunk = { at: [[5, 6], null, 0], squash: .55 + .3 * range(lt, 2.6, burst) };
    else st.crumbs = lt - burst;
    const m = findTooth(5, false, 1).getWorldPosition(V());
    const k = easeInOut(range(lt, 4.8, 7));
    cam(m.clone().add(V(lerp(.6, .38, k), lerp(.5, .38, k), lerp(.45, .3, k))), m.clone().add(V(-.04, .04, 0)), 32);
  },
  // sisos: a reserva
  sisos(lt, d) {
    st.dent = { ...st.dent, mode: 'free', ...heroPose(0), openUp: .45 };
    const g = smooth(range(lt, .4, 1.0));
    st.hl = (t) => t.userData.type === 'sis' ? g : 0;
    st.crumbs = 3;
    const k = easeInOut(lt / d);
    cam(HERO.clone().add(V(lerp(.25, -.25, k), 1.35, -1.45)), HERO.clone().add(V(0, .12, -.12)), 36);
  },
  // "...mas a sua vovó tem." — tira a dentadura do copo e coloca na boca
  colocar(lt, d) {
    st.head = { rx: lerp(.22, .02, easeInOut(range(lt, .8, 2.0))), ry: lerp(-.25, .05, easeInOut(range(lt, .8, 2.2))), rz: 0 }; applyHead();
    const inside = smooth(range(lt, 2.5, 2.75));
    const open = smooth(range(lt, 1.7, 2.1)) * (1 - smooth(range(lt, 2.75, 3.0))) * .75;
    Object.assign(st.face, { purse: 1 - inside, open, smile: lerp(.1, .9, smooth(range(lt, 3.0, 3.6))) });
    const bottom = G.clone().add(V(0, .17, 0)), up = G.clone().add(V(0, 1.6, 0)), front = MW(.42);
    const mp = mouthPose();
    let pos, q;
    if (lt < 1.0) { pos = bottom; q = qE(.1, .25, 0); }
    else if (lt < 2.2) { const k = easeInOut(range(lt, 1.0, 2.2)); pos = bez(bottom, up, front, k); q = qE(.1, .25, 0).slerp(mp.q, k); }
    else { const k = easeInOut(range(lt, 2.2, 2.75)); pos = front.clone().lerp(mp.pos, k); q = mp.q; }
    if (lt >= 2.75) st.dent = { ...st.dent, mode: 'mouth' };
    else st.dent = { ...st.dent, mode: 'free', pos, q };
    st.drops = lt > 1.0 && lt < 2.4 ? 1 : 0; st.dropOrigin = pos;
    st.bubbles = 1 - range(lt, 1.0, 1.5);
    if (lt < 1.0) holdHand(REST_T.clone().lerp(bottom, easeInOut(range(lt, 0, .95))), Q_DOWN, lerp(.25, .9, range(lt, .8, 1.0)));
    else if (lt < 2.8) holdHand(pos.clone().add(V(-.1, 0, .02)), Q_DOWN, .9);
    else holdHand(front.clone().lerp(REST_T, easeInOut(range(lt, 2.8, 3.9))), Q_DOWN, .2);
    const k = easeInOut(range(lt, 2.0, 3.6)), mw = MW(0);
    cam(V(-.3, 2.1, 4.8).lerp(mw.clone().add(V(.35, .15, 2.6)), k), V(-.5, 1.7, -.3).lerp(mw.clone().add(V(0, .15, 0)), k), 42);
  },
  // "E se você gostou... se inscreve." — sorriso + joinha
  inscreve(lt, d) {
    const b = Math.abs(Math.sin(lt * 5.5));
    st.dent = { ...st.dent, mode: 'free', ...heroPose(Math.sin(lt * 2) * .12, b * .04), openUp: .1 + .14 * b };
    st.thumbs = easeOut(range(lt, .3, .8)); st.sparkle = pulse(lt, .7, 1.6, .2);
    cam(HERO.clone().add(V(.08, .32, 2.45)), HERO.clone().add(V(.08, .38, 0)), 30);
  },
};

/* ---------------- textos ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) {
  const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = x.html;
  el.style.setProperty('--y', x.y + 'px'); el.style.setProperty('--fs', x.fs + 'px');
  textHost.appendChild(el); x.el = el; x.a = SEG[x.seg].start + x.from; x.b = SEG[x.seg].start + x.to;
}

/* ---------------- quadro ---------------- */
const m4 = new THREE.Matrix4();
function frame(t) {
  T = t; reset();
  const s = [...SEGMENTS].reverse().find(s => t >= s.start) || SEGMENTS[0];
  const lt = Math.min(t - s.start, s.dur);
  applyHead();
  SHOTS[s.id](lt, s.dur);
  applyHead();

  // rosto
  const f = st.face;
  const w = lerp(.32, .21, f.purse) * (1 + .3 * Math.max(0, f.smile));
  const h = lerp(.018, .36, f.open) + (1 - f.purse) * Math.max(0, f.smile) * .17 * (1 - f.open);
  setMouth(w, h, f.smile, f.purse);
  face.eyes.forEach(e => e.scale.set(1, lerp(1, .15, f.squint), 1));
  face.brows.forEach((b, i) => { const sgn = i ? 1 : -1; b.rotation.z = sgn * (f.pain * .35 - f.angry * .45); b.position.y = .4 + f.pain * .05 - f.angry * .04; });
  face.pain.visible = f.painLines > .01; face.pain.scale.setScalar(.8 + .3 * f.painLines);
  skinMat.color.copy(SKIN).lerp(PALE, f.pale); face.cheekMat.opacity = .5 * (1 - f.pale);
  face.irisMat.emissiveIntensity = f.pale * 2.5; face.irisMat.color.setHex(f.pale > .5 ? 0x400000 : 0x4a3222);
  const vamp = st.vamp || 0;
  vampLight.intensity = vamp * 3; vampLight.position.copy(MW(0)).add(V(0, -1.2, 1.6));
  vampRed.intensity = vamp * 8; vampRed.position.copy(H0).add(V(1.8, .5, -1.5));
  lamp.intensity = 40 * (1 - .7 * vamp); hemi.intensity = 1 - .6 * vamp;
  st.tint.set(1, 1 - .12 * vamp, 1 + .04 * vamp);

  // dentadura
  const d = st.dent; applyDent();
  const inMouth = d.mode === 'mouth';
  gums.loP.rotation.x = f.open * .3;
  gums.root.visible = !inMouth && f.purse > .5;
  for (const tooth of teeth) {
    tooth.userData.mat.emissiveIntensity = st.hl(tooth) * 1.1;
    const can = tooth.userData.type === 'can';
    tooth.scale.set(can ? st.canineScale : 1, can ? st.canineScale * (tooth.userData.upper ? st.fang : 1) : 1, can ? st.canineScale : 1);
  }
  dent.root.updateMatrixWorld(true);

  // mão direita
  const hp = st.hand;
  hand.quaternion.copy(hp.q); hand.position.copy(hp.t).sub(GRIP.clone().applyQuaternion(hp.q));
  hand.userData.fingers.forEach(fg => fg.rotation.x = hp.curl * 1.1); hand.userData.thumb.rotation.x = .3 + hp.curl * .6;
  hand.updateMatrixWorld(true);
  solveArm(armR, SR, hand.localToWorld(WRIST.clone()), V(-1, -.6, -.3));

  // maçã
  apple.visible = !!st.apple;
  if (st.apple) { apple.position.copy(st.apple.pos); apple.quaternion.copy(st.apple.q); appleMesh.geometry = st.apple.bitten ? appleBitten : appleWhole; }
  // carne
  meat.visible = !!st.meat;
  if (st.meat) {
    const M = st.meat;
    meatParts[0].position.copy(M.A); meatParts[1].position.copy(M.B);
    meatParts.forEach(p => p.quaternion.copy(M.q)); meatParts[1].scale.setScalar(Math.max(.001, M.bScale));
    const xa = V(1, 0, 0).applyQuaternion(M.q);
    fibers.forEach((fb, i) => {
      fb.visible = M.fiber >= 0;
      if (fb.visible) { const o = V(0, (i - 1) * .03, (i - 1) * .04).applyQuaternion(M.q); placeLimb(fb, M.A.clone().addScaledVector(xa, .1).add(o), M.B.clone().addScaledVector(xa, -.1).add(o), .012 * (1 - M.fiber * .7)); }
    });
  }
  // pedaço de maçã / farelos
  chunk.visible = !!st.chunk;
  if (st.chunk) {
    const [a, b, k] = st.chunk.at;
    const posOf = (ids) => ids.map(i => toothTop(findTooth(i, false, 1))).reduce((s, v) => s.add(v), V()).multiplyScalar(1 / ids.length);
    let p = posOf(a); if (b) p.lerp(posOf(b), k);
    const sq = st.chunk.squash || 0;
    chunk.position.copy(p).add(V(0, .03 * (1 - sq * .6), 0)); chunk.scale.set(1 + sq * .5, 1 - sq * .6, 1 + sq * .4);
    chunk.quaternion.copy(dent.root.quaternion);
  }
  crumbs.visible = st.crumbs != null;
  if (crumbs.visible) {
    const base = [5, 6].map(i => toothTop(findTooth(i, false, 1))).reduce((s, v) => s.add(v), V()).multiplyScalar(.5);
    const tau = st.crumbs, q = new THREE.Quaternion();
    crumbSeed.forEach(([a, b, c, e], i) => {
      const ang = a * TAU, sp = .03 + b * .11;
      const p = base.clone().add(V(Math.cos(ang) * sp * Math.min(1, tau * 4), 0, Math.sin(ang) * sp * Math.min(1, tau * 4)));
      const fall = e > .45 ? Math.min(.2, 3 * Math.max(0, tau - .1) ** 2) : 0;
      p.y += .01 + c * .015 - fall;
      if (p.y < .04) p.y = .04;
      q.setFromEuler(new THREE.Euler(a * 6, b * 6, c * 6));
      m4.compose(p, q, V(1, 1, 1).multiplyScalar(.7 + c * .8)); crumbs.setMatrixAt(i, m4);
    });
    crumbs.instanceMatrix.needsUpdate = true;
  }
  // bolhas e gotas
  bubbles.forEach(b => {
    const u = b.userData, ph = (T * u.s + u.p) % 1;
    b.visible = st.bubbles > .01 && (st.dent.mode !== 'mouth');
    b.position.set(G.x + u.x * .7, .2 + ph * (WATER_Y - .25), G.z + u.z * .7); b.material.opacity = .55 * st.bubbles;
  });
  drops.forEach(dr => {
    const u = dr.userData, ph = (T * 1.6 + u.p) % 1;
    dr.visible = st.drops > 0 && st.dropOrigin;
    if (dr.visible) dr.position.copy(st.dropOrigin).add(V(u.x * .55, -.08 - ph * .9, u.z * .55));
  });
  // joinha e brilho
  thumbs.visible = st.thumbs > .01;
  if (thumbs.visible) {
    thumbs.position.copy(HERO).add(V(.33, .55 + Math.abs(Math.sin(T * 5.5)) * .03, .12));
    thumbs.scale.setScalar(st.thumbs * .9); thumbs.rotation.set(0, -.2, Math.sin(T * 6) * .12 - .1);
  }
  sparkle.visible = st.sparkle > .01;
  if (sparkle.visible) {
    const ci = findTooth(0, true, 1); sparkle.position.copy(ci.localToWorld(V(.02, .12, .06)));
    sparkle.quaternion.copy(camera.quaternion); sparkle.rotateZ(T * 3); sparkle.scale.setScalar(st.sparkle * (1 + .3 * Math.sin(T * 20)));
  }

  // câmera
  camera.position.copy(st.camPos); camera.fov = st.fov; camera.updateProjectionMatrix(); camera.lookAt(st.camTgt);
  postMat.uniforms.uVig.value = st.vig; postMat.uniforms.uTime.value = t; postMat.uniforms.uTint.value.copy(st.tint);

  for (const x of TEXTS) {
    if (window.__render) {
      const k = Math.min(range(t, x.a, x.a + .3), 1 - range(t, x.b - .25, x.b)), e = easeOut(k);
      x.el.style.transition = 'none'; x.el.style.opacity = k;
      x.el.style.transform = `translateY(${(1 - e) * 40}px) scale(${.92 + .08 * e})`;
    } else x.el.classList.toggle('on', t >= x.a && t < x.b);
  }

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* ---------------- controle ---------------- */
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const params = new URLSearchParams(location.search);
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); }
function pause() { offset = current(); playing = false; }
function seek(t) { offset = clamp(t, 0, TOTAL); t0 = performance.now(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { seek(0); play(); }
  if (e.code === 'ArrowRight') seek(current() + 2);
  if (e.code === 'ArrowLeft') seek(current() - 2);
});
window.__total = TOTAL; window.__dbg = { head, dent, hole, mouth, scene, THREE };
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
