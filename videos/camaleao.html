<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   ROTEIRO / TEMPOS — ajuste "dur" (segundos) para casar com a sua fala.
   ===================================================================== */
const SEGMENTS = [
  { id:'intro',      dur:3.5 },  // "Você é um camaleão."
  { id:'mosquito',   dur:5.0 },  // "Você está lá, paradão no galho, e de repente aparece um mosquito."
  { id:'olhos',      dur:7.0 },  // "Só que você nem precisa virar a cabeça. Seus olhos são como duas torres que giram cada uma para um lado."
  { id:'vis360',     dur:7.0 },  // "Um olho vigia o céu, o outro vigia o chão, e juntos eles enxergam quase 360 graus ao seu redor."
  { id:'trava',      dur:6.5 },  // "Quando um deles encontra o mosquito, os dois olhos travam nele ao mesmo tempo. É assim que você calcula a distância exata."
  { id:'lingua',     dur:8.0 },  // "E aí… sua língua dispara. Ela pode ter até o dobro do tamanho do seu corpo e sai mais rápido que um piscar de olhos."
  { id:'estilingue', dur:11.0 }, // "O segredo? ...estilingue. Um músculo aperta um osso fininho... flecha. E a ponta dela é grudenta, quase uma cola..."
  { id:'cor',        dur:12.0 }, // "Mas o mais famoso em você é outra coisa: a cor. ...não muda de cor só para se esconder... Calmo, verde. Irritado... vermelho."
  { id:'cristais',   dur:7.5 },  // "E sabe como? Embaixo da sua pele existem cristais minúsculos... a luz reflete diferente, e a sua cor muda."
  { id:'inscreve',   dur:4.5 },  // "E se você gostou de ser um camaleão, se inscreve."
];
const TEXTS = [
  { seg:'vis360',     from:1.0, to:3.2,  anchor:'ceu',  fs:70,  html:'CÉU' },
  { seg:'vis360',     from:1.4, to:3.2,  anchor:'chao', fs:70,  html:'CHÃO' },
  { seg:'vis360',     from:3.6, to:7.0,  y:150,  fs:230, html:'<span class="sm">QUASE</span><span id="deg">0°</span>' },
  { seg:'trava',      from:3.0, to:6.5,  y:860, fs:110, html:'<span class="a">DISTÂNCIA</span>' },
  { seg:'lingua',     from:3.4, to:7.9,  y:720, fs:250, html:'<span class="a">2x</span><span class="sub">O SEU CORPO</span>' },
  { seg:'estilingue', from:0.4, to:3.0,  y:220,  fs:120, html:'ESTILINGUE' },
  { seg:'estilingue', from:1.6, to:7.4,  anchor:'osso',    fs:72, html:'OSSO' },
  { seg:'estilingue', from:2.4, to:7.4,  anchor:'musculo', fs:72, html:'<span class="a">MÚSCULO</span>' },
  { seg:'estilingue', from:8.4, to:10.9, y:220,  fs:120, html:'<span class="a">GRUDENTA</span>' },
  { seg:'cor',        from:0.8, to:3.0,  y:220,  fs:160, html:'A <span class="a">COR</span>' },
  { seg:'cor',        from:3.6, to:6.3,  y:220,  fs:110, html:'<span class="strike">SE ESCONDER</span>' },
  { seg:'cor',        from:7.3, to:9.0,  y:1600, fs:130, html:'CALMO' },
  { seg:'cor',        from:9.4, to:12.0, y:1600, fs:130, html:'<span class="a">IRRITADO</span>' },
  { seg:'cristais',   from:1.0, to:3.6,  y:220,  fs:130, html:'<span class="a">CRISTAIS</span>' },
  { seg:'inscreve',   from:0.6, to:4.5,  y:1520, fs:110, html:'<span class="btn">SE INSCREVE</span>' },
];
const ACCENT = new THREE.Color('#00E5FF');

let acc = 0; for (const s of SEGMENTS) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
const SEG = Object.fromEntries(SEGMENTS.map(s => [s.id, s]));

/* ---------------- utilidades ---------------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const pulse = (t, a, b, f = .25) => Math.min(range(t, a, a + f), 1 - range(t, b - f, b));
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UPV = V(0, 1, 0), ZV = V(0, 0, 1);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// interpolação suave por pontos [[t, valor], ...]
const curveOf = (pts) => (t) => {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [a, va] = pts[i - 1], [b, vb] = pts[i]; return lerp(va, vb, smooth((t - a) / (b - a))); }
  return pts[pts.length - 1][1];
};

/* ---------------- renderer + pós-processamento ---------------- */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const overlay = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 150);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 1, aperture: .02, maxblur: .02 });
composer.addPass(bokeh);
const overPass = new RenderPass(overlay, camera); overPass.clear = false; overPass.clearDepth = true;
composer.addPass(overPass);
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uVig: { value: .3 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig,uTime; uniform vec2 uRes; varying vec2 vUv;
    void main(){ vec4 c=texture2D(tDiffuse,vUv); float v=length((vUv-.5)*vec2(1.,1.15));
      c.rgb*=1.-uVig*smoothstep(.3,.95,v);
      float g=fract(sin(dot(vUv*uRes+uTime*61.,vec2(12.9898,78.233)))*43758.5453); c.rgb+=(g-.5)*.008; gl_FragColor=c; }`
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

/* ---------------- céu + ambiente ---------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vW; void main(){ vW=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vW; void main(){ float h=vW.y;
    vec3 top=vec3(.18,.42,.85), hor=vec3(.95,.86,.66), bot=vec3(.16,.26,.1);
    vec3 c = h>0. ? mix(hor, top, pow(h,.55)) : mix(hor, bot, pow(-h,.35));
    vec3 sun=normalize(vec3(.55,.6,.45)); float d=max(dot(vW,sun),0.);
    c += vec3(1.,.85,.6)*(pow(d,300.)*20.+pow(d,8.)*.35);
    gl_FragColor=vec4(c,1.); }`
});
{
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), skyMat));
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, .02).texture;
}
scene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 48, 24), skyMat));

const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.position.set(4, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.2, right: 3.2, top: 3, bottom: -1.5, near: 1, far: 25 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .006; sun.shadow.radius = 4; scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a5a2a, .5));

/* ---------------- texturas ---------------- */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAXANI; return t;
}
// máscara da pele: R = escamas (relevo), G = faixas, B = listra lateral / barriga
const skinTex = canvasTex(1024, 512, (g, w, h) => {
  const R = document.createElement('canvas'); R.width = w; R.height = h; const r = R.getContext('2d');
  r.fillStyle = '#6a6a6a'; r.fillRect(0, 0, w, h);
  for (let y = 0; y < 30; y++) for (let x = 0; x < 90; x++) {
    const cx = (x + (y % 2) * .5 + (rnd() - .5) * .35) / 90 * w, cy = (y + .5 + (rnd() - .5) * .3) / 30 * h, rr = 5 + rnd() * 3.2;
    const gr = r.createRadialGradient(cx - 1, cy - 1, .5, cx, cy, rr); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.7, '#b0b0b0'); gr.addColorStop(1, '#404040');
    r.fillStyle = gr; r.beginPath(); r.arc(cx, cy, rr, 0, TAU); r.fill();
  }
  const G = document.createElement('canvas'); G.width = w; G.height = h; const gg = G.getContext('2d');
  gg.fillStyle = '#000'; gg.fillRect(0, 0, w, h); gg.filter = 'blur(14px)'; gg.fillStyle = 'rgba(255,255,255,.85)';
  for (const u of [.14, .3, .47, .63, .8]) for (const v0 of [.05, .55]) { gg.beginPath(); gg.moveTo(u * w - 18, v0 * h); for (let k = 0; k <= 8; k++) gg.lineTo(u * w + Math.sin(k * 1.7 + u * 9) * 16 + (k % 2 ? 22 : -22), (v0 + k * .045) * h); gg.lineTo(u * w + 18, (v0 + .36) * h); gg.closePath(); gg.fill(); }
  for (let i = 0; i < 60; i++) { gg.beginPath(); gg.arc(rnd() * w, rnd() * h, 3 + rnd() * 6, 0, TAU); gg.fill(); }
  const B = document.createElement('canvas'); B.width = w; B.height = h; const bb = B.getContext('2d');
  bb.fillStyle = '#000'; bb.fillRect(0, 0, w, h); bb.filter = 'blur(5px)';
  bb.fillStyle = '#fff'; bb.fillRect(0, h * .925, w, h * .04); bb.fillRect(0, h * .535, w, h * .04);
  bb.fillStyle = 'rgba(255,255,255,.65)'; bb.fillRect(0, h * .69, w, h * .12);
  const dr = r.getImageData(0, 0, w, h).data, dg = gg.getImageData(0, 0, w, h).data, db = bb.getImageData(0, 0, w, h).data;
  const out = g.createImageData(w, h);
  for (let i = 0; i < dr.length; i += 4) { out.data[i] = dr[i]; out.data[i + 1] = dg[i]; out.data[i + 2] = db[i]; out.data[i + 3] = 255; }
  g.putImageData(out, 0, 0);
}, false);
const barkTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#5e4330'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(${rnd() > .5 ? '30,18,10' : '140,110,80'},${.25 + rnd() * .35})`; g.lineWidth = 1 + rnd() * 3; const y = rnd() * h; g.beginPath(); g.moveTo(rnd() * w, y); g.lineTo(rnd() * w, y + (rnd() - .5) * 8); g.stroke(); }
});
barkTex.repeat.set(6, 1);
const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4f7a2e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(${rnd() > .5 ? '120,170,60' : '40,70,20'},.35)`; g.fillRect(rnd() * w, rnd() * h, 2, 6); }
});
grassTex.repeat.set(30, 30);

/* ---------------- geometria "esculpida" (loft) ---------------- */
function loft(pts, segs, radial, prof, shapeFn, uScale = 1) {
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const P = [], UV = [], I = [];
  let side = null;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, p = curve.getPointAt(t), T = curve.getTangentAt(t).normalize();
    if (!side) { side = V().crossVectors(T, UPV); if (side.lengthSq() < 1e-4) side.set(0, 0, 1); side.normalize(); }
    else side.addScaledVector(T, -side.dot(T)).normalize();
    const up = V().crossVectors(side, T).normalize();
    const { w, h, dy = 0 } = prof(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * TAU, c = Math.cos(a), s = Math.sin(a), m = shapeFn ? shapeFn(t, a) : 1;
      const q = p.clone().addScaledVector(side, c * w * m).addScaledVector(up, s * h * m + dy);
      P.push(q.x, q.y, q.z); UV.push(t * uScale, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1; I.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  g.setIndex(I); g.computeVertexNormals();
  const n = g.attributes.normal;
  for (let i = 0; i <= segs; i++) { const a = i * (radial + 1), b = a + radial; const v = V(n.getX(a) + n.getX(b), n.getY(a) + n.getY(b), n.getZ(a) + n.getZ(b)).normalize(); n.setXYZ(a, v.x, v.y, v.z); n.setXYZ(b, v.x, v.y, v.z); }
  g.userData.curve = curve; g.userData.prof = prof;
  return g;
}
// ponto na superfície de um loft (t ao longo, a = ângulo)
function loftPoint(g, t, a, k = 1) {
  const c = g.userData.curve, p = c.getPointAt(t), T = c.getTangentAt(t).normalize();
  const side = V().crossVectors(T, UPV).normalize(), up = V().crossVectors(side, T).normalize();
  const { w, h, dy = 0 } = g.userData.prof(t);
  return p.addScaledVector(side, Math.cos(a) * w * k).addScaledVector(up, Math.sin(a) * h * k + dy);
}

/* ---------------- jardim ---------------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), std(0xffffff, { map: grassTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -3.5; ground.receiveShadow = true; scene.add(ground);
  // arbustos (desfocados ao fundo)
  const bush = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 3), std(0xffffff, { roughness: .9 }), 420);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  let k = 0;
  for (let c = 0; c < 46; c++) {
    const ang = rnd() * TAU, dist = 4 + rnd() * 14;
    let cx = Math.cos(ang) * dist, cz = -Math.abs(Math.sin(ang) * dist) - 1.2;
    const cy = -3.5 + rnd() * 2.5, sz = .7 + rnd() * 1.4;
    for (let i = 0; i < 9 && k < 420; i++, k++) {
      m4.compose(V(cx + (rnd() - .5) * sz * 2, cy + rnd() * sz * 1.5, cz + (rnd() - .5) * sz * 2), q, V(1, 1, 1).multiplyScalar(sz * (.5 + rnd() * .6)));
      bush.setMatrixAt(k, m4); bush.setColorAt(k, col.setHSL(.24 + rnd() * .08, .45 + rnd() * .2, .2 + rnd() * .14));
    }
  }
  bush.count = k; scene.add(bush);
  const flowers = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), std(0xffffff, { roughness: .6 }), 260);
  const fcols = [0xff7aa8, 0xffd23f, 0xffffff, 0xb07cff, 0xff8a3d];
  for (let i = 0; i < 260; i++) {
    const ang = rnd() * TAU, dist = 4 + rnd() * 13; let cx = Math.cos(ang) * dist, cz = -Math.abs(Math.sin(ang) * dist) - 1.2;
    m4.compose(V(cx, -3.4 + rnd() * 3.2, cz), q, V(1, 1, 1).multiplyScalar(.06 + rnd() * .08));
    flowers.setMatrixAt(i, m4); flowers.setColorAt(i, col.set(fcols[i % fcols.length]));
  }
  scene.add(flowers);
  // árvores distantes
  for (const [x, z, s] of [[-7, -9, 1.3], [6, -11, 1.6], [-13, -4, 1.2], [11, -5, 1.1], [0, -16, 1.8]]) {
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(.25 * s, .4 * s, 9, 12), std(0x5a4030)); tr.position.set(x, 1, z); scene.add(tr);
    for (let i = 0; i < 7; i++) { const cp = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 * s, 2), std(new THREE.Color().setHSL(.26 + rnd() * .05, .45, .25 + rnd() * .1))); cp.position.set(x + (rnd() - .5) * 3 * s, 5 + rnd() * 2 * s, z + (rnd() - .5) * 3 * s); scene.add(cp); }
  }
}
// galhos
const barkMat = std(0xffffff, { map: barkTex, bumpMap: barkTex, bumpScale: 2.5, roughness: .9 });
function makeBranch(pts, r0, r1) {
  const g = loft(pts, 140, 20, (t) => ({ w: lerp(r0, r1, t), h: lerp(r0, r1, t) }), (t, a) => 1 + .05 * Math.sin(a * 5 + t * 40), 1);
  const m = new THREE.Mesh(g, barkMat); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
makeBranch([V(-4.5, -.9, -1.2), V(-2.2, -.42, -.2), V(-1, -.365, 0), V(0, -.36, 0), V(1, -.36, 0), V(2.2, -.33, .02), V(3.6, -.2, -.15)], .095, .045);
const branch2 = makeBranch([V(-2.4, 1.4, -1.1), V(-.6, 1.02, -.36), V(.5, 1.0, -.3), V(1.6, 1.0, -.3), V(2.6, 1.08, -.26), V(3.5, 1.3, -.4)], .085, .04);
// folhas
const leafGeo = (() => {
  const s = new THREE.Shape(); s.moveTo(0, 0); s.bezierCurveTo(.09, .08, .1, .25, 0, .4); s.bezierCurveTo(-.1, .25, -.09, .08, 0, 0);
  const g = new THREE.ShapeGeometry(s, 10); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, -Math.abs(x) * .6 + Math.sin(y * 6) * .015); }
  g.computeVertexNormals(); return g;

    }
  },
  // "...os dois olhos travam nele ao mesmo tempo... distância exata."
  trava(lt, d) {
    st.mosq = mosqFly(lt, MQ, .25);
    st.pitch = 1.0 * easeInOut(range(lt, 2.0, 3.4)); applyHead();
    const lockK = easeInOut(range(lt, .4, 1.3));
    for (let i = 0; i < 2; i++) { const e = eyeWorld(i); st.eyeT[i] = e.clone().add(roam(i, T)).lerp(st.mosq, lockK); }
    st.lock = smooth(range(lt, 1.2, 1.6));
    st.dist = smooth(range(lt, 2.8, 3.4)); st.target = st.lock;
    cam(V(1.05, 1.0, 3.95), V(.58, 1.0, 0), 40);
  },
  // "E aí… sua língua dispara... o dobro do tamanho do seu corpo... mais rápido que um piscar de olhos."
  lingua(lt, d) {
    st.pitch = 1.0; applyHead();
    const caught = lt > 1.75;
    st.mosq = caught ? null : mosqFly(lt + 6.5, MQ, .25);
    st.mosqStuck = caught;
    for (let i = 0; i < 2; i++) st.eyeT[i] = MQ.clone();
    st.tongue = easeIn(range(lt, .3, 1.75)); st.tongueTo = MQ.clone();
    st.vig = lerp(.3, .55, pulse(lt, .2, 2.4, .2));
    st.bracket = smooth(range(lt, 3.2, 3.8));
    const k = easeInOut(range(lt, 2.6, 3.6));
    cam(V(1.05, 1.0, 3.95).lerp(V(.95, .95, 4.3), k), V(.58, 1.0, 0).lerp(V(.45, .92, 0), k), 40);
  },
  // estilingue: músculo aperta o osso, a língua sai como flecha; ponta grudenta
  estilingue(lt, d) {
    st.pitch = 0; applyHead();
    if (lt < 8) {
      st.xray = smooth(range(lt, .3, 1.1)) * (1 - smooth(range(lt, 7.0, 7.8)));
      st.squeeze = smooth(range(lt, 3.4, 4.6));
      st.launch = easeIn(range(lt, 4.9, 5.25));
      const m = mouthWorld();
      st.tongue = easeOut(range(lt, 5.0, 5.4)); st.tongueTo = m.clone().add(V(1.6, -.005, 0));
      for (let i = 0; i < 2; i++) st.eyeT[i] = eyeWorld(i).add(V(1, .05, cha.eyes[i].side * .3));
      cam(V(.46, .04, .95), V(.43, -.01, 0), 27);
    } else {
      st.tongue = 1; st.tongueTo = mouthWorld().add(V(1.6, -.005, 0)); st.mosqStuck = true; st.goo = 1;
      const tip = st.tongueTo;
      const k = easeInOut(range(lt, 8, 11));
      cam(tip.clone().add(V(lerp(.2, .14, k), .05, lerp(.24, .17, k))), tip.clone().add(V(.01, .004, 0)), 30);
    }
  },
  // a cor: esconder? não — humor. calmo verde, irritado amarelo/laranja/vermelho
  cor(lt, d) {
    st.cha2 = true;
    if (lt < 3) { st.pal = ['calm', 'calm', 0]; cam(V(.75, .2, 1.3).lerp(V(.68, .18, 1.2), lt / 3), V(.05, .0, 0), 32); }
    else if (lt < 6.5) { st.pal = ['calm', 'hide', smooth(range(lt, 3.3, 4.6))]; cam(V(.68, .18, 1.2), V(.05, 0, 0), 32); }
    else {
      if (lt < 9.2) st.pal = ['hide', 'calm', smooth(range(lt, 6.5, 7.4))];
      else if (lt < 10.2) st.pal = ['calm', 'yellow', smooth(range(lt, 9.2, 10.0))];
      else if (lt < 11.0) st.pal = ['yellow', 'orange', smooth(range(lt, 10.2, 10.9))];
      else st.pal = ['orange', 'red', smooth(range(lt, 11.0, 11.7))];
      if (lt < 10.2) st.pal2 = ['calm2', 'yellow', smooth(range(lt, 9.4, 10.2))];
      else if (lt < 11.0) st.pal2 = ['yellow', 'orange', smooth(range(lt, 10.2, 10.9))];
      else st.pal2 = ['orange', 'red', smooth(range(lt, 11.0, 11.7))];
      st.puff = smooth(range(lt, 9.4, 10.5));
      const k = easeInOut(range(lt, 8.3, 9.4));
      cam(V(.68, .18, 1.2).lerp(V(1.55, .78, 3.05), k), V(.05, 0, 0).lerp(V(.55, .62, -.1), k), lerp(32, 36, k));
      for (let i = 0; i < 2; i++) st.eyeT[i] = cha2.root.position.clone().add(V(0, .05, 0)).lerp(eyeWorld(i).add(roam(i, T)), 1 - smooth(range(lt, 9.0, 9.6)));
    }
  },
  // cristais na pele
  cristais(lt, d) {
    st.pal = ['red', 'red', 0];
    if (lt < .7) {
      const k = easeIn(lt / .7);
      cam(V(.15, .06, .7).lerp(V(-.06, .02, .13), k), V(-.08, .0, .07), 30);
    } else {
      const l = lt - .7;
      const sp = lerp(.27, .46, smooth(range(l, 2.5, 3.6))) * (1 - .41 * smooth(range(l, 5.0, 6.0)) * 1);
      st.micro = { sp, l };
      cam(MICRO.clone().add(V(lerp(.7, .3, easeInOut(l / 6.8)), lerp(1.0, .9, l / 6.8), 4.6 - l * .1)), MICRO.clone().add(V(0, .95, 0)), 40); st.aperture = .004;
    }
  },
  // "E se você gostou de ser um camaleão, se inscreve."
  inscreve(lt, d) {
    st.pal = ['red', 'calm', smooth(range(lt, 0, .8))];
    cam(V(1.0, .13, .5), V(.42, .07, .02), 26);
    st.eyeT[0] = st.camPos.clone();
    const e1 = eyeWorld(1); st.eyeT[1] = e1.clone().add(V(Math.sin(lt * 3) * .8 + .2, Math.cos(lt * 3) * .8, -1));
    st.blink = pulse(lt, 1.4, 1.9, .2);
  },
};

/* ---------------- textos ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) {
  const el = document.createElement('div'); el.className = 'ov' + (x.anchor ? ' lbl' : ''); el.innerHTML = x.html;
  if (!x.anchor) el.style.setProperty('--y', x.y + 'px');
  el.style.setProperty('--fs', x.fs + 'px');
  textHost.appendChild(el); x.el = el; x.a = SEG[x.seg].start + x.from; x.b = SEG[x.seg].start + x.to;
}
const anchors = {};

/* ---------------- quadro ---------------- */
const m4 = new THREE.Matrix4();
function frame(t) {
  T = t; reset();
  cha.root.updateMatrixWorld(true);
  const s = [...SEGMENTS].reverse().find(s => t >= s.start) || SEGMENTS[0];
  const lt = Math.min(t - s.start, s.dur);
  applyHead();
  SHOTS[s.id](lt, s.dur);
  applyHead();

  // respiração / cores
  const br = 1 + .015 * Math.sin(t * 2.2);
  cha.body.scale.set(1, br, br * (1 + .12 * st.puff));
  cha2.root.visible = st.cha2;
  cha2.body.scale.set(1, br, br * (1 + .12 * st.puff));
  setPal(cha, ...st.pal); setPal(cha2, ...st.pal2);
  cha.mat.opacity = 1 - .62 * st.xray; cha.mat.depthWrite = st.xray < .5;
  cha.bone.visible = cha.muscle.visible = st.xray > .01;
  cha.head.traverse(o => { if (o.userData.xrayHide) o.visible = st.xray < .05; });
  cha.muscle.scale.set(1 + .45 * st.squeeze, 1 - .3 * st.squeeze, 1 - .3 * st.squeeze);
  cha.muscle.position.copy(V(.47 + .025 * st.squeeze + .18 * st.launch, -.032, 0).sub(NECK));
  cha.muscle.material.emissiveIntensity = st.squeeze * 1.5 * (1 - st.launch);
  cha.muscle.visible = cha.muscle.visible && st.launch < .99;

  // olhos
  for (let i = 0; i < 2; i++) {
    const e = cha.eyes[i];
    const tg = st.eyeT[i] || eyeWorld(i).add(roam(i, T));
    e.g.lookAt(tg);
    e.pupil.scale.setScalar(i === 0 ? 1 - .95 * st.blink : 1);
  }
  for (const e of cha2.eyes) e.g.lookAt(e.g.getWorldPosition(V()).add(V(-1, Math.sin(T + e.side) * .3, e.side * .4).applyAxisAngle(UPV, 0)));
  if (st.cha2 && st.pal2[1] !== 'calm2') for (const e of cha2.eyes) e.g.lookAt(cha.head.getWorldPosition(V()));
  cha.root.updateMatrixWorld(true);

  // língua
  const mouth = mouthWorld();
  tongue.visible = tongueTip.visible = st.tongue > .002;
  let tip = null;
  if (tongue.visible) {
    tip = mouth.clone().lerp(st.tongueTo, st.tongue);
    placeLimb(tongue, mouth, tip, .016); tongueTip.position.copy(tip);
    tongueTip.quaternion.setFromUnitVectors(V(1, 0, 0), st.tongueTo.clone().sub(mouth).normalize());
  }
  // mosquito
  mosq.visible = !!st.mosq || (st.mosqStuck && !!tip);
  if (st.mosqStuck && tip) {
    const dir = st.tongueTo.clone().sub(mouth).normalize();
    mosq.position.copy(tip).addScaledVector(dir, .036).add(V(0, .004, 0));
    mosq.quaternion.setFromUnitVectors(V(1, 0, 0), dir.clone().negate()); mosq.rotateX(.6);
    mWings.forEach(w => w.rotation.set(0, 0, w.userData.z * .3));
  } else if (st.mosq) {
    mosq.position.copy(st.mosq); mosq.rotation.set(0, Math.sin(T * 1.3) * 1.5 + 2.6, .1);
    const f = Math.sin(T * TAU * 27);
    mWings.forEach(w => w.rotation.set(w.userData.z * (.2 + .9 * f), 0, 0));
  }
  goo.forEach((g, i) => {
    g.visible = st.goo > 0 && !!tip;
    if (g.visible) { const a = tip.clone().add(V(.02, (i - 2) * .009, (i % 2 ? 1 : -1) * .01)); const b = mosq.position.clone().add(V(-.006, (i - 2) * .007, (i % 2 ? -1 : 1) * .006)); placeLimb(g, a, b, .0016 + .0008 * Math.sin(i + T * 2)); }
  });

  // diagramas
  const e0 = eyeWorld(0), e1 = eyeWorld(1);
  cones.forEach((c, i) => { c.visible = st.cones > .01; c.position.copy(i ? e1 : e0); c.quaternion.copy(cha.eyes[i].g.getWorldQuaternion(new THREE.Quaternion())); });
  coneMat.uniforms.uO.value = st.cones;
  sectors.forEach((m, i) => {
    m.visible = st.sector > .01; m.position.copy(i ? e1 : e0).add(V(0, .03, 0)); m.scale.setScalar(.85);
    m.rotation.set(0, i ? Math.PI : 0, 0); m.material.uniforms.uHalf.value = st.sectorHalf || 0; m.material.uniforms.uO.value = st.sector;
  });
  lockLines.forEach((m, i) => { m.visible = st.lock > .01 && !!st.mosq; if (m.visible) { const a = i ? e1 : e0; placeLimb(m, a, a.clone().lerp(st.mosq, st.lock), .005); } });
  target.visible = st.target > .01 && !!st.mosq;
  if (target.visible) { target.position.copy(st.mosq); target.quaternion.copy(camera.quaternion); target.scale.setScalar(st.target * (1 + .08 * Math.sin(T * 8))); }
  const dEnd = st.mosq || MQ;
  const dirD = dEnd.clone().sub(mouth), lenD = dirD.length(); dirD.normalize();
  const perp = V().crossVectors(dirD, ZV).normalize().multiplyScalar(-.09);
  dashes.forEach((m, i) => {
    const a0 = i / dashes.length, a1 = a0 + .55 / dashes.length;
    m.visible = st.dist > .01 && a0 < st.dist;
    if (m.visible) placeLimb(m, mouth.clone().addScaledVector(dirD, lenD * a0).add(perp), mouth.clone().addScaledVector(dirD, lenD * Math.min(a1, st.dist)).add(perp), .006);
  });
  // colchetes "2x"
  const bodyA = cha.root.localToWorld(V(-.49, -.12, .12)), bodyB = cha.root.localToWorld(V(.3, -.12, .12));
  const mouthP = mouth.clone(), tipP = MQ.clone();
  const tdir = tipP.clone().sub(mouthP).normalize(), tperp = V().crossVectors(tdir, ZV).normalize().multiplyScalar(-.1);
  brackets.forEach((m, i) => { m.visible = st.bracket > .01; });
  ticks.forEach(m => m.visible = (st.bracket > .01) || (st.dist > .01));
  if (st.bracket > .01) {
    const k = st.bracket;
    const bodyLen = mouthP.distanceTo(cha.root.localToWorld(V(-.49, .02, 0)));
    const bA = bodyA.clone(), bB = bodyA.clone().add(V(bodyLen * k, 0, 0));
    placeLimb(brackets[0], bA, bB, .008);
    const tA = mouthP.clone().add(tperp), tB = tA.clone().addScaledVector(tdir, mouthP.distanceTo(tipP) * k);
    placeLimb(brackets[1], tA, tB, .008);
    placeLimb(ticks[0], bA.clone().add(V(0, -.04, 0)), bA.clone().add(V(0, .04, 0)), .008);
    placeLimb(ticks[1], bB.clone().add(V(0, -.04, 0)), bB.clone().add(V(0, .04, 0)), .008);
    const tp = V().crossVectors(tdir, ZV).normalize().multiplyScalar(.04);
    placeLimb(ticks[2], tA.clone().sub(tp), tA.clone().add(tp), .008);
    placeLimb(ticks[3], tB.clone().sub(tp), tB.clone().add(tp), .008);
    ticks[4].visible = ticks[5].visible = false;
  } else if (st.dist > .01) {
    const tp = perp.clone().normalize().multiplyScalar(.04);
    const a = mouth.clone().add(perp), b = mouth.clone().addScaledVector(dirD, lenD * st.dist).add(perp);
    placeLimb(ticks[0], a.clone().sub(tp), a.clone().add(tp), .006);
    placeLimb(ticks[1], b.clone().sub(tp), b.clone().add(tp), .006);
    for (let i = 2; i < 6; i++) ticks[i].visible = false;
  }
  anchors.ceu = e0.clone().add(V(.15, .62, .3)); anchors.chao = e1.clone().add(V(.1, -.62, -.25));
  anchors.osso = cha.bone.getWorldPosition(V()).add(V(-.05, -.075, 0)); anchors.musculo = cha.muscle.getWorldPosition(V()).add(V(-.01, .09, 0));

  // micro
  micro.visible = !!st.micro;
  if (st.micro) {
    const { sp, l } = st.micro;
    crystals.forEach(c => { const ix = c.userData.ix; c.position.set(ix.x * sp * 1.25, ix.y * sp * .75 - .3, (ix.z - .5) * sp * 1.4); c.rotation.y += 0; });
    const k = range(sp, .27, .46);
    const refl = new THREE.Color('#2cff6a').lerp(new THREE.Color('#ff3a14'), k);
    micro.userData.outMat.color.copy(refl).multiplyScalar(1.6);
    micro.userData.cellMat.color.copy(new THREE.Color('#3bbf4a').lerp(new THREE.Color('#e23a22'), k)); micro.userData.cellMat.emissive.copy(micro.userData.cellMat.color);
    const hit = V(0, .55, .1);
    placeLimb(micro.userData.inBeam, V(-1.7, 2.6, .6), hit, .045);
    placeLimb(micro.userData.outBeam, hit, V(1.7, 2.6, .6), .055);
  }

  // câmera
  camera.up.copy(st.camUp);
  camera.position.copy(st.camPos); camera.fov = st.fov; camera.updateProjectionMatrix(); camera.lookAt(st.camTgt);
  camera.updateMatrixWorld(true);
  bokeh.uniforms.focus.value = st.focus ?? st.camPos.distanceTo(st.camTgt);
  bokeh.uniforms.aperture.value = st.aperture;
  gradePass.uniforms.uVig.value = st.vig; gradePass.uniforms.uTime.value = t;

  const degEl = document.getElementById('deg'); if (degEl && st.deg !== null) degEl.textContent = st.deg + '°';
  for (const x of TEXTS) {
    let k;
    if (window.__render) {
      k = Math.min(range(t, x.a, x.a + .3), 1 - range(t, x.b - .25, x.b)); const e = easeOut(k);
      x.el.style.transition = 'none'; x.el.style.opacity = k;
      x.el.style.transform = `translateY(${(1 - e) * 40}px) scale(${.92 + .08 * e})`;
    } else x.el.classList.toggle('on', t >= x.a && t < x.b);
    if (x.anchor && anchors[x.anchor]) {
      const p = anchors[x.anchor].clone().project(camera);
      x.el.style.left = ((p.x + 1) / 2 * W) + 'px'; x.el.style.top = ((1 - p.y) / 2 * H) + 'px';
      x.el.style.translate = '-50% -50%';
    }
  }

  composer.render();
}

/* ---------------- controle ---------------- */
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const params = new URLSearchParams(location.search);
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); }
function pause() { offset = current(); playing = false; }
function seek(t) { offset = clamp(t, 0, TOTAL); t0 = performance.now(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { seek(0); play(); }
  if (e.code === 'ArrowRight') seek(current() + 2);
  if (e.code === 'ArrowLeft') seek(current() - 2);
});
window.__total = TOTAL; window.__dbg = { scene, THREE, cha, camera, overlay };
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('nobokeh')) bokeh.enabled = false;
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
</body>
