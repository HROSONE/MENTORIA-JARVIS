<style>
  :root{ --accent:#00E5FF; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #s{display:block}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .ov{position:absolute;left:120px;right:120px;top:var(--y);text-align:center;color:#fff;font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1.05;

  .a{color:var(--accent)} .o{color:#FFB347} .r{color:#FF5A6A} .g{color:#5BFF9A}

  #start.hide{display:none}
</style>

<script>

const TEXTS = [

  { from: 110.3, to: 113.0, y: 90, fs: 56, html: 'NESSE INSTANTE, PARTÍCULAS DO ZEPTOVERSO<br><span class="a">PODEM ENTRAR NA CONTA</span>' },

  { from: 149.0, to: 150.9, y: 90, fs: 62, html: 'QUASE TUDO SE <span class="o">ANIQUILOU</span>' },
  { from: 151.2, to: 153.4, y: 90, fs: 66, html: 'SOBROU <span class="a">1 EM 1 BILHÃO</span>' },
  { from: 153.7, to: 156.9, y: 860, fs: 54, html: 'E A FÍSICA DE HOJE <span class="r">NÃO SABE EXPLICAR POR QUÊ</span>' },
  { from: 161.4, to: 164.9, y: 120, fs: 68, html: 'A RESPOSTA PODE ESTAR<br><span class="a">AQUI DENTRO</span>' },
  { from: 166.0, to: 171.0, y: 330, fs: 100, html: '<span class="btn">SE INSCREVE</span>' },
];
const TOTAL = EV.end;
const FONT = "Montserrat,'DejaVu Sans',sans-serif";
const W = 1920, H = 1080, CX = 960, CY = 540;

/* -------- sobrescreve câmera/pós para 16:9 -------- */
function lay(p, content, filter = '') {
  const z = CAM.z0 * (1 + (CAM.z / CAM.z0 - 1) * p), x = CAM.x0 + (CAM.x - CAM.x0) * p, y = CAM.y0 + (CAM.y - CAM.y0) * p;
  return `<g transform="translate(${CX},${CY}) rotate(${f1(CAM.r)}) scale(${Math.round(z * 10000) / 10000}) translate(${f1(-x)},${f1(-y)})"${filter ? ` filter="url(#${filter})"` : ''}>${content}</g>`;
}
function post(o = {}) {
  const { grade = null, gradeMode = 'soft-light', gradeO = .5, vig = 1, grain = .06, t = 0, bars = 0 } = o;
  const gid = nid('gr');
  def(`<filter id="${gid}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${Math.floor(t * 30) % 997}" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>`);
  let s = '';
  if (grade) s += `<rect width="${W}" height="${H}" fill="${grade}" opacity="${gradeO}" style="mix-blend-mode:${gradeMode}"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vig)" opacity="${vig}"/>`;
  s += `<rect width="${W}" height="${H}" filter="url(#${gid})" opacity="${grain}" style="mix-blend-mode:overlay"/>`;
  if (bars > 0) s += `<rect width="${W}" height="${f1(70 * bars)}" fill="#000"/><rect y="${f1(H - 70 * bars)}" width="${W}" height="${f1(70 * bars)}" fill="#000"/>`;
  return s;
}
const zoomG = (z, content, cx = CX, cy = CY, r = 0) => `<g transform="translate(${CX},${CY}) rotate(${f1(r)}) scale(${Math.round(z * 10000) / 10000}) translate(${f1(-cx)},${f1(-cy)})">${content}</g>`;
const txt = (x, y, s, size, fill = '#fff', anchor = 'middle', w = 900, extra = '') => `<text x="${f1(x)}" y="${f1(y)}" text-anchor="${anchor}" font-family="${FONT}" font-weight="${w}" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const STARS2 = Array.from({ length: 420 }, () => ({ x: rnd() * 2400 - 240, y: rnd() * 1400 - 160, r: .5 + rnd() * 2, p: rnd() * 6 }));
const stars2 = (t, k = 1) => STARS2.map(s => `<circle cx="${f1(s.x)}" cy="${f1(s.y)}" r="${s.r}" fill="#fff" opacity="${op((.4 + .6 * Math.sin(t * 2 + s.p)) * k)}"/>`).join('');

/* ---------------- 1. praia ---------------- */
const BOY_X = 760, BOY_Y = 1010, BOY_S = .5;
const GRAIN = [BOY_X + 184 * BOY_S, BOY_Y - 896 * BOY_S];
function beach(t, o = {}) {
  const { flick = 0, smile = 0 } = o;
  let s = `<rect x="-2000" y="-2000" width="6000" height="5000" fill="url(#skyBeach)"/>`;
  s += `<circle cx="1360" cy="600" r="420" fill="url(#sunG)"/><circle cx="1360" cy="600" r="66" fill="#FFFBEA"/>`;
  s += [[300, 260, 260], [900, 180, 200], [1600, 300, 300], [1250, 380, 160]].map(([x, y, w], i) => `<ellipse cx="${f1(x + t * 6 * (i + 1))}" cy="${y}" rx="${w}" ry="${w * .14}" fill="#FFC9A0" opacity=".45"/>`).join('');
  s += `<rect x="-2000" y="610" width="6000" height="160" fill="url(#seaG)"/>`;
  for (let i = 0; i < 26; i++) { const y = 616 + i * 6, w = 14 + i * 7 + 20 * Math.sin(t * 3 + i * 1.3); s += `<rect x="${f1(1360 - w / 2 + 8 * Math.sin(t * 2 + i))}" y="${y}" width="${f1(w)}" height="3" fill="#FFE7B0" opacity="${op(.75 - i * .022)}"/>`; }
  for (let i = 0; i < 5; i++) s += `<path d="M-2000 ${f1(700 + i * 16 + 4 * Math.sin(t + i))} Q 0 ${f1(690 + i * 16)} 4000 ${f1(700 + i * 16)}" stroke="#FFE2C0" stroke-width="2" opacity=".18" fill="none"/>`;
  s += `<path d="M-2000 760 Q 600 730 1200 748 T 4000 740 V 3000 H -2000Z" fill="url(#sandG)"/>`;
  s += `<path d="M-2000 760 Q 600 730 1200 748 T 4000 740" stroke="#FFF1D8" stroke-width="5" opacity=".6" fill="none"/>`;
  for (let i = 0; i < 12; i++) s += `<path d="M${-200 + i * 190} ${820 + (i % 4) * 60} q60 -12 120 0" stroke="#7A4E34" stroke-width="4" opacity=".35" fill="none"/>`;
  const lit = rig({ amb: '#C08878', k: [1, -.15], sh: '#2A1028', shO: .5, shD: 70, rims: [{ k: [1, -.2], c: '#FFD9A0', w: 14, o: 1, glow: 1 }] });
  const armR = [lerp(100, 120, flick), lerp(110, 60, flick)];
  s += person({ x: BOY_X, y: BOY_Y, sc: BOY_S, out: 'shirt', rig: lit, arms: [[10, -8], armR], head: { ex: smile > .5 ? 'feliz' : 'neutro', turn: .45, look: [10, -8], blink: blinkAt(t, 1) }, tilt: 6 });
  // o grão na ponta do dedo
  if (flick < .5) {
    const [gx, gy] = GRAIN, sp = .6 + .4 * Math.sin(t * 7);
    s += `<g style="mix-blend-mode:screen"><circle cx="${gx}" cy="${gy}" r="${f1(16 * sp)}" fill="url(#glowWarm)"/><path d="M${gx - 18 * sp} ${gy} L${gx + 18 * sp} ${gy} M${gx} ${gy - 18 * sp} L${gx} ${gy + 18 * sp}" stroke="#FFF6D8" stroke-width="1.4" transform="rotate(${f1(t * 40)} ${gx} ${gy})"/></g><circle cx="${gx}" cy="${gy}" r="2.2" fill="#FFE7B0"/>`;
  }
  return s;
}
/* ---------------- grão em macro ---------------- */
const GV = Array.from({ length: 11 }, (_, i) => { const a = i / 11 * Math.PI * 2; const r = 330 * (.78 + .3 * Math.sin(i * 2.7) * Math.cos(i * 1.3)); return [CX + Math.cos(a) * r, CY + Math.sin(a) * r * .86]; });
const BOKEH2 = Array.from({ length: 34 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, r: 30 + rnd() * 110, c: ['#FFD58A', '#FFB35C', '#FFE9C4', '#FF9A5A', '#B08AFF'][Math.floor(rnd() * 5)], o: .12 + rnd() * .3 }));
function grainShape(t, glow = 0) {
  let s = '';
  const fc = ['#F4D9A8', '#E2B97E', '#FBE9C6', '#C9975E', '#EBCB94', '#D9AA72'];
  for (let i = 0; i < GV.length; i++) { const a = GV[i], b = GV[(i + 1) % GV.length]; const c = [CX + 30 * Math.sin(i), CY - 20 + 20 * Math.cos(i * 2)]; s += `<path d="M${f1(c[0])} ${f1(c[1])} L${f1(a[0])} ${f1(a[1])} L${f1(b[0])} ${f1(b[1])}Z" fill="${fc[i % fc.length]}" opacity=".92"/>`; }
  s += `<path d="M${GV.map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L')}Z" fill="none" stroke="#FFF6E0" stroke-width="5" opacity=".7"/>`;
  s += `<g style="mix-blend-mode:screen"><path d="M${f1(GV[7][0])} ${f1(GV[7][1])} L${CX} ${CY - 20} L${f1(GV[8][0])} ${f1(GV[8][1])}Z" fill="#fff" opacity=".35"/><ellipse cx="${CX - 120}" cy="${CY - 150}" rx="90" ry="26" fill="#fff" opacity=".4" transform="rotate(-25 ${CX - 120} ${CY - 150})" filter="url(#bl8)"/></g>`;
  if (glow > 0) s += `<g style="mix-blend-mode:screen"><circle cx="${CX}" cy="${CY}" r="${f1(40 + 30 * Math.sin(t * 5))}" fill="url(#glowC)" opacity="${op(glow)}"/><circle cx="${CX}" cy="${CY}" r="4" fill="#fff" opacity="${op(glow)}"/></g>`;
  return s;
}
function macroBg(t) {

    [[200, -170], [230, 150], [60, 230]].forEach(([dx, dy], j) => { const p = C.parts[j + 1]; const x = px - 120 + dx * d, y = py + dy * d; ill += `<line x1="${px - 120}" y1="${py}" x2="${f1(x)}" y2="${f1(y)}" stroke="${p[1]}" stroke-width="4" ${p[0] === 'ν' ? 'stroke-dasharray="8 10" opacity=".6"' : ''}/><circle cx="${f1(x)}" cy="${f1(y)}" r="${p[0] === 'ν' ? 34 : 54}" fill="${p[1]}" opacity="${p[0] === 'ν' ? .4 : 1}"/>${txt(x, y + 14, p[0], 40, p[0] === 'ν' ? '#fff' : '#14101C')}`; });
  } else if (C.parts.length === 2) {
    const r = range(lt, .5, 3);
    [[-180, '#5BFF9A', 'MATÉRIA', 1], [180, '#FF5A8A', 'ANTIMATÉRIA', .9755]].forEach(([dx, col, lab, rate]) => {
      ill += `<circle cx="${px + dx}" cy="${py - 80}" r="80" fill="${col}" opacity=".9"/>${txt(px + dx, py - 60, dx < 0 ? 'Λb' : 'Λ̄b', 50, '#14101C')}${txt(px + dx, py + 60, lab, 28, col)}`;
      ill += `<rect x="${px + dx - 40}" y="${f1(py + 330 - 220 * r * rate)}" width="80" height="${f1(220 * r * rate)}" fill="${col}" opacity=".7"/>`;
    });
    ill += `<line x1="${px - 260}" y1="${py + 330}" x2="${px + 260}" y2="${py + 330}" stroke="#fff" stroke-width="3"/>`;
  } else {
    const r = range(lt, .4, 3.2);
    ill += `<g transform="translate(${px - 60},${py + 40})"><line x1="-260" y1="0" x2="260" y2="0" stroke="#fff" stroke-width="3" opacity=".6"/>
      ${txt(-200, 60, 'MEDIDA', 28, '#9FE8FF', 'middle', 800)}${txt(200, 60, 'PREVISÃO', 28, '#FFB347', 'middle', 800)}
      <circle cx="${f1(lerp(-200, -10, 0))}" cy="-40" r="30" fill="#9FE8FF"/><circle cx="${f1(lerp(200, 10, easeInOut(r)))}" cy="-40" r="30" fill="#FFB347"/>
      <line x1="-200" y1="-90" x2="${f1(lerp(200, 10, easeInOut(r)))}" y2="-90" stroke="#FF5A6A" stroke-width="4" opacity="${op(1 - r)}"/>${txt(0, -110, 'DIFERENÇA', 26, '#FF5A6A', 'middle', 800, `opacity="${op(1 - r)}"`)}</g>`;
  }
  c += ill;
  s += `<g transform="translate(${f1(-200 * (1 - ent) - 1920 * easeIn(ex))},0)" opacity="${op(ent)}">${c}</g>`;
  s += txt(CX, 1040, 'σ (SIGMA) = O QUANTO É IMPROVÁVEL SER SÓ ACASO · 3σ = INDÍCIO · 5σ = DESCOBERTA', 24, '#fff', 'middle', 700, 'opacity=".55"');
  return s;
}
function sevenScene(t) {
  const k = range(t, EV.seven, EV.bang);
  let s = `<rect width="${W}" height="${H}" fill="#02030A"/>` + stars2(t, .7);
  const P = [[520, 640], [700, 560], [880, 600], [1040, 520], [1180, 380], [1400, 420], [1360, 620]];
  const n = Math.min(7, Math.floor(range(t, EV.seven + .3, EV.seven + 3.2) * 7.99));
  s += `<g style="mix-blend-mode:screen">`;
  for (let i = 0; i < n - 1; i++) s += `<line x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[i + 1][0]}" y2="${P[i + 1][1]}" stroke="#9FE8FF" stroke-width="3" opacity=".6"/>`;
  for (let i = 0; i < n; i++) s += `<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${f1(70 + 10 * Math.sin(t * 3 + i))}" fill="url(#glowC)"/><circle cx="${P[i][0]}" cy="${P[i][1]}" r="9" fill="#fff"/>`;
  s += `</g>`;
  return zoomG(lerp(1.15, 1, easeOut(k)), s, CX, 540, lerp(-4, 2, k));
}
const PAIRS = Array.from({ length: 160 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, a: rnd() * 6.28, d: 30 + rnd() * 120, t: rnd() * 4, keep: rnd() < .04 }));
function bangScene(t) {
  let s = `<rect width="${W}" height="${H}" fill="#020106"/>`;
  if (t < EV.annih) {
    const k = range(t, EV.bang, EV.annih);
    s += `<g style="mix-blend-mode:screen"><circle cx="${CX}" cy="${CY}" r="${f1(50 + 1600 * easeOut(k))}" fill="url(#glowO)" opacity="${op(1 - k * .5)}"/><circle cx="${CX}" cy="${CY}" r="${f1(20 + 600 * easeOut(k))}" fill="url(#glowW)"/></g>`;
    return s;
  }
  if (t < EV.gal2) {
    const k = range(t, EV.annih, EV.left);
    s += `<g style="mix-blend-mode:screen"><rect width="${W}" height="${H}" fill="#FF8A3C" opacity="${op(.25 * (1 - k))}"/></g>`;
    for (const p of PAIRS) {
      const lt = (t - EV.annih) - p.t * .9, sep = lt < 0 ? p.d : Math.max(0, p.d * (1 - lt / .9));
      const gone = lt > .9 && !(p.keep && t > EV.left - .3);
      const cx = p.x, cy = p.y;
      if (lt > .9 && lt < 1.3) s += `<g style="mix-blend-mode:screen"><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(20 + 120 * (lt - .9))}" fill="url(#glowW)" opacity="${op(1 - (lt - .9) / .4)}"/></g>`;
      if (p.keep) { s += `<circle cx="${f1(cx + Math.cos(p.a) * Math.max(sep, lt > .9 ? 0 : sep))}" cy="${f1(cy + Math.sin(p.a) * sep)}" r="9" fill="#00E5FF"/>`; if (t > EV.left) s += `<g style="mix-blend-mode:screen"><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(40 + 10 * Math.sin(t * 5 + p.x))}" fill="url(#glowC)"/></g>`; if (!gone && lt <= .9) s += `<circle cx="${f1(cx - Math.cos(p.a) * sep)}" cy="${f1(cy - Math.sin(p.a) * sep)}" r="9" fill="#FF3FA4"/>`; continue; }
      if (gone) continue;
      s += `<circle cx="${f1(cx + Math.cos(p.a) * sep)}" cy="${f1(cy + Math.sin(p.a) * sep)}" r="9" fill="#00E5FF"/><circle cx="${f1(cx - Math.cos(p.a) * sep)}" cy="${f1(cy - Math.sin(p.a) * sep)}" r="9" fill="#FF3FA4"/>`;
    }
    return zoomG(lerp(1, 1.06, range(t, EV.annih, EV.gal2)), s);
  }
  const k = range(t, EV.gal2, EV.back);
  s += stars2(t, .6) + galaxy(t, CX, 560, lerp(.2, 1.05, easeOut(k)), t * 4, 1);
  return s;
}
function backScene(t) {
  // volta do zepto para o grão (rápido), depois praia
  if (t < EV.beach2) {
    const keys = [[EV.back, -21], [EV.beach2 - .2, -3.0], [EV.beach2, -3.0]];
    return dive(t, keys, true);
  }
  const k = range(t, EV.beach2, EV.endcard);
  setCam(lerp(GRAIN[0], 960, easeInOut(k)), lerp(GRAIN[1], 560, easeInOut(k)), lerp(8, 1.0, easeOut(range(t, EV.beach2, EV.beach2 + 2.6))), 0, [GRAIN[0], GRAIN[1], 8]);
  const B = beach(t, { smile: t > EV.beach2 + 1.8 ? 1 : 0, flick: easeOut(range(t, EV.endcard - 1.2, EV.endcard - .6)) });
  return lay(1, B);
}
function endCard(t) {
  const k = range(t, EV.endcard, EV.end);
  let s = `<rect width="${W}" height="${H}" fill="#02030A"/>` + stars2(t, .8);
  s += `<g style="mix-blend-mode:screen"><circle cx="${CX}" cy="400" r="${f1(220 + 20 * Math.sin(t * 2))}" fill="url(#glowP)" opacity=".6"/></g>`;
  s += txt(CX, 210, 'ZEPTOVERSO', 90, '#00E5FF', 'middle', 900, 'letter-spacing="12" opacity=".9"');
  const src = ['FONTES: CERN (NA62, 2024 · LHCb, Nature 2025) · BELLE II / KEK (2023)', 'FERMILAB MUON g-2 (2025) · A. BURAS, arXiv:2411.03440 · POPULAR MECHANICS (2026)'];
  src.forEach((l, i) => s += txt(CX, 880 + i * 44, l, 26, '#fff', 'middle', 700, 'opacity=".6"'));
  return s;
}

/* ---------------- quadro ---------------- */
function frame(t) {
  D = []; uid = 0;
  let Wd = '', P = { t }, flash = 0, shake = 0;
  if (t < EV.macro) {
    const k = range(t, 0, EV.macro);
    setCam(lerp(980, GRAIN[0], easeInOut(k)), lerp(560, GRAIN[1], easeInOut(k)), lerp(1.0, 3.2, easeInOut(k)) * lerp(1, 2.5, easeIn(range(t, EV.macro - .6, EV.macro))), lerp(-2, 1, k), [980, 560, 1.0]);
    Wd = lay(1, beach(t));
    P = { t, grade: '#FF9A3C', gradeO: .18, bars: 1 };
    if (t < .3) flash = 0;
  } else if (t < EV.glitch) {
    const k = range(t, EV.macro, EV.glitch);
    Wd = macroBg(t) + zoomG(lerp(1.0, 1.35, easeInOut(k)) * lerp(1, 6, easeIn(range(t, EV.glitch - .6, EV.glitch))), grainShape(t, range(t, EV.macro + 1, EV.macro + 2)), CX, CY, lerp(-3, 4, k));
    if (t < EV.macro + .2) flash = .6 * (1 - range(t, EV.macro, EV.macro + .2));
    P = { t, grade: '#FF9A3C', gradeO: .15, bars: 1 };
  } else if (t < EV.dive) {
    let s = `<rect width="${W}" height="${H}" fill="#020208"/>`;
    const g = Math.sin(t * 37) > .6 || (t > EV.title - .25 && t < EV.title);
    if (g || t < EV.glitch + .25) s += layerObj(-21, t).replace(/#00E5FF/g, '#FF3FA4');
    s += `<g opacity=".5">${layerObj(-21, t)}</g>`;
    Wd = `<g transform="translate(${g ? f1(noise1(t * 50) * 30) : 0},0)">${s}</g>`;
    if (t > EV.title && t < EV.title + .2) flash = .7 * (1 - range(t, EV.title, EV.title + .2));
    P = { t, bars: 1 };
  } else if (t < EV.earth) {
    Wd = dive(t);
    P = { t, vig: .8 };
  } else if (t < EV.galaxy) { Wd = earthBus(t); if (t < EV.earth + .2) flash = .5 * (1 - range(t, EV.earth, EV.earth + .2)); }
  else if (t < EV.waves) Wd = meterGalaxy(t);
  else if (t < EV.lhc) Wd = waves(t);
  else if (t < EV.tunnel) { const k = range(t, EV.lhc, EV.tunnel); Wd = mapScene(t, { lhcK: easeInOut(range(t, EV.lhc + .4, EV.lhc + 2.4)), rot: lerp(-12, 6, k), zoom: lerp(1.25, 1.05, easeOut(k)) * lerp(1, 3, easeIn(range(t, EV.tunnel - .6, EV.tunnel))), tilt: lerp(.62, .5, k) }); P = { t, bars: 1 }; }
  else if (t < EV.collide) { Wd = tunnel(t); P = { t, bars: 1, grade: '#2F6BFF', gradeO: .15 }; }
  else if (t < EV.fcc) { Wd = collision(t); if (t < EV.collide + .15) flash = 1 - range(t, EV.collide, EV.collide + .15); shake = 6 * (1 - range(t, EV.collide, EV.collide + .6)); P = { t, bars: 1 }; }
  else if (t < EV.years) { const k = range(t, EV.fcc, EV.years); Wd = mapScene(t, { lhcK: 1, fccK: easeInOut(range(t, EV.fcc + .4, EV.years - .4)), rot: lerp(6, 10, k), zoom: lerp(.9, .32, easeInOut(range(t, EV.fcc, EV.fcc + 2.5))), tilt: .6, focus: [lerp(1000, 700, easeInOut(range(t, EV.fcc, EV.fcc + 2.5))), lerp(520, 900, easeInOut(range(t, EV.fcc, EV.fcc + 2.5)))] }); P = { t, bars: 1 }; }
  else if (t < EV.echo) { Wd = yearsScene(t); P = { t, bars: 1 }; }
  else if (t < EV.kaon) { Wd = echoScene(t); if (t < EV.echo + .2) flash = .4 * (1 - range(t, EV.echo, EV.echo + .2)); P = { t, grade: '#2AC8FF', gradeO: .12 }; }
  else if (t < EV.cards) { Wd = kaonScene(t); if (t > EV.kdecay && t < EV.kdecay + .15) flash = .5; P = { t }; }
  else if (t < EV.seven) { Wd = cardScene(t); P = { t, vig: .7 }; }
  else if (t < EV.bang) Wd = sevenScene(t);
  else if (t < EV.back) { Wd = bangScene(t); if (t < EV.bang + .3) flash = 1 - range(t, EV.bang, EV.bang + .3); if (t < EV.annih) shake = 8; }
  else if (t < EV.endcard) { Wd = backScene(t); if (t >= EV.beach2) P = { t, grade: '#FF9A3C', gradeO: .18, bars: 1 }; if (t > EV.beach2 - .1 && t < EV.beach2 + .2) flash = .7 * (1 - range(t, EV.beach2 - .1, EV.beach2 + .2)); }
  else Wd = endCard(t);
  const sx = shake ? noise1(t * 30, 1) * shake * 2 : 0, sy = shake ? noise1(t * 30, 5) * shake * 2 : 0;
  const world = document.getElementById('world');
  world.setAttribute('transform', `translate(${f1(sx)},${f1(sy)})`);
  world.innerHTML = Wd;
  document.getElementById('post').innerHTML = post(P);
  document.getElementById('fdefs').innerHTML = D.join('');
  document.getElementById('flash').style.opacity = flash;
  for (const x of TEXTS) {
    if (window.__render) { const kk = Math.min(range(t, x.from, x.from + .15), 1 - range(t, x.to - .2, x.to)), e = easeOut(kk); x.el.style.transition = 'none'; x.el.style.opacity = kk; x.el.style.transform = `translateY(${(1 - e) * 30}px) scale(${.94 + .06 * e})`; }
    else x.el.classList.toggle('on', t >= x.from && t < x.to);
  }
}

/* ---------------- textos + controle ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) { const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = x.html; el.style.setProperty('--y', x.y + 'px'); el.style.setProperty('--fs', x.fs + 'px'); textHost.appendChild(el); x.el = el; }
const params = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const audio = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null;
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); if (audio) { audio.currentTime = offset; audio.play(); } }
function pause() { offset = current(); playing = false; if (audio) audio.pause(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { pause(); offset = 0; play(); }
  if (e.code === 'ArrowRight') { const p = playing; pause(); offset = Math.min(TOTAL, offset + 5); if (p) play(); }
  if (e.code === 'ArrowLeft') { const p = playing; pause(); offset = Math.max(0, offset - 5); if (p) play(); }
});
window.__total = TOTAL;
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
