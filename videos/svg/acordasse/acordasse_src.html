<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E se você acordasse com 2 cm</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s,1));background:#000}
  svg{display:block}
  text{font-family:'DejaVu Sans Mono','DejaVu Sans',monospace;font-weight:800}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:800 54px sans-serif;background:rgba(0,0,0,.55);cursor:pointer}
  #start.hide{display:none}
</style>
</head>
<body>
<div id="stage">
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs id="defs"></defs>
<g id="root"></g>
</svg>
<div id="start">▶ CLIQUE (com som)</div>
</div>
<!--AUDIO-->
<!--NARR-->
<script>
/*LIB*/
const W = 1080, H = 1920;
const N = window.NARR, S = Object.fromEntries(N.s.map(x => [x.k, x]));
const T = k => S[k].t0, E = k => S[k].t1, TOTAL = N.total;
const R = (() => { let s = 41; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
/*SHARED*/
/*GATO*/

/* =====================================================================================
   E se você acordasse com 2 cm de altura?  Você: silhueta azul-marinho sem rosto, borda de luz quente.
   O gato (cinza rajado, olhos verdes) vem do Short da CIA (svg/gato).  Mundo gigante, luz de manhã.
   ===================================================================================== */
const NAVY = '#141A2C', RIM = '#FFC07A', RIMC = '#BFD8FF';
const eu = o => sil(Object.assign({ kind: 'homem', col: NAVY, rim: RIM, rimK: [1, -.35], shadow: .3 }, o));
const hand2 = t => [Math.sin(t * 1.3) * 3 + Math.sin(t * 3.1) * 1.5, Math.cos(t * 1.1) * 3];
const shotAt = t => SH.find(s => t >= s[1] && t < s[2]) || SH[SH.length - 1];
const loc = (t, id) => { const s = SH.find(x => x[0] === id); return { L: t - s[1], d: s[2] - s[1], k: (t - s[1]) / (s[2] - s[1]) }; };
const GRAINV = t => { const j = Math.floor(t * 24); return `<rect x="-200" y="-200" width="1480" height="2320" fill="url(#noiseP)" opacity=".045" transform="translate(${(j * 37) % 200 - 100},${(j * 53) % 200 - 100})"/>`; };
const blur = (px, c) => { const id = 'bl' + px; if (!D.some(d => d.includes(`id="${id}"`))) def(`<filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${px}"/></filter>`); return `<g filter="url(#${id})">${c}</g>`; };

/* ---------------- mundo gigante ---------------- */
// raios de sol entrando pela janela + poeira brilhando
function raios(t, k = 1, x0 = 1180, y0 = -300) {
  let s = '';
  for (let i = 0; i < 5; i++) { const a = -2.35 + i * .09, w = 70 + i * 30; s += `<path d="M${x0} ${y0} L${f1(x0 + Math.cos(a) * 3200 - w)} ${f1(y0 - Math.sin(a) * -3200)} L${f1(x0 + Math.cos(a) * 3200 + w)} ${f1(y0 - Math.sin(a) * -3200)}Z" fill="#FFF1C8" opacity="${op((.07 + .03 * Math.sin(t * .8 + i)) * k)}"/>`; }
  for (let i = 0; i < 60; i++) { const ph = i * 1.7, x = (i * 173.3 + t * (8 + i % 5) + Math.sin(t * .6 + ph) * 30) % 1300 - 110, y = (i * 311.7 - t * (12 + i % 7) * 2 + 4000) % 2100 - 90, r = 1.5 + (i % 4); s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="#FFF6DA" opacity="${op((.35 + .35 * Math.sin(t * 2 + ph)) * k)}"/>`; }
  return s;
}
// travesseiro visto de perto (tecido com costura acolchoada e dobras)
function travesseiro(y0, t, o = {}) {
  const c1 = o.c1 || '#F1F3F8', c2 = o.c2 || '#D6DCE8', id = nid('tv');
  def(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`);
  let s = `<path d="M-500 ${y0 + 40} Q-200 ${y0 - 30} 200 ${y0 + 10} Q620 ${y0 + 50} 1000 ${y0 - 10} Q1300 ${y0 - 40} 1600 ${y0 + 30} L1600 3000 L-500 3000Z" fill="url(#${id})"/>`;
  for (let i = 0; i < 9; i++) { const yy = y0 + 70 + i * 120 + i * i * 8; s += `<path d="M-500 ${yy} Q300 ${yy - 30 + i * 4} 1600 ${yy + 10}" stroke="#C4CCDA" stroke-width="${3 + i}" stroke-dasharray="${14 + i * 3} ${10 + i * 2}" fill="none" opacity=".8"/>`; }
  for (let i = 0; i < 7; i++) { const xx = -300 + i * 260; s += `<path d="M${xx} ${y0 + 20} Q${xx + 60} ${y0 + 500} ${xx - 40} 3000" stroke="#C4CCDA" stroke-width="5" stroke-dasharray="16 12" fill="none" opacity=".55"/>`; }
  s += `<path d="M-500 ${y0 + 60} Q200 ${y0 + 10} 1600 ${y0 + 60}" stroke="#FFFFFF" stroke-width="16" fill="none" opacity=".7"/>`;
  for (let i = 0; i < 6; i++) { const x = -200 + i * 300, y = y0 + 220 + (i % 3) * 140; s += `<path d="M${x} ${y} q120 -60 240 0" stroke="#B8C0D0" stroke-width="14" fill="none" opacity=".35"/>`; }   // dobras
  return s;
}
// tapete felpudo (fios grossos em close)
function tapete(y0, t, k = 1) {
  let s = `<rect x="-600" y="${y0}" width="2300" height="2400" fill="#B8524A"/>`;
  for (let r = 0; r < 9; r++) for (let i = 0; i < 46; i++) {
    const x = -600 + i * 50 + (r % 2) * 25, y = y0 + r * 70 + 30, h = 90 + ((i * 7 + r * 13) % 5) * 14, sw = Math.sin(t * 1.5 + i * .7 + r) * 6 * k;
    s += `<path d="M${x} ${y + 60} Q${f1(x + sw * .5)} ${y} ${f1(x + sw)} ${y - h * .5}" stroke="${['#C8635A', '#A8443E', '#D8786C', '#9A3A36'][(i + r) % 4]}" stroke-width="${22 - r * 1.2}" fill="none" stroke-linecap="round"/>`;
  }
  return s;
}
// piso de cerâmica do banheiro (rejunte em perspectiva)
function piso(y0, t, cor = '#E6EEF2', rej = '#B8C6CE') {
  let s = `<rect x="-600" y="${y0}" width="2300" height="2600" fill="${cor}"/>`;
  for (let i = 0; i < 8; i++) { const y = y0 + Math.pow(i / 7, 1.6) * 1200; s += `<rect x="-600" y="${f1(y)}" width="2300" height="${4 + i * 1.5}" fill="${rej}"/>`; }
  for (let i = -8; i < 9; i++) s += `<path d="M${540 + i * 90} ${y0} L${540 + i * 420} ${y0 + 1400}" stroke="${rej}" stroke-width="5"/>`;
  return s;
}
// tábuas de madeira da cozinha
function assoalho(y0, t, x0 = 0) {
  let s = `<rect x="-800" y="${y0}" width="2700" height="2600" fill="#B07A48"/>`;
  for (let i = 0; i < 9; i++) { const y = y0 + Math.pow(i / 8, 1.5) * 1300; s += `<rect x="-800" y="${f1(y)}" width="2700" height="${3 + i}" fill="#7A4E2A"/>`; for (let g = 0; g < 4; g++) s += `<path d="M${f1(-800 + ((g * 643 + i * 211 + x0) % 2700))} ${f1(y + 20 + g * 8 + i * 4)} q300 -8 600 0" stroke="#946236" stroke-width="${2 + i * .4}" fill="none" opacity=".7"/>`; }
  return s;
}
// gota d'água gigante (esfera com refração, brilho e a janela refletida)
function gota(x, y, r, t, o = {}) {
  const id = nid('gt'), sq = 1 + Math.sin(t * 3) * .015;
  def(`<radialGradient id="${id}" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".25" stop-color="#C8ECFF" stop-opacity=".55"/><stop offset=".75" stop-color="#6AB8E8" stop-opacity=".45"/><stop offset="1" stop-color="#2A6AA8" stop-opacity=".7"/></radialGradient>`);
  let s = `<ellipse cx="${x}" cy="${f1(y + r * .92)}" rx="${f1(r * 1.15)}" ry="${f1(r * .16)}" fill="#3A7AB0" opacity=".25" filter="url(#b12)"/>`;
  s += `<ellipse cx="${x}" cy="${f1(y + r * .1)}" rx="${f1(r * 1.08 * sq)}" ry="${f1(r * .9 / sq)}" fill="url(#${id})" stroke="#2A6AA8" stroke-width="4" opacity=".95"/>`;
  s += `<path d="M${f1(x - r * .55)} ${f1(y - r * .35)} q${f1(r * .25)} ${f1(-r * .3)} ${f1(r * .6)} ${f1(-r * .32)}" stroke="#fff" stroke-width="${f1(r * .07)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
  s += `<rect x="${f1(x + r * .15)}" y="${f1(y - r * .55)}" width="${f1(r * .3)}" height="${f1(r * .22)}" rx="6" fill="#fff" opacity=".55"/><path d="M${f1(x + r * .3)} ${f1(y - r * .55)} l0 ${f1(r * .22)} M${f1(x + r * .15)} ${f1(y - r * .44)} l${f1(r * .3)} 0" stroke="#6AB8E8" stroke-width="4"/>`;
  s += `<path d="M${f1(x - r * .9)} ${f1(y + r * .5)} Q${x} ${f1(y + r * .95)} ${f1(x + r * .9)} ${f1(y + r * .5)}" stroke="#E8F8FF" stroke-width="${f1(r * .05)}" fill="none" opacity=".6"/>`;
  return s;
}
// balança digital de cozinha com o visor
function balanca(x, y, s, texto, t) {
  const pisca = Math.floor(t * 2) % 2;
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="250" rx="900" ry="70" fill="#000" opacity=".3" filter="url(#b12)"/>
    <path d="M-820 0 L820 0 L860 200 Q860 240 820 240 L-820 240 Q-860 240 -860 200Z" fill="#E8ECF0" stroke="${OL}" stroke-width="10"/><path d="M-800 0 L800 0 L790 40 L-790 40Z" fill="#FFFFFF"/>
    <rect x="-300" y="80" width="600" height="130" rx="18" fill="#1E2A22" stroke="${OL}" stroke-width="8"/><rect x="-280" y="96" width="560" height="98" rx="10" fill="#9ED89A"/>
    <text x="0" y="178" font-size="92" fill="#1E3A20" text-anchor="middle">${texto}</text><circle cx="380" cy="146" r="26" fill="${pisca ? '#FF5A4A' : '#8A2A22'}" stroke="${OL}" stroke-width="6"/></g>`;
}
// migalha de pão gigante (porosa, dourada)
function migalha(x, y, r, rot) {
  let s = `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})"><path d="M${-r} ${-r * .2} Q${-r * .9} ${-r * .95} ${-r * .1} ${-r} Q${r * .8} ${-r * 1.05} ${r} ${-r * .25} Q${r * 1.05} ${r * .7} ${r * .1} ${r * .85} Q${-r * .9} ${r} ${-r} ${-r * .2}Z" fill="#E8B866" stroke="${OL}" stroke-width="8"/>`;
  s += `<path d="M${-r * .9} ${-r * .3} Q${-r * .7} ${-r * .9} ${-r * .05} ${-r * .95} Q${r * .7} ${-r} ${r * .9} ${-r * .3}" stroke="#A86A2A" stroke-width="${f1(r * .16)}" fill="none" stroke-linecap="round"/>`;
  for (let i = 0; i < 16; i++) { const a = i * 2.39, rr = r * (.2 + .55 * ((i * 37) % 10) / 10); s += `<ellipse cx="${f1(Math.cos(a) * rr)}" cy="${f1(Math.sin(a) * rr * .8 + r * .1)}" rx="${f1(r * (.05 + (i % 3) * .03))}" ry="${f1(r * (.04 + (i % 2) * .03))}" fill="#C8904A"/>`; }
  return s + `<path d="M${-r * .4} ${r * .2} q${r * .3} ${-r * .2} ${r * .6} 0" stroke="#FFE2A0" stroke-width="10" fill="none" opacity=".7" stroke-linecap="round"/></g>`;
}
// ratinho (lado, virado para a direita)
function rato(x, y, s, t, o = {}) {
  const ph = o.ph || 0, walk = o.walk || 0, b = Math.abs(Math.sin(t * 12 + ph)) * 8 * walk;
  return `<g transform="translate(${f1(x)},${f1(y - b)}) scale(${f1(s * (o.flip || 1) * 1000) / 1000},${s}) rotate(${f1(o.rot || 0)})">
    <path d="M-150 -60 Q-260 -40 -300 -120 Q-330 -180 -280 -200" stroke="#E8A0A8" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M-170 -10 Q-190 -160 -20 -170 Q120 -170 160 -80 L210 -50 Q190 -10 120 -6Z" fill="#9AA0AE" stroke="${OL}" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-120 -30 Q-40 -60 60 -40" stroke="#C8CCD8" stroke-width="16" fill="none" opacity=".6" stroke-linecap="round"/>
    <circle cx="70" cy="-160" r="54" fill="#B8BCC8" stroke="${OL}" stroke-width="9"/><circle cx="70" cy="-160" r="30" fill="#F2A8B4"/>
    <circle cx="140" cy="-96" r="11" fill="${OL}"/><circle cx="144" cy="-100" r="4" fill="#fff"/><circle cx="214" cy="-52" r="12" fill="#E87A8E" stroke="${OL}" stroke-width="5"/>
    <path d="M200 -56 l70 -14 M200 -48 l72 4" stroke="#F4F4F8" stroke-width="3"/>
    <rect x="-110" y="-16" width="30" height="${f1(22 + 10 * Math.sin(t * 12 + ph) * walk)}" rx="12" fill="#8A909E" stroke="${OL}" stroke-width="5"/><rect x="60" y="-16" width="30" height="${f1(22 - 10 * Math.sin(t * 12 + ph) * walk)}" rx="12" fill="#8A909E" stroke="${OL}" stroke-width="5"/></g>`;
}
// pata do gato vista de baixo (almofadinhas rosa)
function pata(x, y, s, t) {
  return `<g transform="translate(${f1(x)},${f1(y)}) scale(${s})">
    <path d="M-170 -900 L170 -900 L190 -60 Q190 120 0 130 Q-190 120 -190 -60Z" fill="${CAT.fur}" stroke="${OL}" stroke-width="12"/>
    <path d="M-120 -900 Q-100 -500 -140 -140 M60 -900 Q80 -500 40 -160" stroke="${CAT.stripe}" stroke-width="30" fill="none" opacity=".5" stroke-linecap="round"/>
    <path d="M-110 10 Q0 -60 110 10 Q120 90 0 100 Q-120 90 -110 10Z" fill="${CAT.pink}" stroke="${OL}" stroke-width="8"/>
    ${[-120, -42, 42, 120].map((dx, i) => `<ellipse cx="${dx}" cy="${-70 - (i === 1 || i === 2 ? 26 : 0)}" rx="42" ry="48" fill="${CAT.pink}" stroke="${OL}" stroke-width="8"/>`).join('')}</g>`;
}
// sopro de frio
const bafo = (x, y, t, k = 1) => { let s = ''; for (let i = 0; i < 3; i++) { const q = (t * .9 + i / 3) % 1; s += `<ellipse cx="${f1(x + q * 60)}" cy="${f1(y - q * 50)}" rx="${f1(14 + q * 40)}" ry="${f1(10 + q * 26)}" fill="#EAF4FF" opacity="${op((1 - q) * .6 * k)}" filter="url(#b4)"/>`; } return s; };

/* ===================== cenas =====================
   DECUPAGEM (diretor):
   1 gancho   contra-plongée do travesseiro; grande-angular; você pequeno no terço de baixo, o rosto do gato ocupa o alto; push-in lento; pupilas dilatando
   2 pata     plongée (ponto de vista do gato); a sombra da pata chega antes da pata; tremor no impacto; você desvia
   3 pulo     plano geral lateral da beira da cama (penhasco); você corre e pula; a câmera desce junto (aproveita a altura do vertical)
   4 queda    travelling vertical acompanhando a queda (móveis passando para cima), um ratinho cai junto; contra-plongée no pouso no tapete
   5 gota     macro na altura dos olhos, fundo desfocado; a água sobe pelo braço e te puxa; luz fria do banheiro
   6 balança  plano médio que fecha no visor "0,1 g" e volta para você tremendo de frio; luz azul
   7 migalha  travelling lateral baixo; você empurra a migalha; formiga passa no fundo; luz quente
   8 ronrono  plano médio, uma sombra enorme cobre você; você vira; corta para o mesmo contra-plongée do gancho (loop)
*/
const SH = [['olho', 0, T('b2') - .1], ['pata', T('b2') - .1, T('b3') - .1], ['pulo', T('b3') - .1, T('b4') - .1], ['queda', T('b4') - .1, T('b5') - .1],
  ['gota', T('b5') - .1, T('b6') - .1], ['balanca', T('b6') - .1, T('b7') - .1], ['migalha', T('b7') - .1, T('b8') - .1], ['ronrono', T('b8') - .1, TOTAL]];

function quarto(t, k = 1) {   // fundo do quarto, desfocado (parede, janela com sol, quadro)
  return `<rect x="-900" y="-900" width="2900" height="3700" fill="#F2D8B8"/><rect x="600" y="-200" width="700" height="900" fill="#FFF4D8"/><rect x="600" y="-200" width="700" height="900" fill="none" stroke="#C8A070" stroke-width="40"/><path d="M950 -200 L950 700 M600 250 L1300 250" stroke="#C8A070" stroke-width="30"/>
    <rect x="-300" y="80" width="420" height="320" fill="#6A8AB8" stroke="#3A2A20" stroke-width="22"/><circle cx="-80" cy="190" r="60" fill="#F2C860"/>` + raios(t, k, 1000, -150);
}
function cenaGato(t, L, pupila, push) {   // contra-plongée do gancho (usada no início e no fim)
  const [jx, jy] = hand2(t);
  setCam(540 + jx, lerp(980, 900, push) + jy, lerp(1.0, 1.18, push), lerp(-2, 1, push), [540, 980, 1]);
  let s = lay(.15, blur(14, quarto(t)));
  const blink = pulse(L, 2.2, 2.45, .1);
  s += lay(.45, catFace(540, 640, 1.95, { pupil: pupila, lookX: Math.sin(t * .7) * .15, lookY: .5, earL: Math.sin(t * 3) * 6, earR: -Math.sin(t * 2.4) * 8, blink, mouth: 'w' }));
  s += lay(.45, `<ellipse cx="540" cy="1020" rx="560" ry="120" fill="#000" opacity=".18" filter="url(#b30)"/>`);
  s += lay(1, travesseiro(1180, t));
  const tremor = Math.sin(t * 26) * 3;
  s += lay(1, eu({ x: 330 + tremor, y: 1420, s: .44, armF: [-150, -25], armB: [150, 25], lean: -4 }));
  s += lay(1, raios(t, .6, 1100, -300));
  return s;
}
// 1. GANCHO: acordou com 2 cm e o gato está olhando
function sOlho(t) {
  TT = t; const { L, d, k } = loc(t, 'olho');
  return cenaGato(t, L, lerp(.3, .62, easeInOut(range(L, .3, 2.6))), easeInOut(k)) + VIG(.7) + GRAINV(t);
}
// 2. a pata: ponto de vista do gato (de cima)
function sPata(t) {
  TT = t; const { L, d, k } = loc(t, 'pata'), [jx, jy] = hand2(t);
  const desce = L < 2.4 ? easeIn(range(L, .9, 2.0)) : 1 - easeOut(range(L, 2.6, 3.6));
  const hit = range(L, 2.0, 2.4), sh = hit > 0 && hit < 1 ? Math.sin(L * 80) * 14 * (1 - hit) : 0;
  setCam(540 + jx + sh, 1000 + jy + sh * .6, lerp(1.05, 1.2, easeInOut(k)), 0, [540, 1000, 1]);
  let s = `<rect width="1080" height="1920" fill="#E8ECF4"/>`;
  s += lay(1, travesseiro(-400, t, { c1: '#F4F6FA', c2: '#DCE2EC' }));
  // você corre para a esquerda e se joga quando a pata vem
  const fuga = easeOut(range(L, 1.6, 2.3)), x = lerp(620, 300, fuga);
  const somb = range(L, .2, 2.0);
  s += lay(1, `<ellipse cx="${f1(lerp(700, 640, somb))}" cy="${f1(1060)}" rx="${f1(lerp(120, 260, somb))}" ry="${f1(lerp(80, 170, somb))}" fill="#3A4258" opacity="${op(somb * .45)}" filter="url(#b30)"/>`);
  s += lay(1, eu({ x, y: 1200, s: .46, ph: L * 9, walk: fuga > 0 && fuga < 1 ? 1 : 0, lean: fuga > 0 && fuga < 1 ? -14 : 0, flip: -1, armF: fuga > .9 ? [-120, -30] : null, armB: fuga > .9 ? [120, 30] : null }));
  if (hit > 0 && hit < 1) for (let i = 0; i < 10; i++) { const a = i * .63, q = hit; s += lay(1, `<line x1="${f1(640 + Math.cos(a) * (180 + q * 160))}" y1="${f1(1070 + Math.sin(a) * (110 + q * 100))}" x2="${f1(640 + Math.cos(a) * (230 + q * 220))}" y2="${f1(1070 + Math.sin(a) * (140 + q * 140))}" stroke="#8A92A8" stroke-width="10" stroke-linecap="round" opacity="${op(1 - q)}"/>`); }
  s += lay(1.3, pata(640, lerp(-500, 1060, desce), lerp(1.6, 1.15, desce), t));
  return s + VIG(.8) + GRAINV(t);
}
// 3. a beira da cama vira um penhasco: corre e pula
function sPulo(t) {
  TT = t; const { L, d, k } = loc(t, 'pulo'), [jx, jy] = hand2(t);
  const pulo = range(L, 2.1, d), desce = easeIn(range(L, 2.4, d));
  setCam(lerp(520, 640, k) + jx, lerp(900, 1500, desce) + jy, lerp(1.0, .9, k), 0, [540, 900, 1]);
  let s = lay(.2, blur(10, quarto(t, .8) + `<rect x="-900" y="1400" width="2900" height="1500" fill="#C8A47A"/>`));
  s += lay(.35, blur(6, catSide(-60, 760, .7, { pose: 'sit', lookX: 1, tailAmp: 1.4 })));
  // colchão (bloco) com lençol caindo pela lateral
  s += lay(1, `<path d="M-700 800 L780 800 Q840 800 850 860 L880 2000 L-700 2000Z" fill="#DCE4F0"/><path d="M-700 800 L790 800" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M780 820 Q900 1000 860 1300 Q900 1600 840 2000 L700 2000 Q760 1500 740 1200 Q760 980 700 820Z" fill="#C8D2E4" stroke="#AAB6CC" stroke-width="6"/>
    ${Array.from({ length: 6 }, (_, i) => `<path d="M${720 + i * 22} ${900 + i * 30} Q${790 + i * 10} 1400 ${740 + i * 18} 2000" stroke="#B0BCD2" stroke-width="5" fill="none"/>`).join('')}
    <rect x="-700" y="2000" width="2300" height="900" fill="#8A5A36"/>`);
  s += lay(1, `<rect x="-700" y="3200" width="2300" height="600" fill="#B8524A"/>`);
  const corre = easeIn(range(L, .3, 2.1)), x = lerp(120, 760, corre);
  const px = pulo > 0 ? lerp(760, 940, easeOut(pulo)) : x, py = pulo > 0 ? 800 - 120 * Math.sin(Math.min(1, pulo * 2.2) * Math.PI) + Math.max(0, pulo - .45) * 1800 : 800;
  s += lay(1, eu({ x: px, y: py, s: .4, ph: L * 11, walk: pulo > 0 ? 0 : 1, lean: pulo > 0 ? 20 : 8, armF: pulo > 0 ? [-160, -20] : null, armB: pulo > 0 ? [160, 20] : null, shadow: pulo > 0 ? 0 : .3 }));
  return s + VIG(.7) + GRAINV(t);
}
// 4. a queda que não machuca (com um ratinho caindo junto) e o pouso no tapete
function sQueda(t) {
  TT = t; const { L, d, k } = loc(t, 'queda'), [jx, jy] = hand2(t);
  const pouso = range(L, 4.2, 5.0), cair = range(L, 0, 4.4);
  setCam(540 + jx, 960 + jy + (pouso > 0 && pouso < .4 ? Math.sin(L * 50) * 8 : 0), lerp(1.0, 1.15, pouso), 0, [540, 960, 1]);
  const sc = cair * 2600;      // móveis passando para cima (paralaxe)
  let s = `<rect width="1080" height="1920" fill="#F0D4B4"/>`;
  s += lay(.3, blur(8, `<g transform="translate(0,${f1(-sc * .3)})"><rect x="-300" y="0" width="420" height="3600" fill="#8A5A36"/><rect x="760" y="300" width="500" height="900" fill="#A87448"/><rect x="800" y="360" width="420" height="200" fill="#8A5A36"/><circle cx="1010" cy="460" r="18" fill="#E8C060"/><rect x="800" y="620" width="420" height="200" fill="#8A5A36"/><circle cx="1010" cy="720" r="18" fill="#E8C060"/></g>`));
  s += lay(.6, `<g transform="translate(0,${f1(-sc * .7)})"><path d="M-200 -200 L120 -200 L140 2200 L-180 2200Z" fill="#C8D2E4"/>${Array.from({ length: 5 }, (_, i) => `<path d="M${-150 + i * 60} -200 Q${-120 + i * 50} 1000 ${-160 + i * 64} 2200" stroke="#AAB6CC" stroke-width="6" fill="none"/>`).join('')}</g>`);
  // linhas de vento
  for (let i = 0; i < 14; i++) { const q = (t * 2.2 + i / 14) % 1; if (pouso < .2) s += `<line x1="${f1(120 + i * 70)}" y1="${f1(1900 - q * 2200)}" x2="${f1(120 + i * 70)}" y2="${f1(2050 - q * 2200)}" stroke="#FFFFFF" stroke-width="5" opacity="${op(.5 * (1 - pouso * 5))}"/>`; }
  // chão (tapete) sobe no fim
  const chao = lerp(2600, 1340, easeOut(range(L, 3.6, 4.4)));
  s += lay(1, tapete(chao, t));
  const chega = easeIn(range(L, 3.6, 4.3)), yv = lerp(900 + Math.sin(L * 2) * 40, chao - 2, chega), rot = pouso > 0 ? lerp(220, 0, easeOut(pouso)) : L * 50;
  const quica = pouso > 0 && pouso < .5 ? Math.sin(pouso / .5 * Math.PI) * 60 : 0, levanta = range(L, 5.2, 6.0);
  s += lay(1, rato(lerp(800, 860, pouso) + (levanta > 0 ? levanta * 400 : 0), lerp(760 + Math.sin(L * 2.4 + 1) * 50, chao + 6, chega) - quica * .6, .55, t, { rot: pouso > 0 ? lerp(160, 0, easeOut(pouso)) : L * 70 + 30, walk: levanta > 0 ? 1 : 0 }));
  s += lay(1, `<g transform="rotate(${f1(rot)} 420 ${f1(yv - 150)})">${eu({ x: 420, y: yv - quica, s: .42, armF: pouso < .6 ? [-160, -20] : [-20, -10 + 20 * Math.sin(L * 12) * levanta], armB: pouso < .6 ? [160, 20] : [20, 10], shadow: 0 })}</g>`);
  if (pouso > .3 && pouso < 1) for (let i = 0; i < 8; i++) { const a = Math.PI + i * .45, q = (pouso - .3) / .7; s += lay(1, `<circle cx="${f1(420 + Math.cos(a) * 120 * q)}" cy="${f1(chao - 10 + Math.sin(a) * 60 * q)}" r="${f1(8 * (1 - q) + 2)}" fill="#E8B0A8" opacity="${op(1 - q)}"/>`); }
  return s + VIG(.7) + GRAINV(t);
}
// 5. a gota d'água que vira armadilha
function sGota(t) {
  TT = t; const { L, d, k } = loc(t, 'gota'), [jx, jy] = hand2(t);
  const toca = range(L, 1.6, 2.2), sobe = easeInOut(range(L, 2.2, 4.6)), puxa = range(L, 3.2, d);
  setCam(lerp(520, 560, k) + jx, 1000 + jy, lerp(1.0, 1.3, easeInOut(range(L, 2.0, d))), 0, [540, 1000, 1]);
  let s = `<rect width="1080" height="1920" fill="#CFE2EC"/>`;
  s += lay(.2, blur(16, `<rect x="-800" y="-800" width="2700" height="1900" fill="#DCEAF0"/><path d="M200 -200 Q250 300 600 320 L620 380 Q260 380 150 -200Z" fill="#E8F0F4"/><rect x="560" y="300" width="160" height="80" rx="30" fill="#B8C8D4"/>${Array.from({ length: 12 }, (_, i) => `<circle cx="${80 + i * 90}" cy="${300 + (i % 3) * 120}" r="${30 + (i % 4) * 14}" fill="#FFFFFF" opacity=".35"/>`).join('')}`));
  s += lay(.6, piso(1050, t));
  // pingo caindo da torneira para dentro da gota (no começo)
  const pg = range(L, .2, 1.0);
  if (pg > 0 && pg < 1) s += lay(1, `<ellipse cx="660" cy="${f1(lerp(-200, 900, easeIn(pg)))}" rx="18" ry="28" fill="#9AD0F0" stroke="#2A6AA8" stroke-width="4"/>`);
  s += lay(1, gota(660, 1040, 250 + 8 * Math.sin(t * 4) * (pg > .9 ? 1 : 0), t));
  // você: estende o braço, a água sobe e te puxa
  const xx = lerp(330, 420, toca) + puxa * 60, ajoelha = easeInOut(range(L, 4.4, d));
  s += lay(1, eu({ x: xx, y: 1320, s: .46, armF: [lerp(-30, -95, toca), lerp(10, -5, toca)], armB: [lerp(20, 60, puxa), lerp(20, 50 * Math.sin(L * 8), puxa)], lean: lerp(0, 18, puxa), sit: ajoelha * .5, rim: RIMC, rimK: [1, -.4] }));
  if (sobe > 0) { const id = nid('ag'); s += lay(1, `<path d="M${f1(xx + 120)} ${f1(1300 - 600)} Q${f1(xx + 60 - sobe * 80)} ${f1(1300 - 500 + 200 * (1 - sobe))} ${f1(xx - 60 + 40 * (1 - sobe))} ${f1(1300 - 120 - 380 * sobe * .8)} Q${f1(xx - 120)} ${f1(1300 - 60)} ${f1(xx + 20)} 1300 Q${f1(xx + 200)} 1300 ${f1(xx + 220)} ${f1(1300 - 380)}Z" fill="#7AC4F0" opacity="${op(.55 * sobe)}" stroke="#E8F8FF" stroke-width="4"/>`); }
  for (let i = 0; i < 6; i++) { const q = (t * 1.3 + i / 6) % 1; if (sobe > .2) s += lay(1, `<circle cx="${f1(xx - 40 + i * 24)}" cy="${f1(1240 - q * 360 * sobe)}" r="${f1(5 + (i % 3) * 3)}" fill="#E8F8FF" opacity="${op((1 - q) * .8)}"/>`); }
  return s + VIG(.8) + GRAINV(t);
}
// 6. frio e fome: na balança de cozinha (0,1 g)
function sBalanca(t) {
  TT = t; const { L, d, k } = loc(t, 'balanca'), [jx, jy] = hand2(t);
  const visor = easeInOut(range(L, .6, 2.0)) * (1 - easeInOut(range(L, 3.2, 4.4)));
  setCam(lerp(540, 500, visor) + jx, lerp(1000, 1250, visor) + jy, lerp(1.0, 1.55, visor), 0, [540, 1000, 1]);
  let s = `<rect width="1080" height="1920" fill="#B8CCE0"/>`;
  s += lay(.2, blur(14, `<rect x="-800" y="-800" width="2700" height="1900" fill="#C8D8E8"/><rect x="-200" y="200" width="300" height="420" rx="30" fill="#E8C060"/><rect x="200" y="140" width="220" height="480" rx="20" fill="#F0F4F8"/><circle cx="800" cy="320" r="200" fill="#F4F0E0"/><rect x="-800" y="620" width="2700" height="60" fill="#8A9AAA"/>`));
  s += lay(.6, `<rect x="-800" y="680" width="2700" height="1700" fill="#DDE4EA"/>${Array.from({ length: 8 }, (_, i) => `<rect x="-800" y="${680 + i * 160}" width="2700" height="4" fill="#C4CCD4"/>`).join('')}`);
  s += lay(1, balanca(540, 1080, .62, '0,1 g', t));
  const tr = Math.sin(t * 34) * 3;
  s += lay(1, eu({ x: 520 + tr, y: 1080, s: .42, armF: [-95 + Math.sin(t * 30) * 4, 140], armB: [95, -140], rim: RIMC, rimK: [1, -.4] }));
  s += lay(1, bafo(565, 640, t, 1));
  for (let i = 0; i < 4; i++) { const q = (t * .5 + i / 4) % 1; s += lay(1, `<text x="${f1(640 + i * 30)}" y="${f1(880 - q * 120)}" font-size="${f1(28 + q * 10)}" fill="#6A7A9A" opacity="${op((1 - q) * .7 * range(L, 3.4, 4.0))}">~</text>`); }   // ronco da barriga
  return s + VIG(.75) + GRAINV(t);
}
// 7. a migalha: o banquete da sua vida
function sMigalha(t) {
  TT = t; const { L, d, k } = loc(t, 'migalha'), [jx, jy] = hand2(t);
  setCam(lerp(460, 640, k) + jx, 1060 + jy, lerp(1.05, 1.12, k), 0, [540, 1060, 1]);
  let s = `<rect width="1080" height="1920" fill="#E8C898"/>`;
  s += lay(.2, blur(14, `<rect x="-800" y="-800" width="2700" height="1900" fill="#F0D8B0"/><rect x="-600" y="100" width="1400" height="700" fill="#A8744A"/><rect x="-560" y="140" width="640" height="620" fill="#B8845A"/><rect x="120" y="140" width="640" height="620" fill="#B8845A"/><circle cx="60" cy="460" r="22" fill="#E8C060"/><circle cx="180" cy="460" r="22" fill="#E8C060"/>`));
  s += lay(.7, assoalho(860, t, -L * 60));
  // formiga passando ao fundo
  const fx = lerp(1300, -200, range(L, .5, 4.2));
  s += lay(.7, `<g transform="translate(${f1(fx)},940) scale(-.9,.9)"><ellipse cx="-60" cy="-30" rx="44" ry="30" fill="#2A1A14"/><ellipse cx="10" cy="-34" rx="24" ry="20" fill="#2A1A14"/><circle cx="60" cy="-44" r="24" fill="#2A1A14"/>${[-40, 0, 30].map((x, i) => `<path d="M${x} -26 l${-20 + 40 * Math.sin(t * 16 + i)} 34 M${x} -26 l${20 - 40 * Math.sin(t * 16 + i)} 34" stroke="#2A1A14" stroke-width="6"/>`).join('')}<path d="M70 -62 q30 -40 50 -30" stroke="#2A1A14" stroke-width="5" fill="none"/></g>`);
  const mx = lerp(380, 820, easeInOut(range(L, .2, d))), giro = mx * .5;
  s += lay(1, `<ellipse cx="${f1(mx)}" cy="1338" rx="260" ry="34" fill="#000" opacity=".25" filter="url(#b12)"/>` + migalha(mx, 1150, 200, giro));
  s += lay(1, eu({ x: mx - 250, y: 1340, s: .42, ph: L * 7, walk: .8, lean: 22, armF: [-80, -20], armB: [-70, -30] }));
  for (let i = 0; i < 6; i++) { const q = (t * 1.2 + i / 6) % 1; s += lay(1, `<circle cx="${f1(mx - 160 - q * 260)}" cy="${f1(1320 - Math.sin(q * Math.PI) * 60)}" r="${4 + i % 3}" fill="#E8B866" opacity="${op(1 - q)}"/>`); }
  return s + VIG(.7) + GRAINV(t);
}
// 8. o ronronado: a sombra cobre você, você vira... e o gato de novo (emenda no gancho)
function sRonrono(t) {
  TT = t; const { L, d, k } = loc(t, 'ronrono'), [jx, jy] = hand2(t);
  if (L < 3.2) {
    const sombra = easeIn(range(L, .2, 2.4)), vira = range(L, 2.2, 2.6);
    setCam(540 + jx, 1060 + jy, lerp(1.1, 1.3, easeInOut(L / 3.2)), 0, [540, 1060, 1]);
    let s = `<rect width="1080" height="1920" fill="#E8C898"/>`;
    s += lay(.2, blur(14, `<rect x="-800" y="-800" width="2700" height="1900" fill="#F0D8B0"/><rect x="-600" y="100" width="1400" height="700" fill="#A8744A"/>`));
    s += lay(.7, assoalho(860, t));
    s += lay(1, migalha(700, 1210, 130, 30));
    s += lay(1, eu({ x: 520, y: 1340, s: .5, flip: vira > .5 ? -1 : 1, sit: lerp(.5, 0, vira), armF: vira > .5 ? [-150, -25] : [-70, -60], armB: vira > .5 ? [150, 25] : [-40, -80] }));
    s += `<rect width="1080" height="1920" fill="#1A1424" opacity="${op(sombra * .55)}"/>`;
    s += lay(.9, `<ellipse cx="${f1(lerp(1400, 700, sombra))}" cy="1250" rx="${f1(500 + 300 * sombra)}" ry="${f1(260 + 120 * sombra)}" fill="#0A0810" opacity="${op(sombra * .5)}" filter="url(#b30)"/>`);
    return s + VIG(1) + GRAINV(t);
  }
  const L2 = L - 3.2;
  return cenaGato(t, L2 + 2, lerp(.3, .62, easeInOut(range(L2, .2, 1.6))), easeInOut(range(L2, 0, d - 3.2)) * .2) + VIG(.7) + GRAINV(t);
}
const FN = { olho: sOlho, pata: sPata, pulo: sPulo, queda: sQueda, gota: sGota, balanca: sBalanca, migalha: sMigalha, ronrono: sRonrono };
