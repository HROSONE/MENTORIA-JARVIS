<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Pegada na Lua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00E5FF; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #s{display:block;transform-origin:50% 50%}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #count{position:absolute;left:0;right:0;top:150px;text-align:center;color:#fff;font:900 160px 'Montserrat',sans-serif;opacity:0;text-shadow:0 10px 40px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.8);line-height:1}
  #count small{display:block;font-size:44px;letter-spacing:.2em;color:var(--accent);margin-top:14px}
  .ov{position:absolute;left:40px;right:40px;top:var(--y);text-align:center;color:#fff;font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1.02;
    opacity:0;transform:translateY(40px) scale(.9);transition:opacity .2s ease, transform .35s cubic-bezier(.2,.9,.3,1.4);
    text-shadow:0 10px 40px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.8);pointer-events:none}
  .ov.on{opacity:1;transform:none}
  .a{color:var(--accent)}
  .btn{display:inline-block;border:10px solid var(--accent);border-radius:999px;padding:.28em .75em;background:rgba(0,0,0,.5);box-shadow:0 0 60px rgba(0,229,255,.35)}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font:800 54px 'Montserrat',sans-serif;background:rgba(0,0,0,.55);cursor:pointer;gap:30px;text-align:center}
  #start small{font-size:30px;opacity:.6}
  #start.hide{display:none}
</style>
</head>
<body>
<div id="stage">
  <svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs0">
      <linearGradient id="eshade" x1="0" y1="0" x2="1" y2="1"><stop offset=".45" stop-color="#000014" stop-opacity="0"/><stop offset=".8" stop-color="#000014" stop-opacity=".7"/></linearGradient>
      <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4B4BF"/><stop offset="1" stop-color="#5E5E6A"/></linearGradient>
      <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2D6E"/><stop offset=".6" stop-color="#C2577A"/><stop offset="1" stop-color="#FFB27A"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6FB8"/><stop offset="1" stop-color="#4FB3E8"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <clipPath id="hc"><circle r="150"/></clipPath>
      <clipPath id="pc"><path d="M0 -260 C90 -260 115 -170 112 -90 C108 0 90 60 85 120 C80 200 60 260 0 262 C-60 260 -80 200 -85 120 C-90 60 -108 0 -112 -90 C-115 -170 -90 -260 0 -260Z"/></clipPath>
      <clipPath id="topHalf"><rect width="1080" height="955"/></clipPath>
      <clipPath id="botHalf"><rect y="965" width="1080" height="955"/></clipPath>
      <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <g id="cam"></g>
  </svg>
  <div id="count"></div>
  <div id="flash"></div>
  <div id="texts"></div>
  <div id="start">▶ CLIQUE ou ESPAÇO<small>com som · ESPAÇO pausa · R reinicia</small></div>
</div>
<!--AUDIO-->
<script>
/* ======== LINHA DO TEMPO (segundos) — a mesma do áudio ======== */
const EV = {
  hop: 0, stomp: 2.5, top: 3.0, lift: 3.4, line: 5.0, num: 6.2, numEnd: 8.4,
  walk: 9.0, launch: 10.4, fly: 11.6, home: 13.0, door: 14.2, back: 15.0,
  tl: 17.0, age: 21.5, go: 24.5, land: 26.0, look: 27.3, find: 28.0, trace: 29.2, touch: 30.5,
  face: 32.0, why: 33.0, split: 34.2, wave: 35.0, mil: 37.5, outro: 41.0, end: 44.5,
};
const TEXTS = [
  { from: 28.4, to: 31.9, y: 170, fs: 120, html: 'A MESMA<br><span class="a">PEGADA</span>' },
  { from: 33.0, to: 34.2, y: 820, fs: 170, html: 'POR QUÊ<span class="a">?</span>' },
  { from: 38.6, to: 40.9, y: 1500, fs: 92, html: 'PODE DURAR<br><span class="a">MILHÕES DE ANOS</span>' },
  { from: 41.6, to: 44.5, y: 1560, fs: 110, html: '<span class="btn">SE INSCREVE</span>' },
];
const TOTAL = EV.end;

/* ---------------- utilidades ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const pulse = (t, a, b, f = .25) => Math.min(range(t, a, a + f), 1 - range(t, b - f, b));
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); };
const f1 = x => Math.round(x * 10) / 10;

const STARS = Array.from({ length: 170 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: .8 + rnd() * 2.4, p: rnd() * 6 }));
const SPECKS = Array.from({ length: 520 }, () => ({ x: rnd() * 1180 - 50, y: rnd() * 2020 - 50, r: 2 + rnd() * 9, c: ['#7E7E89', '#9C9CA7', '#85858F', '#A6A6B0', '#777782'][Math.floor(rnd() * 5)] }));
const CRATERS = Array.from({ length: 9 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 30 + rnd() * 70 }));
const DUST = Array.from({ length: 46 }, () => ({ a: rnd() * Math.PI * 2, s: 150 + rnd() * 330, r: 4 + rnd() * 10, up: 80 + rnd() * 260 }));

/* ---------------- fundos ---------------- */
function stars(t, k = 1) { return STARS.map(s => `<circle cx="${f1(s.x)}" cy="${f1(s.y)}" r="${s.r}" fill="#fff" opacity="${f1((.5 + .5 * Math.sin(t * 2 + s.p)) * k * 10) / 10}"/>`).join(''); }
function streaks(k) { return k <= 0 ? '' : STARS.slice(0, 80).map(s => `<line x1="${f1(s.x)}" y1="${f1(s.y)}" x2="${f1(s.x)}" y2="${f1(s.y + 160 * k)}" stroke="#fff" stroke-width="${s.r}" opacity=".5" stroke-linecap="round"/>`).join(''); }
let uid = 0;
function earth(cx, cy, r) {
  const id = 'ec' + (uid++);
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
  <circle cx="${cx}" cy="${cy}" r="${r * 1.1}" fill="#5EB8FF" opacity=".16"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#2E7FD9"/>
  <g clip-path="url(#${id})"><g transform="translate(${cx},${cy}) scale(${r / 100})">
    <path d="M-60 -50 C-30 -80 10 -70 20 -40 C30 -10 0 0 -10 20 C-20 40 -50 30 -60 0 C-70 -20 -75 -35 -60 -50Z" fill="#4CAF6A"/>
    <path d="M30 10 C50 0 80 10 85 35 C88 60 60 80 40 70 C25 60 20 30 30 10Z" fill="#4CAF6A"/>
    <path d="M-20 60 C0 50 15 70 5 90 C-10 95 -30 80 -20 60Z" fill="#5DBB77"/>
    <ellipse cx="-20" cy="-82" rx="50" ry="10" fill="#fff" opacity=".85"/><ellipse cx="50" cy="-20" rx="35" ry="8" fill="#fff" opacity=".8"/><ellipse cx="-50" cy="50" rx="40" ry="9" fill="#fff" opacity=".8"/>
    <circle r="100" fill="url(#eshade)"/>
  </g></g>`;
}
function moonGlobe(cx, cy, r, mark = 0) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r * 1.06}" fill="#fff" opacity=".07"/><g transform="translate(${cx},${cy}) scale(${r / 100})">
    <circle r="100" fill="#CFCFD8"/>
    <circle cx="-35" cy="-30" r="22" fill="#B3B3BE"/><circle cx="30" cy="20" r="15" fill="#B3B3BE"/><circle cx="-10" cy="45" r="11" fill="#B8B8C3"/><circle cx="45" cy="-45" r="9" fill="#B8B8C3"/><circle cx="-60" cy="30" r="8" fill="#B8B8C3"/>
    <circle r="100" fill="url(#eshade)"/>`;
  if (mark > 0) s += `<circle cx="10" cy="-5" r="${14 + 4 * Math.sin(mark * 9)}" fill="url(#glow)" opacity="${clamp(mark)}"/><circle cx="10" cy="-5" r="3" fill="#00E5FF" opacity="${clamp(mark)}"/>`;
  return s + '</g>';
}
function moonGround() {
  return `<path d="M-600 1420 Q-300 1380 0 1400 Q270 1350 540 1385 T1080 1370 Q1400 1360 1680 1400 V2700 H-600Z" fill="url(#mg)"/>
  <ellipse cx="180" cy="1560" rx="120" ry="26" fill="#8A8A96"/><ellipse cx="180" cy="1556" rx="100" ry="18" fill="#73737F"/>
  <ellipse cx="900" cy="1720" rx="150" ry="32" fill="#7C7C88"/><ellipse cx="900" cy="1715" rx="126" ry="22" fill="#5F5F6B"/>
  <ellipse cx="620" cy="1460" rx="60" ry="12" fill="#8F8F9B"/><ellipse cx="620" cy="1458" rx="48" ry="8" fill="#7A7A86"/>
  <ellipse cx="420" cy="1830" rx="90" ry="20" fill="#5A5A66"/>`;
}
function moonSide(t) { return `<rect x="-600" y="-600" width="2280" height="3200" fill="#04050C"/>` + stars(t) + earth(810, 380, 115) + moonGround(); }

/* ---------------- o garoto (cabeça) ---------------- */
function headInner(ex = 'feliz', old = 0, look = [3, 4]) {
  const SKIN = '#F4C39C', SKIN_D = '#E2A27C';
  const HAIR = mix('#3B2416', '#E2E2E2', old), HAIR_L = mix('#5C3A24', '#FFFFFF', old), BROW = mix('#3B2416', '#C4C4C4', old);
  const big = ex === 'susto' ? 1.3 : 1;
  const browY = ex === 'susto' ? -22 : ex === 'emocao' ? -8 : 0;
  const eye = x => `<g transform="translate(${x},4) scale(${big})"><ellipse rx="26" ry="32" fill="#fff"/><circle cx="${look[0]}" cy="${look[1]}" r="${ex === 'susto' ? 11 : 16}" fill="#2B1A10"/><circle cx="${look[0] + 6}" cy="${look[1] - 10}" r="5.5" fill="#fff"/>${ex === 'emocao' ? `<circle cx="${look[0] - 7}" cy="${look[1] + 6}" r="3.5" fill="#fff"/>` : ''}</g>`;
  const mouth = ex === 'susto' ? `<ellipse cx="0" cy="98" rx="24" ry="32" fill="#5A1E1E"/><ellipse cx="0" cy="116" rx="14" ry="9" fill="#E06C6C"/>`
    : ex === 'serio' ? `<path d="M-26 96 Q0 100 26 96" stroke="#7A2E2A" stroke-width="9" fill="none" stroke-linecap="round"/>`
    : `<path d="M-38 84 Q0 122 38 84 Q0 104 -38 84Z" fill="#7A2E2A" stroke="#7A2E2A" stroke-width="6" stroke-linejoin="round"/><path d="M-26 92 Q0 100 26 92" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  const wr = old > .3 ? `<g opacity="${f1(range(old, .3, 1))}" stroke="${SKIN_D}" stroke-width="5" fill="none" stroke-linecap="round"><path d="M-50 -88 Q0 -98 50 -88"/><path d="M-40 -72 Q0 -80 40 -72"/><path d="M-92 20 Q-86 32 -92 44"/><path d="M92 20 Q86 32 92 44"/></g>` : '';
  const stache = old > .45 ? `<path d="M-48 78 Q-24 56 0 70 Q24 56 48 78 Q24 74 0 82 Q-24 74 -48 78Z" fill="${HAIR}" opacity="${f1(range(old, .45, .8))}"/>` : '';
  const tear = ex === 'emocao' ? `<path d="M-62 40 Q-56 56 -62 62 Q-68 56 -62 40Z" fill="#9AD8FF"/>` : '';
  return `<circle cx="-120" cy="12" r="28" fill="${SKIN}"/><circle cx="120" cy="12" r="28" fill="${SKIN}"/>
    <circle cx="-120" cy="12" r="13" fill="${SKIN_D}"/><circle cx="120" cy="12" r="13" fill="${SKIN_D}"/>
    <ellipse rx="122" ry="138" fill="${SKIN}"/>
    <path d="M60 -120 Q140 -20 70 120 Q110 130 100 60 Q130 -20 60 -120Z" fill="${SKIN_D}" opacity=".35"/>
    <path d="M-126 -6 C-134 -120 -64 -168 0 -162 C72 -168 134 -110 126 -6 C116 -52 96 -78 62 -86 C20 -94 -40 -88 -80 -72 C-106 -60 -118 -40 -126 -6Z" fill="${HAIR}"/>
    <path d="M-84 -104 C-96 -214 44 -262 140 -196 C104 -190 88 -176 82 -150 C48 -176 -22 -160 -84 -104Z" fill="${HAIR}"/>
    <path d="M-40 -150 C-10 -200 60 -215 110 -195" stroke="${HAIR_L}" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-118 -30 L-112 30 L-100 -20Z" fill="${HAIR}"/><path d="M118 -30 L112 30 L100 -20Z" fill="${HAIR}"/>
    ${wr}${eye(-48)}${eye(48)}
    <path d="M-78 ${-46 + browY} Q-50 ${-62 + browY} -22 ${-50 + browY}" stroke="${BROW}" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M78 ${-46 + browY} Q50 ${-62 + browY} 22 ${-50 + browY}" stroke="${BROW}" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M-2 26 Q12 50 -6 58" stroke="${SKIN_D}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-80" cy="60" r="21" fill="#FF8A80" opacity=".35"/><circle cx="80" cy="60" r="21" fill="#FF8A80" opacity=".35"/>
    ${mouth}${stache}${tear}`;
}

/* ---------------- o astronauta (vista de frente; origem nos pés) ---------------- */
const SUIT = '#F4F6FA', SUIT_D = '#D3D8E1', GLOVE = '#AEB5C2';
function limb(x, y, s, a1, a2, l1, l2, w, end) {
  return `<g transform="translate(${x},${y}) rotate(${a1 * s})">
    <line y2="${l1}" stroke="${SUIT_D}" stroke-width="${w + 12}" stroke-linecap="round"/><line y2="${l1}" stroke="${SUIT}" stroke-width="${w}" stroke-linecap="round"/>
    <g transform="translate(0,${l1}) rotate(${a2 * s})"><line y2="${l2}" stroke="${SUIT_D}" stroke-width="${w + 10}" stroke-linecap="round"/><line y2="${l2}" stroke="${SUIT}" stroke-width="${w - 2}" stroke-linecap="round"/>${end(l2)}</g>
  </g>`;
}
function helmet(ex, old, look) {
  return `<circle r="178" fill="#DADFE8"/><circle r="178" fill="none" stroke="#B9C0CC" stroke-width="8"/>
    <circle r="152" fill="#BFE0FF"/>
    <g clip-path="url(#hc)"><g transform="translate(0,34) scale(.78)">${headInner(ex, old, look)}</g></g>
    <circle r="152" fill="#9fd0ff" opacity=".14"/>
    <path d="M-112 -64 A128 128 0 0 1 10 -138" stroke="#fff" stroke-width="16" opacity=".65" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="-74" r="10" fill="#fff" opacity=".6"/>`;
}
function astro(x, y, sc, p = {}) {
  const { aL = [20, -10], aR = [20, -10], lL = [4, 0], lR = [4, 0], ex = 'feliz', old = 0, look = [3, 4], tilt = 0, flip = 1 } = p;
  const boot = l => `<rect x="-60" y="${l - 24}" width="120" height="66" rx="26" fill="#9AA1AE"/><rect x="-60" y="${l + 26}" width="120" height="16" rx="8" fill="#6F7682"/>`;
  const glove = l => `<circle cy="${l + 12}" r="40" fill="${GLOVE}"/><rect x="-36" y="${l - 30}" width="72" height="22" rx="10" fill="#D7263D"/>`;
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${tilt}) scale(${sc * flip},${sc})">
    <ellipse cx="0" cy="40" rx="200" ry="34" fill="#000" opacity=".25"/>
    <rect x="-150" y="-660" width="300" height="300" rx="50" fill="#C9CED8"/><rect x="-150" y="-660" width="300" height="300" rx="50" fill="none" stroke="#AEB5C2" stroke-width="8"/>
    ${limb(-56, -330, 1, ...lL, 150, 140, 92, boot)}${limb(56, -330, -1, ...lR, 150, 140, 92, boot)}
    <rect x="-132" y="-650" width="264" height="350" rx="96" fill="${SUIT}"/>
    <path d="M60 -640 Q132 -620 132 -520 L132 -400 Q132 -300 60 -300 Q100 -470 60 -640Z" fill="${SUIT_D}" opacity=".7"/>
    <rect x="-64" y="-560" width="128" height="86" rx="16" fill="#C9CED8"/>
    <circle cx="-34" cy="-530" r="12" fill="#D7263D"/><circle cx="0" cy="-530" r="12" fill="#2F5DA8"/><circle cx="34" cy="-530" r="12" fill="#F5C021"/>
    <rect x="-44" y="-502" width="88" height="14" rx="7" fill="#9AA1AE"/>
    <rect x="-132" y="-340" width="264" height="36" rx="18" fill="#D7263D"/>
    ${limb(-124, -600, 1, ...aL, 140, 130, 76, glove)}${limb(124, -600, -1, ...aR, 140, 130, 76, glove)}
    <g transform="translate(0,-800)">${helmet(ex, old, look)}</g>
  </g>`;
}

/* ---------------- o garoto de camisa vermelha (Terra) ---------------- */
function boy(x, y, sc, p = {}) {
  const { aL = [8, -10], aR = [8, -10], ex = 'feliz', old = 0, sw = 0 } = p;
  const SKIN = '#F4C39C', SKIN_D = '#E2A27C', SHIRT = '#D7263D', SHIRT_D = '#A9182C', JEAN = '#2F5DA8', JEAN_D = '#22467F';
  const arm = (ax, s, a1, a2) => `<g transform="translate(${ax},-608) rotate(${a1 * s})"><line y2="140" stroke="${SHIRT_D}" stroke-width="72" stroke-linecap="round"/><line y2="140" stroke="${SHIRT}" stroke-width="60" stroke-linecap="round"/>
      <g transform="translate(0,140) rotate(${a2 * s})"><line y2="128" stroke="${SKIN}" stroke-width="44" stroke-linecap="round"/><circle cy="142" r="34" fill="${SKIN}"/></g></g>`;
  const leg = (lx, s, a, col) => `<g transform="translate(${lx},-390) rotate(${a})"><path d="M0 0 L${-14 * s} 340" stroke="${col}" stroke-width="76" stroke-linecap="round"/>
      <path d="M${-14 * s - 62} 372 Q${-14 * s - 62} 328 ${-14 * s - 12} 328 Q${-14 * s + 34} 328 ${-14 * s + 34} 372Z" fill="#2A2A35"/><rect x="${-14 * s - 66}" y="368" width="104" height="18" rx="9" fill="#fff"/></g>`;
  return `<g transform="translate(${f1(x)},${f1(y)}) scale(${sc})">
    <ellipse cx="0" cy="6" rx="190" ry="34" fill="#000" opacity=".18"/>
    ${leg(-48, 1, sw, JEAN)}${leg(48, -1, -sw, JEAN_D)}
    <rect x="-98" y="-420" width="196" height="70" rx="30" fill="${JEAN}"/>
    <rect x="-30" y="-700" width="60" height="90" rx="22" fill="${SKIN_D}"/>
    <path d="M-104 -600 Q-104 -650 -54 -650 L54 -650 Q104 -650 104 -600 L100 -380 Q100 -356 76 -356 L-76 -356 Q-100 -356 -100 -380Z" fill="${SHIRT}"/>
    <path d="M40 -650 L54 -650 Q104 -650 104 -600 L100 -380 Q100 -356 76 -356 L60 -356 Q86 -500 40 -650Z" fill="${SHIRT_D}"/>
    <path d="M-38 -650 L0 -600 L38 -650Z" fill="${SKIN_D}"/>
    ${arm(-96, 1, ...aL)}${arm(96, -1, ...aR)}
    <g transform="translate(0,-812)">${headInner(ex, old)}</g>
  </g>`;
}

/* ---------------- módulo lunar + cápsula ---------------- */
function lander(x, y, sc, up = 0, flame = 0) {
  const asc = `<g transform="translate(0,${f1(-up)})">
    ${flame > 0 ? `<path d="M-40 -250 Q0 ${f1(-250 + 260 * flame)} 40 -250Z" fill="#FFB347"/><path d="M-22 -250 Q0 ${f1(-250 + 170 * flame)} 22 -250Z" fill="#FFF2B0"/>` : ''}
    <path d="M-120 -260 L-100 -400 L-20 -440 L90 -420 L125 -330 L120 -260Z" fill="#C7CBD3"/><path d="M40 -430 L90 -420 L125 -330 L120 -260 L60 -260Z" fill="#AAB0BB"/>
    <path d="M-80 -380 L-30 -400 L-30 -350 L-80 -340Z" fill="#1E2A3C"/><rect x="-10" y="-330" width="60" height="64" rx="8" fill="#9AA1AE"/>
    <line x1="60" y1="-430" x2="80" y2="-500" stroke="#9AA1AE" stroke-width="6"/><circle cx="80" cy="-505" r="14" fill="#E9ECF2"/></g>`;
  return `<g transform="translate(${f1(x)},${f1(y)}) scale(${sc})">
    <ellipse cx="0" cy="10" rx="260" ry="30" fill="#000" opacity=".25"/>
    <line x1="-120" y1="-150" x2="-230" y2="-10" stroke="#B9B9C3" stroke-width="14"/><line x1="120" y1="-150" x2="230" y2="-10" stroke="#B9B9C3" stroke-width="14"/>
    <ellipse cx="-230" cy="-6" rx="40" ry="12" fill="#B9B9C3"/><ellipse cx="230" cy="-6" rx="40" ry="12" fill="#B9B9C3"/>
    <path d="M-150 -260 L150 -260 L160 -120 L-160 -120Z" fill="#E3B341"/><path d="M60 -260 L150 -260 L160 -120 L70 -120Z" fill="#C8952C"/>
    <path d="M-120 -230 L-60 -170 M-30 -250 L10 -140 M90 -240 L120 -150" stroke="#F6D57A" stroke-width="6"/>
    <path d="M-40 -120 L40 -120 L60 -60 L-60 -60Z" fill="#7C828D"/>
    ${asc}</g>`;
}
function capsule(x, y, ang, sc, flame = 1, t = 0) {
  const fl = flame * (1 + .2 * Math.sin(t * 50));
  return `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(ang)}) scale(${sc})">
    <path d="M-26 62 Q0 ${f1(62 + 120 * fl)} 26 62Z" fill="#FFB347"/><path d="M-14 62 Q0 ${f1(62 + 70 * fl)} 14 62Z" fill="#FFF2B0"/>

  // ===== 14. Terra x Lua
  else if (t < EV.mil) {
    const wv = range(t, EV.wave, EV.wave + 1.4), front = 120 + 620 * Math.sin(Math.PI * wv), gone = smooth(range(t, EV.wave + .5, EV.wave + .9));
    let top = `<rect width="1080" height="960" fill="#EBCB8B"/>` + SPECKS.slice(0, 160).map(p => `<circle cx="${f1(p.x)}" cy="${f1(p.y * .5)}" r="${f1(p.r * .6)}" fill="#D9B676"/>`).join('');
    if (wv > .5) top += `<rect y="0" width="1080" height="${f1(front + 80)}" fill="#C9A066" opacity=".5"/>`;
    top += footprint(540, 600, .7, [-.7, -.7], SANDPAL, 1 - gone);
    top += `<path d="M0 0 H1080 V${f1(front)} ${Array.from({ length: 9 }, (_, i) => `Q${1080 - i * 120 - 60} ${f1(front + 40 * Math.sin(t * 6 + i))} ${1080 - (i + 1) * 120} ${f1(front)}`).join(' ')} Z" fill="url(#sea)"/>
      <path d="M0 ${f1(front)} ${Array.from({ length: 9 }, (_, i) => `Q${i * 120 + 60} ${f1(front + 40 * Math.sin(t * 6 + 9 - i))} ${(i + 1) * 120} ${f1(front)}`).join(' ')}" stroke="#fff" stroke-width="18" fill="none" opacity=".85"/>`;
    for (let i = 0; i < 14; i++) { const x = ((t * 900 + i * 210) % 1400) - 200, y = 200 + (i * 53) % 700; top += `<path d="M${f1(x)} ${y} q60 -20 120 0" stroke="#fff" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/>`; }
    top += `<rect y="0" width="1080" height="150" fill="#000" opacity=".0"/><text x="540" y="890" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="64" fill="#fff" stroke="#000" stroke-width="10" paint-order="stroke">TERRA: VENTO, CHUVA, ONDAS</text>`;
    let bot = `<g transform="translate(0,965)"><g transform="translate(0,-470)">${topView(t, {})}</g>
      <text x="540" y="880" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="64" fill="#fff" stroke="#000" stroke-width="10" paint-order="stroke">LUA: SEM AR. SEM VENTO.</text></g>`;
    const sk = easeOut(range(t, EV.split, EV.split + .4));
    s = `<rect width="1080" height="1920" fill="#000"/><g clip-path="url(#topHalf)" transform="translate(${f1(-1080 * (1 - sk))},0)">${top}</g><g clip-path="url(#botHalf)" transform="translate(${f1(1080 * (1 - sk))},0)">${bot}</g>
      <rect y="955" width="1080" height="10" fill="#00E5FF"/>`;
  }
  // ===== 15. milhões de anos
  else if (t < EV.outro) {
    const k = range(t, EV.mil, EV.outro - .3);
    const ph = (k * 40) * Math.PI * 2, night = clamp(.5 - .6 * Math.cos(ph), 0, .8) * .8;
    s = topView(t, { night, L: [Math.cos(ph * .5), Math.sin(ph * .5)].map(v => v * .9) });
    count = { n: k < .02 ? 50 : Math.pow(10, lerp(Math.log10(50), 6, easeInOut(range(k, 0, .75)))), lbl: 'ANOS DEPOIS' };
    z = lerp(1.05, 1, k);
  }
  // ===== 16. final
  else {
    const k = easeOut(range(t, EV.outro, EV.end));
    s = `<rect width="1080" height="1920" fill="#04050C"/>` + stars(t) + earth(lerp(820, 780, k), lerp(380, 520, k), lerp(110, 150, k)) + moonGlobe(540, lerp(1500, 1180, k), lerp(900, 330, k), 1 + t);
    if (t < EV.outro + .2) flash = .7 * (1 - range(t, EV.outro, EV.outro + .2));
  }
  // câmera
  const sx = shake ? Math.sin(t * 93) * shake : 0, sy = shake ? Math.cos(t * 71) * shake : 0;
  cam.setAttribute('transform', `translate(${540 + sx} ${960 + sy}) scale(${z}) translate(${-540 + cx} ${-960 + cy})`);
  cam.innerHTML = s;
  flashEl.style.opacity = flash;
  if (count) { countEl.style.opacity = 1; countEl.innerHTML = `+${fmt(count.n)}<small>${count.lbl}</small>`; } else countEl.style.opacity = 0;
  for (const x of TEXTS) {
    if (window.__render) { const kk = Math.min(range(t, x.from, x.from + .15), 1 - range(t, x.to - .2, x.to)), e = easeOut(kk); x.el.style.transition = 'none'; x.el.style.opacity = kk; x.el.style.transform = `translateY(${(1 - e) * 40}px) scale(${.9 + .1 * e})`; }
    else x.el.classList.toggle('on', t >= x.from && t < x.to);
  }
}

/* ---------------- controle + som ---------------- */
const W = 1080, H = 1920, params = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const audio = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null;
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); if (audio) { audio.currentTime = offset; audio.play(); } }
function pause() { offset = current(); playing = false; if (audio) audio.pause(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { pause(); offset = 0; play(); }
  if (e.code === 'ArrowRight') { const p = playing; pause(); offset = Math.min(TOTAL, offset + 3); if (p) play(); }
  if (e.code === 'ArrowLeft') { const p = playing; pause(); offset = Math.max(0, offset - 3); if (p) play(); }
});
window.__total = TOTAL;
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
