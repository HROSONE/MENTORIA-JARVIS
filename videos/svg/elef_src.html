  const { N = 16, L = 16, base = 92, curl = 0, w0 = 58, w1 = 18, t = 0, sway = 1, col } = o;

    s += `<g opacity="${op(range(t, EV.kenya + 5, EV.kenya + 5.5))}" transform="translate(${f1(CAM.x)},${f1(CAM.y + 40)})"><rect x="-420" y="-40" width="840" height="70" rx="16" fill="#000" opacity=".55"/>${txt(0, 8, 'CHINA PROIBIU A VENDA DE MARFIM EM 2017 · O PREÇO DESABOU', 26, '#fff', 'middle', 800)}</g>`;
    return scene(L, s);
  }
  if (t < EV.close) {
    const k = range(t, EV.todo, EV.close);
    let s = `<rect width="${W}" height="${H}" fill="#120E0A"/><g style="mix-blend-mode:screen"><ellipse cx="960" cy="560" rx="900" ry="420" fill="url(#spotG)" opacity=".5"/></g>`;
    const items = [['✕', 'NÃO MONTE EM ELEFANTES', '#FF6A6A'], ['✕', 'NÃO COMPRE NADA DE MARFIM', '#FF6A6A'], ['✓', 'PREFIRA TURISMO SÓ DE OBSERVAÇÃO', '#7DFFA8'], ['✓', 'APOIE SANTUÁRIOS E PROJETOS SÉRIOS', '#7DFFA8']];
    items.forEach(([ic, tx, col], i) => { const e = easeOut(range(t, EV.todo + .6 + i * 1.4, EV.todo + 1.1 + i * 1.4)); if (e <= 0) return; s += `<g transform="translate(${f1(420 - 80 * (1 - e))},${330 + i * 150})" opacity="${op(e)}"><circle r="46" fill="${col}" opacity=".2" stroke="${col}" stroke-width="5"/>${txt(0, 18, ic, 54, col)}${txt(90, 16, tx, 44, '#fff', 'start')}</g>`; });
    return zoomG(lerp(1.06, 1.0, easeOut(k)), s, 960, 560, lerp(-.8, .8, k));
  }
  const k = range(t, EV.close, EV.end);
  const L = savanna(t, 'sunset', { sun: [1500, 730] });
  setCam(lerp(800, 1200, k), lerp(760, 600, easeInOut(k)), lerp(1.3, .75, easeInOut(k)), lerp(1, 0, k), [800, 760, 1.3]);
  const R = eRig('sunset', { amb: '#5A3848', shO: .55, rims: [{ k: [1, -.2], c: '#FFB060', w: 14, o: 1, glow: 1 }] });
  let s = '';
  for (const [dx, dy, sc, kind] of HERD) s += elephant({ x: 1000 + dx + (t - EV.close) * 60, y: 920 + dy, sc: .55 * sc, calf: kind === 'c', rig: R, walk: 1, ph: walkPh(t, 1, dx * .01), t, headDip: kind === 'm' ? -4 * pulse(t, EV.close + 2, EV.close + 6, 1) : 0 });
  return scene(L, s);
}

/* ---------------- quadro ---------------- */
function frame(t) {
  D = []; uid = 0;
  let Wd = '', P = { t }, flash = 0, ch = '';
  if (t < EV.sp) { Wd = hookScene(t); P = { t, grade: '#FF9A5A', gradeO: .15 }; }
  else if (t < EV.fam) { Wd = speciesScene(t); ch = chapter(t, EV.sp, 1, 'QUEM SÃO ELES'); }
  else if (t < EV.mem) { Wd = familyScene(t); ch = chapter(t, EV.fam, 2, 'UMA FAMÍLIA DE MULHERES'); }
  else if (t < EV.com) { Wd = memoryScene(t); ch = chapter(t, EV.mem, 3, 'A MEMÓRIA'); P = { t, grade: '#FF9A5A', gradeO: .12 }; }
  else if (t < EV.mind) { Wd = commScene(t); ch = chapter(t, EV.com, 4, 'COMO ELES CONVERSAM'); }
  else if (t < EV.eng) { Wd = mindScene(t); ch = chapter(t, EV.mind, 5, 'A MENTE'); }
  else if (t < EV.poach) { Wd = engScene(t); ch = chapter(t, EV.eng, 6, 'JARDINEIROS DO PLANETA'); }
  else if (t < EV.zoo) { Wd = threatScene(t); ch = chapter(t, EV.poach, 7, 'AMEAÇAS NA NATUREZA'); }
  else if (t < EV.sanct) { Wd = captiveScene(t); ch = chapter(t, EV.zoo, 8, 'A VIDA EM CATIVEIRO'); P = { t, grade: '#5A7090', gradeO: .15 }; }
  else { Wd = hopeScene(t); ch = t < EV.close ? chapter(t, EV.sanct, 9, 'O QUE ESTÁ DANDO CERTO') : ''; if (t >= EV.close) P = { t, grade: '#FF9A5A', gradeO: .15 }; }
  // transição: flash suave em cada troca de capítulo
  for (const c of [EV.sp, EV.fam, EV.mem, EV.com, EV.mind, EV.eng, EV.poach, EV.zoo, EV.sanct, EV.close]) if (t >= c && t < c + .35) flash = Math.max(flash, .35 * (1 - (t - c) / .35));
  // câmera na mão: nunca parada
  const hx = 7 * noise1(t * .6, 1), hy = 5 * noise1(t * .5, 4), hr = .35 * noise1(t * .4, 7);
  const world = document.getElementById('world');
  world.setAttribute('transform', `translate(${CX + f1(hx)},${CY + f1(hy)}) rotate(${f1(hr)}) scale(1.02) translate(${-CX},${-CY})`);
  world.innerHTML = Wd;
  document.getElementById('post').innerHTML = post(P) + ch;
  document.getElementById('fdefs').innerHTML = D.join('');
  document.getElementById('flash').style.opacity = flash;
  for (const x of TEXTS) {
    if (window.__render) { const kk = Math.min(range(t, x.from, x.from + .2), 1 - range(t, x.to - .25, x.to)), e = easeOut(kk); x.el.style.transition = 'none'; x.el.style.opacity = kk; x.el.style.transform = `translateY(${(1 - e) * 24}px)`; }
    else x.el.classList.toggle('on', t >= x.from && t < x.to);
  }
}

/* ---------------- controle ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) { const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = x.html; el.style.setProperty('--y', x.y + 'px'); el.style.setProperty('--fs', x.fs + 'px'); textHost.appendChild(el); x.el = el; }
const params = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const audio = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null;
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); if (audio) { audio.currentTime = offset; audio.play(); } }
function pause() { offset = current(); playing = false; if (audio) audio.pause(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'ArrowRight') { const p = playing; pause(); offset = Math.min(TOTAL, offset + 5); if (p) play(); }
  if (e.code === 'ArrowLeft') { const p = playing; pause(); offset = Math.max(0, offset - 5); if (p) play(); }
});
window.__total = TOTAL;
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
