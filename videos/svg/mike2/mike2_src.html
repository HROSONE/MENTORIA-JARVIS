<script>
/*LIB*/

/* ======================= galinhas (vetorizadas das fotos) ======================= */
const G = window.GAL;
const W0 = 1080, H0 = 1920;
// detalhes da cabeça de lado, medidos na foto (olho, bico, face vermelha)
const HEADSIDE = `<path d="M446 266 Q420 266 402 291 Q424 289 447 287Z" fill="#E7C27A" stroke="#6b4a22" stroke-width="2.5" stroke-linejoin="round"/><path d="M404 289 Q424 283 446 279" stroke="#9a7438" stroke-width="2" fill="none"/>
  <path d="M440 276 Q456 272 474 284 Q470 298 452 300 Q440 292 440 276Z" fill="#D8343F" opacity=".85"/>
  <path d="M446 292 Q452 314 462 318 Q470 306 462 292Z" fill="#C42433" stroke="#4a1010" stroke-width="1.5"/>
  <ellipse cx="485" cy="260" rx="10.5" ry="9.5" fill="#B5762A" stroke="#3b220e" stroke-width="2.5"/><circle cx="484" cy="260" r="5.2" fill="#120a06"/><circle cx="487.5" cy="256.5" r="2.4" fill="#fff"/>
  <path d="M472 252 Q485 243 498 252" stroke="#c9b7a2" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
const HEADFRONT = `<circle cx="752" cy="215" r="6" fill="#120a06"/><circle cx="754" cy="213" r="2" fill="#fff"/>`;
const STUMP_S = `<ellipse cx="541" cy="250" rx="20" ry="8" fill="#8E3A33"/><ellipse cx="541" cy="249" rx="12" ry="4.5" fill="#B95A4D"/>`;
const STUMP_F = `<ellipse cx="866" cy="218" rx="20" ry="8" fill="#8E3A33"/><ellipse cx="866" cy="217" rx="12" ry="4.5" fill="#B95A4D"/>`;
const VAR = {   // variações de penas (filtro só nas penas; crista fica vermelha)
  branca: '', ruiva: 'fRuiva', preta: 'fPreta', dourada: 'fDourada', xray: 'fXray', noite: 'fNoite'
};
function chickenDefs() {
  let d = '';
  d += `<filter id="fRuiva" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".62 .38 .08 0 .02  .30 .26 .06 0 0  .12 .12 .04 0 0  0 0 0 1 0"/></filter>`;
  d += `<filter id="fPreta" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".28 .1 .04 0 .01  .22 .1 .04 0 .01  .2 .12 .06 0 .02  0 0 0 1 0"/></filter>`;
  d += `<filter id="fDourada" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".7 .35 .05 0 .03  .52 .3 .04 0 .01  .28 .16 .02 0 0  0 0 0 1 0"/></filter>`;
  d += `<filter id="fXray" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .85  0 0 0 0 1  0 0 0 .22 0"/></filter>`;
  d += `<filter id="fNoite" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".2 .2 .08 0 0  .2 .21 .09 0 0  .24 .25 .13 0 .02  0 0 0 1 0"/></filter>`;
  d += `<g id="LCf">${G.lado_c[0]}</g><g id="LCr">${G.lado_c[1]}${HEADSIDE}</g>`;
  d += `<g id="LSf">${G.lado_s[0]}</g><g id="LSr">${STUMP_S}</g>`;
  d += `<g id="FCf">${G.frente_c[0]}</g><g id="FCr">${G.frente_c[1]}${HEADFRONT}</g>`;
  d += `<g id="FSf">${G.frente_s[0]}</g><g id="FSr">${STUMP_F}</g>`;
  return d;
}
// perna de lado (galinha virada para a esquerda). Cor amarelada com escamas
function legSide(hx, hy, fx, fy, lift, col = '#E2B85A') {
  fy -= lift; const kx = (hx + fx) / 2 + 10, ky = (hy + fy) / 2 - 4, sk = '#5b3f1c';
  let o = `<path d="M${f1(hx)} ${f1(hy)}Q${f1(kx)} ${f1(ky)} ${f1(fx)} ${f1(fy)}" stroke="${sk}" stroke-width="17" fill="none" stroke-linecap="round"/><path d="M${f1(hx)} ${f1(hy)}Q${f1(kx)} ${f1(ky)} ${f1(fx)} ${f1(fy)}" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  for (let i = 2; i < 8; i++) { const k = i / 8, x = lerp(lerp(hx, kx, k), lerp(kx, fx, k), k), y = lerp(lerp(hy, ky, k), lerp(ky, fy, k), k); o += `<path d="M${f1(x - 5)} ${f1(y)}h10" stroke="${sk}" stroke-width="1.6" opacity=".5"/>`; }
  const toe = (dx, dy, w = 9) => `<path d="M${f1(fx)} ${f1(fy)}l${f1(dx)} ${f1(dy)}" stroke="${sk}" stroke-width="${w + 5}" stroke-linecap="round"/><path d="M${f1(fx)} ${f1(fy)}l${f1(dx)} ${f1(dy)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  const up = lift > 4 ? 1 : 0;
  return toe(18, -2, 7) + toe(-44, up ? 10 : 2) + toe(-34, up ? 16 : 7) + o;
}
function legFront(hx, hy, kx, ky, fx, fy, lift, col = '#E0C27A') {
  fy -= lift; ky -= lift * .5; const sk = '#5b3f1c';
  let o = `<path d="M${f1(hx - 13)} ${f1(hy)}Q${f1(kx - 16)} ${f1(ky)} ${f1(fx - 9)} ${f1(fy)}L${f1(fx + 9)} ${f1(fy)}Q${f1(kx + 16)} ${f1(ky)} ${f1(hx + 13)} ${f1(hy)}Z" fill="${col}" stroke="${sk}" stroke-width="3" stroke-linejoin="round"/>`;
  for (let i = 1; i < 8; i++) { const k = i / 8, x = lerp(kx, fx, k), y = lerp(ky, fy, k); o += `<path d="M${f1(x - 7)} ${f1(y)}q7 5 14 0" fill="none" stroke="${sk}" stroke-width="1.6" opacity=".5"/>`; }
  const toe = (dx, dy) => `<path d="M${f1(fx)} ${f1(fy)}l${f1(dx)} ${f1(dy)}" stroke="${sk}" stroke-width="14" stroke-linecap="round"/><path d="M${f1(fx)} ${f1(fy)}l${f1(dx)} ${f1(dy)}" stroke="${col}" stroke-width="9" stroke-linecap="round"/>`;
  return toe(-30, 18 - lift * .2) + toe(30, 18 - lift * .2) + toe(0, 28 - lift * .4) + o;
}
// galinha: tipo 'L' (lado) ou 'F' (frente); cab: true/false. Origem = ponto entre os pés no chão.
// o: {x,y,s,flip,v (variação),peck (0..1),ph (fase do passo),walk (0..1), sit (0..1), tilt, rig}
function chicken(o) {
  const P = Object.assign({ x: 0, y: 0, s: .5, flip: 1, v: 'branca', peck: 0, ph: 0, walk: 0, sit: 0, tilt: 0, cab: true, tipo: 'L', rig: '', shadow: .35, legCol: null }, o);
  const id = (P.tipo === 'L' ? 'L' : 'F') + (P.cab ? 'C' : 'S');
  const fil = VAR[P.v] ? ` filter="url(#${VAR[P.v]})"` : '';
  let body, legs, ox, oy, piv;
  const legCol = P.legCol || (P.v === 'xray' ? '#7FE9FF' : P.v === 'noite' ? '#5d6070' : '#E2B85A');
  if (P.tipo === 'L') {
    ox = 738; oy = 948; piv = [760, 760];
    const a = Math.sin(P.ph) * P.walk, lL = Math.max(0, a) * 26, lR = Math.max(0, -a) * 26;
    const sitY = P.sit * 112;
    legs = P.sit > .9 ? '' : `<g opacity="${op(1 - P.sit * 1.2)}">` + legSide(752, 818 + sitY * .6, 744 - a * 34, 948, lR, legCol) + legSide(730, 818 + sitY * .6, 724 + a * 34, 948, lL, mix(legCol, '#000000', .18)) + '</g>';
    const bob = Math.abs(Math.cos(P.ph)) * 8 * P.walk;
    body = `<g transform="translate(0,${f1(sitY - bob)}) rotate(${f1(-P.peck * 38 + P.tilt)} ${piv[0]} ${piv[1]})"><use href="#${id}f"${fil}/><use href="#${id}r"${P.v === 'xray' ? ' opacity=".35"' : P.v === 'noite' ? ' filter="url(#fNoite)"' : ''}/></g>`;
  } else {
    ox = 925; oy = 852; piv = [920, 560];
    const a = Math.sin(P.ph) * P.walk, lL = Math.max(0, a) * 30, lR = Math.max(0, -a) * 30;
    legs = legFront(880, 600, 884, 700, 890, 840, lL, legCol) + legFront(962, 615, 968, 725, 955, 846, lR, mix(legCol, '#000000', .12));
    const bob = Math.abs(Math.cos(P.ph)) * 7 * P.walk;
    body = `<g transform="translate(0,${f1(-bob)}) rotate(${f1(1.5 * a + P.tilt)} ${piv[0]} ${piv[1]}) translate(0,${f1(P.peck * 30)})"><use href="#${id}f"${fil}/><use href="#${id}r"${P.v === 'noite' ? ' filter="url(#fNoite)"' : ''}/></g>`;
  }
  const sh = P.shadow ? `<ellipse cx="0" cy="4" rx="${P.tipo === 'L' ? 300 : 190}" ry="34" fill="#000" opacity="${P.shadow}" filter="url(#b12)"/>` : '';
  return `<g transform="translate(${f1(P.x)},${f1(P.y)}) scale(${f1(P.s * P.flip * 1000) / 1000},${f1(P.s * 1000) / 1000})">${sh}<g transform="translate(${-ox},${-oy})"${P.rig ? ` filter="url(#${P.rig})"` : ''}>${legs}${body}</g></g>`;
}

/* ======================= cenário ======================= */
const R = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function skyCol(d) { // d: 0 noite, .25 amanhecer, .5 dia, .75 entardecer
  const K = [[0, '#0B1230', '#1C2550', '#2B2F55'], [.22, '#2A2B5E', '#C76A5A', '#F2B27A'], [.32, '#5E8FD0', '#F4C58E', '#FFE2B0'], [.5, '#4F8EDB', '#9CC8F0', '#DCEEFF'], [.68, '#5E7FC8', '#F0B07A', '#FFD49A'], [.78, '#3A2E66', '#D2665A', '#F7A066'], [.9, '#121836', '#2A2650', '#3A3058'], [1, '#0B1230', '#1C2550', '#2B2F55']];
  let i = 0; while (i < K.length - 2 && d > K[i + 1][0]) i++;
  const k = smooth((d - K[i][0]) / (K[i + 1][0] - K[i][0]));
  return [1, 2, 3].map(j => mix(K[i][j], K[i + 1][j], k));
}
const STARS2 = Array.from({ length: 140 }, () => ({ x: R() * 2400 - 600, y: R() * 1300 - 300, r: .7 + R() * 2, p: R() * 6 }));
function sky(d, t, o = {}) {
  const [a, b, c] = skyCol(d), id = nid('sk');
  def(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".62" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`);
  const night = clamp(1 - Math.min(Math.abs(d - .5) / .3, 1) * 0 - (1 - (d < .2 || d > .86 ? 1 : d < .27 ? 1 - (d - .2) / .07 : d > .8 ? (d - .8) / .06 : 0)));
  let s = `<rect x="-1500" y="-1500" width="5000" height="3200" fill="url(#${id})"/>`;
  const st = d < .25 ? 1 - range(d, .17, .25) : d > .8 ? range(d, .8, .9) : 0;
  if (st > 0) s += `<g opacity="${op(st)}">${STARS2.map(q => `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="${q.r}" fill="#fff" opacity="${op(.5 + .5 * Math.sin(t * 3 + q.p))}"/>`).join('')}</g>`;
  // sol / lua num arco
  const ang = (d - .25) * 2 * Math.PI, sx = 540 - Math.cos(ang) * 900, sy = 1500 - Math.sin(ang) * 1250;
  const mx = 540 - Math.cos(ang + Math.PI) * 900, my = 1500 - Math.sin(ang + Math.PI) * 1250;
  s += `<circle cx="${f1(sx)}" cy="${f1(sy)}" r="300" fill="url(#gSun)" opacity=".9"/><circle cx="${f1(sx)}" cy="${f1(sy)}" r="62" fill="#FFF4D6"/>`;
  s += `<circle cx="${f1(mx)}" cy="${f1(my)}" r="200" fill="url(#gMoon)" opacity=".7"/><circle cx="${f1(mx)}" cy="${f1(my)}" r="44" fill="#EEF2FF"/><circle cx="${f1(mx + 14)}" cy="${f1(my - 8)}" r="40" fill="${a}" opacity=".0"/>`;
  // nuvens
  const CL = [[-200, 300, 1.2], [500, 180, .9], [1100, 380, 1.4], [200, 560, .8]];
  const cc = mix(c, '#ffffff', .5), cs = mix(b, '#000000', .1);
  s += CL.map(([x, y, k], i) => { const xx = ((x + t * (14 + i * 6) + 600) % 2400) - 600; return `<g transform="translate(${f1(xx)},${y}) scale(${k})" opacity=".85"><ellipse cx="0" cy="0" rx="190" ry="44" fill="${cs}" opacity=".6"/><ellipse cx="-60" cy="-26" rx="100" ry="50" fill="${cc}"/><ellipse cx="50" cy="-34" rx="120" ry="62" fill="${cc}"/><ellipse cx="140" cy="-6" rx="90" ry="36" fill="${cc}"/></g>`; }).join('');
  return s;
}
// mesas do Colorado (Book Cliffs): camadas com topo plano
function mesas(d, y0 = 1180) {
  const [a, b, c] = skyCol(d), far = mix(b, '#8E6A7A', .45), mid = mix(mix(c, '#B0603C', .55), '#000000', .15), near = mix('#7A4A30', '#000000', .2 + .4 * (d < .22 || d > .82 ? 1 : 0));
  const lay3 = (col, yy, amp, seed) => { let p = `M-1600 ${yy + 300}`; let x = -1600; let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; let h = yy; while (x < 2700) { const w = 120 + r() * 260; const nh = yy - r() * amp; p += `L${f1(x + 30)} ${f1(nh)}L${f1(x + w - 30)} ${f1(nh)}L${f1(x + w)} ${f1(yy - r() * amp * .3)}`; x += w; } p += `L2700 ${yy + 300}Z`; return `<path d="${p}" fill="${col}"/>`; };
  return lay3(far, y0 - 60, 180, 3) + `<rect x="-1600" y="${y0 - 200}" width="4400" height="300" fill="${c}" opacity=".25"/>` + lay3(mid, y0, 120, 11);
}
function barn(x, y, s, lit = 1) {
  const wall = mix('#8E2B22', '#2a1414', 1 - lit), wallD = mix('#6E1E18', '#1a0c0c', 1 - lit), trim = mix('#EFE6D6', '#55505a', 1 - lit), roof = mix('#4A4A52', '#1c1c24', 1 - lit);
  let p = `<g transform="translate(${x},${y}) scale(${s})">`;
  p += `<path d="M-300 0 L-300 -330 L-200 -470 L0 -560 L200 -470 L300 -330 L300 0Z" fill="${wall}"/>`;
  for (let i = -280; i < 300; i += 26) p += `<line x1="${i}" y1="0" x2="${i}" y2="-560" stroke="${wallD}" stroke-width="3" opacity=".6"/>`;
  p += `<path d="M-300 0 L-300 -330 L-200 -470 L0 -560 L200 -470 L300 -330 L300 0Z" fill="none" stroke="${trim}" stroke-width="10" stroke-linejoin="round"/>`;
  p += `<path d="M-330 -320 L-210 -486 L0 -585 L210 -486 L330 -320" fill="none" stroke="${roof}" stroke-width="34" stroke-linejoin="round"/>`;
  p += `<rect x="-120" y="-280" width="240" height="280" fill="${wallD}" stroke="${trim}" stroke-width="10"/><path d="M-120 -280 L120 0 M120 -280 L-120 0 M0 -280 L0 0" stroke="${trim}" stroke-width="9"/>`;
  p += `<rect x="-50" y="-450" width="100" height="90" fill="#2A1A10" stroke="${trim}" stroke-width="8"/><path d="M-50 -405 H50 M0 -450 V-360" stroke="${trim}" stroke-width="6"/>`;
  p += `<path d="M-300 0 L-300 -330 L-200 -470 L-200 0Z" fill="#000" opacity=".18"/>`;
  return p + '</g>';
}
function windmill(x, y, s, t, lit = 1) {
  const c = mix('#5A5048', '#15151c', 1 - lit);
  let p = `<g transform="translate(${x},${y}) scale(${s})" stroke="${c}" fill="none" stroke-width="7">`;
  p += `<path d="M-60 0 L-10 -520 M60 0 L10 -520 M-52 -80 L52 -80 M-44 -180 L44 -180 M-34 -290 L34 -290 M-24 -400 L24 -400 M-52 -80 L44 -180 M52 -80 L-44 -180 M-44 -180 L34 -290 M44 -180 L-34 -290"/>`;
  p += `<g transform="translate(0,-530) rotate(${f1(t * 60)})">${Array.from({ length: 12 }, (_, i) => `<path d="M0 0 L0 -130" stroke-width="10" transform="rotate(${i * 30})"/><path d="M-14 -70 L0 -132 L14 -70Z" fill="${c}" stroke-width="2" transform="rotate(${i * 30})"/>`).join('')}<circle r="14" fill="${c}"/></g>`;
  p += `<path d="M10 -530 L120 -530 L150 -560 L150 -500Z" fill="${c}" stroke-width="3"/>`;
  return p + '</g>';
}
function fence(x0, x1, y, s, lit = 1) {
  const c = mix('#8A6A48', '#1a1a20', 1 - lit), cd = mix('#5E452E', '#101014', 1 - lit);
  let p = '';
  for (let x = x0; x <= x1; x += 150 * s) p += `<rect x="${f1(x - 9 * s)}" y="${f1(y - 150 * s)}" width="${f1(18 * s)}" height="${f1(160 * s)}" rx="3" fill="${c}"/><rect x="${f1(x + 3 * s)}" y="${f1(y - 150 * s)}" width="${f1(6 * s)}" height="${f1(160 * s)}" fill="${cd}"/>`;
  p += `<rect x="${x0}" y="${f1(y - 120 * s)}" width="${x1 - x0}" height="${f1(14 * s)}" fill="${c}"/><rect x="${x0}" y="${f1(y - 70 * s)}" width="${x1 - x0}" height="${f1(14 * s)}" fill="${c}"/>`;
  return p;
}
const TUFTS = Array.from({ length: 90 }, () => ({ x: R() * 2600 - 760, y: R(), k: .6 + R() * .9, c: R() }));
const PEBS = Array.from({ length: 120 }, () => ({ x: R() * 2600 - 760, y: R(), r: 2 + R() * 7, c: R() }));
const GRAIN = Array.from({ length: 70 }, () => ({ x: 200 + R() * 700, y: R(), r: 3 + R() * 3 }));
function ground(y0, d, t, o = {}) {
  const lit = o.lit ?? 1, [a, b, c] = skyCol(d), id = nid('gr');
  const g1 = mix(mix('#9C7A52', c, .15), '#151520', 1 - lit), g2 = mix('#6E5236', '#0d0d14', 1 - lit);
  def(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(g1, c, .2)}"/><stop offset=".3" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient>`);
  let s = `<rect x="-1500" y="${y0}" width="5000" height="2000" fill="url(#${id})"/>`;
  const gc = [mix('#7C8A3A', '#151a18', 1 - lit), mix('#97A24A', '#1c2220', 1 - lit), mix('#5C6A2C', '#101410', 1 - lit)];
  s += PEBS.map(q => { const yy = y0 + 10 + Math.pow(q.y, 1.6) * 1100, k = .4 + q.y; return `<ellipse cx="${f1(q.x)}" cy="${f1(yy)}" rx="${f1(q.r * k * 1.6)}" ry="${f1(q.r * k * .7)}" fill="${q.c < .5 ? g2 : mix(g1, '#ffffff', .15)}" opacity=".7"/>`; }).join('');
  if (o.grain) s += GRAIN.map(q => `<ellipse cx="${f1(q.x)}" cy="${f1(y0 + 250 + q.y * 500)}" rx="${q.r}" ry="${f1(q.r * .6)}" fill="#E8C060"/>`).join('');
  s += TUFTS.map(q => { const yy = y0 + 6 + Math.pow(q.y, 1.4) * 1100, k = (.5 + q.y * 1.2) * q.k, sw = Math.sin(t * 1.6 + q.x) * 4; return `<g transform="translate(${f1(q.x)},${f1(yy)}) scale(${f1(k * 100) / 100})">${[-18, -8, 0, 9, 18].map((dx, i) => `<path d="M${dx - 3} 0 Q${dx + sw * .5} -30 ${dx * 1.6 + sw} ${-46 - (i % 2) * 18} Q${dx + 2 + sw * .5} -30 ${dx + 3} 0Z" fill="${gc[(i + Math.floor(q.c * 3)) % 3]}"/>`).join('')}</g>`; }).join('');
  return s;
}
// fazendeiro em silhueta com luz de recorte (chapéu, macacão, botas). Origem nos pés.
function farmer(o) {
  const P = Object.assign({ x: 0, y: 0, s: 1, flip: 1, ph: 0, walk: 0, rim: '#FFC27A', body: '#16100C', axeUp: 0 }, o);
  const a = Math.sin(P.ph) * P.walk, B = P.body;
  const limb = (x, y, ang, l, w0, w1) => { const c = Math.cos(ang * Math.PI / 180), sn = Math.sin(ang * Math.PI / 180); const ex = x - sn * l, ey = y + c * l; const nx = c, ny = sn; return { d: `M${f1(x + nx * w0)} ${f1(y + ny * w0)} L${f1(ex + nx * w1)} ${f1(ey + ny * w1)} Q${f1(ex - sn * w1 * .8)} ${f1(ey + c * w1 * .8)} ${f1(ex - nx * w1)} ${f1(ey - ny * w1)} L${f1(x - nx * w0)} ${f1(y - ny * w0)}Z`, ex, ey }; };
  const leg = (ang) => { const th = limb(0, -500, ang, 250, 44, 34), sh = limb(th.ex, th.ey, ang - Math.max(0, -ang) * 1.2 - 4, 240, 33, 26);
    const bx = sh.ex, by = sh.ey; return `<path d="${th.d}" fill="${B}"/><path d="${sh.d}" fill="${B}"/><path d="M${f1(bx + 34)} ${f1(by - 34)} L${f1(bx + 34)} ${f1(by + 16)} L${f1(bx - 78)} ${f1(by + 16)} Q${f1(bx - 84)} ${f1(by - 14)} ${f1(bx - 50)} ${f1(by - 24)} L${f1(bx - 26)} ${f1(by - 40)}Z" fill="#0b0705"/>`; };

function sDrop(t) {

/* ---------- 7. fama: tenda do show, holofote, flashes, moeda ---------- */
const CROWD = Array.from({ length: 26 }, (_, i) => ({ x: -120 + (i % 13) * 105 + (i > 12 ? 50 : 0), row: i > 12 ? 1 : 0, h: R(), hat: R() < .6 }));

/* ---------- 8. raio-X: por que ele sobreviveu ---------- */
function sXray(t) {
  const L = t - 40;
  setCam(lerp(560, 600, easeInOut(range(L, 0, 2.5))), lerp(1120, 900, easeInOut(range(L, 0, 2.5))), lerp(1.0, 1.7, easeInOut(range(L, 0, 2.5))), 0, [560, 1100, 1]);

/* ---------- 10. motel em Phoenix, 1947: ele engasga ---------- */

const FN = { hook: sHook, farm: sFarm, block: sBlock, up: sUp, barn: sBarn, drop: sDrop, show: sShow, xray: sXray, syr: sSyr, motel: sMotel, end: sEnd };

/* ======================= render ======================= */
const defsEl = document.getElementById('defs'), root = document.getElementById('root');
const STATIC = stdDefs() + chickenDefs();
function frame(t) {
  D = []; uid = 0;
  const sh = shotAt(t);
  let body = FN[sh[0]](t);
  // corte com flash curto
  for (const c of SH.slice(1)) if (t >= c[1] && t < c[1] + .08) body += `<rect width="1080" height="1920" fill="#fff" opacity="${op(.25 * (1 - (t - c[1]) / .08))}"/>`;
  defsEl.innerHTML = STATIC + D.join('');
  root.innerHTML = body;
}
const params = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1080, innerHeight / 1920));
addEventListener('resize', fit); fit();
const audio = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null;
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); if (audio) { audio.currentTime = offset; audio.play(); } }
startEl.addEventListener('click', play);
window.__total = TOTAL;
window.__seek = t => { playing = false; offset = t; frame(t); };

if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset); else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
