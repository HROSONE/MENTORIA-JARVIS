<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Paradoxo dos Gêmeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00E5FF; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #s{display:block}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .ov{position:absolute;left:40px;right:40px;top:var(--y);text-align:center;color:#fff;font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1.02;
    opacity:0;transform:translateY(40px) scale(.9);transition:opacity .2s ease, transform .35s cubic-bezier(.2,.9,.3,1.4);
    text-shadow:0 10px 40px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.8);pointer-events:none}
  .ov.on{opacity:1;transform:none}
  .a{color:var(--accent)}
  .sub{display:block;font-size:.34em;letter-spacing:.14em;margin-top:.25em}
  .btn{display:inline-block;border:10px solid var(--accent);border-radius:999px;padding:.28em .75em;background:rgba(0,0,0,.5);box-shadow:0 0 60px rgba(0,229,255,.35)}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font:800 54px 'Montserrat',sans-serif;background:rgba(0,0,0,.55);cursor:pointer;gap:30px;text-align:center}
  #start small{font-size:30px;opacity:.6}
  #start.hide{display:none}
</style>
</head>
<body>
<div id="stage">
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050F"/><stop offset=".55" stop-color="#0B1433"/><stop offset=".75" stop-color="#1B2A5C"/><stop offset="1" stop-color="#2A3B70"/></linearGradient>
  <linearGradient id="skyGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27407E"/><stop offset=".45" stop-color="#B8607A"/><stop offset=".7" stop-color="#F79A55"/><stop offset=".85" stop-color="#FFD083"/><stop offset="1" stop-color="#FFE7B0"/></linearGradient>
  <linearGradient id="groundNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2242"/><stop offset=".3" stop-color="#0D1228"/><stop offset="1" stop-color="#05070F"/></linearGradient>
  <linearGradient id="groundGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98B5E"/><stop offset=".25" stop-color="#7C5240"/><stop offset="1" stop-color="#2E1F1C"/></linearGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2F5FA"/><stop offset=".55" stop-color="#D5DBE6"/><stop offset="1" stop-color="#9AA3B5"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#9EA8BC"/><stop offset=".55" stop-color="#5E6880"/><stop offset="1" stop-color="#C9D1E0"/></linearGradient>
  <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1FF" stop-opacity=".55"/><stop offset="1" stop-color="#E8F1FF" stop-opacity="0"/></linearGradient>
  <linearGradient id="doorBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9C4" stop-opacity=".75"/><stop offset="1" stop-color="#FFE9C4" stop-opacity="0"/></linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2A44"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
  <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D6B4"/><stop offset="1" stop-color="#CDB48E"/></linearGradient>
  <radialGradient id="glowW"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".25" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0" stop-color="#E6FDFF" stop-opacity="1"/><stop offset=".2" stop-color="#00E5FF" stop-opacity=".7"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#FFF6D8" stop-opacity="1"/><stop offset=".3" stop-color="#FFB347" stop-opacity=".6"/><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowWarm"><stop offset="0" stop-color="#FFF1D0" stop-opacity="1"/><stop offset=".35" stop-color="#FFD9A0" stop-opacity=".5"/><stop offset="1" stop-color="#FFB870" stop-opacity="0"/></radialGradient>
  <radialGradient id="sunG"><stop offset="0" stop-color="#FFFBE8"/><stop offset=".22" stop-color="#FFE7A6"/><stop offset=".45" stop-color="#FFC06A" stop-opacity=".55"/><stop offset="1" stop-color="#FF9A4A" stop-opacity="0"/></radialGradient>
  <radialGradient id="smokeG" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#F3EEE8"/><stop offset=".7" stop-color="#C8C0BA"/><stop offset="1" stop-color="#A89C96"/></radialGradient>
  <radialGradient id="smokeFire" cx=".5" cy=".8" r=".7"><stop offset="0" stop-color="#FFB060"/><stop offset=".6" stop-color="#D88A5A"/><stop offset="1" stop-color="#8D7A72"/></radialGradient>
  <radialGradient id="nebA"><stop offset="0" stop-color="#7B3FD1" stop-opacity=".55"/><stop offset="1" stop-color="#7B3FD1" stop-opacity="0"/></radialGradient>
  <radialGradient id="nebB"><stop offset="0" stop-color="#1F8FD8" stop-opacity=".45"/><stop offset="1" stop-color="#1F8FD8" stop-opacity="0"/></radialGradient>
  <radialGradient id="nebC"><stop offset="0" stop-color="#E0457B" stop-opacity=".35"/><stop offset="1" stop-color="#E0457B" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <radialGradient id="atmo"><stop offset=".86" stop-color="#5EC8FF" stop-opacity="0"/><stop offset=".9" stop-color="#5EC8FF" stop-opacity=".7"/><stop offset="1" stop-color="#5EC8FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="earthShade" cx=".3" cy=".25" r=".9"><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000818" stop-opacity=".85"/></radialGradient>
  <linearGradient id="plumeO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".15" stop-color="#FFF0B0"/><stop offset=".5" stop-color="#FFA040"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></linearGradient>
  <linearGradient id="plumeB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".2" stop-color="#BFF4FF"/><stop offset=".6" stop-color="#2FA8FF" stop-opacity=".6"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></linearGradient>
  <filter id="bl3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="bl8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="bl16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="bl30" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="bl60" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="topHalf"><rect width="1080" height="955"/></clipPath>
  <clipPath id="botHalf"><rect y="965" width="1080" height="955"/></clipPath>
</defs>
<defs id="fdefs"></defs>
<g id="world"></g>
<g id="post"></g>
</svg>
<div id="flash"></div>
<div id="texts"></div>
<div id="start">▶ CLIQUE ou ESPAÇO<small>com som · ESPAÇO pausa · R reinicia</small></div>
</div>
<!--AUDIO-->
<script>
/* ======== LINHA DO TEMPO (segundos) — a mesma do áudio ======== */
const EV = {
  door: .45, out: .9, a2: 1.4, a3: 2.6, gem: 3.2,
  before: 4.4, b2: 7.2, sync: 7.9, b3: 8.8, b4: 9.8, ign: 9.9, b5: 10.6,
  space: 12.0, warp: 12.9, cockpit: 15.0, look: 15.8, shrug: 17.6,
  split: 19.0, ret: 27.0, touch: 28.2, watches: 29.4, why: 31.4,
  clock: 32.6, moving: 35.2, compare: 38.2, einstein: 40.2, gps: 42.0, final: 44.6, pull: 46.4, end: 48.5,
};
const TEXTS = [
  { from: 1.6, to: 4.3, y: 200, fs: 110, html: 'ELES SÃO' },
  { from: 2.4, to: 4.3, y: 320, fs: 190, html: '<span class="a">GÊMEOS</span>' },
  { from: 4.5, to: 6.0, y: 260, fs: 110, html: '50 ANOS<br><span class="a">ANTES</span>' },
  { from: 13.2, to: 14.9, y: 1480, fs: 150, html: '<span class="a">99,5%</span><span class="sub">DA VELOCIDADE DA LUZ</span>' },
  { from: 16.0, to: 18.9, y: 200, fs: 96, html: 'PRA ELE,<br><span class="a">TUDO NORMAL</span>' },
  { from: 31.5, to: 32.6, y: 820, fs: 170, html: 'POR QUÊ<span class="a">?</span>' },
  { from: 33.0, to: 35.1, y: 190, fs: 100, html: 'RELÓGIO<br><span class="a">DE LUZ</span>' },
  { from: 35.9, to: 38.1, y: 190, fs: 88, html: 'A LUZ FAZ UM<br><span class="a">CAMINHO MAIOR</span>' },
  { from: 38.4, to: 40.1, y: 190, fs: 84, html: 'MAIS VELOCIDADE<br><span class="a">MENOS TEMPO</span>' },
  { from: 40.4, to: 41.95, y: 1430, fs: 120, html: '<span class="a">EINSTEIN</span><span class="sub">RELATIVIDADE · 1905</span>' },
  { from: 42.3, to: 44.5, y: 200, fs: 80, html: 'O GPS DO SEU CELULAR<br><span class="a">CORRIGE ISSO</span>' },
  { from: 45.6, to: 48.5, y: 1580, fs: 110, html: '<span class="btn">SE INSCREVE</span>' },
];
const TOTAL = EV.end;

/* ---------------- utilidades ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const pulse = (t, a, b, f = .25) => Math.min(range(t, a, a + f), 1 - range(t, b - f, b));
const f1 = x => Math.round(x * 10) / 10;
const op = x => Math.round(clamp(x) * 100) / 100;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); };
const noise1 = (t, s = 0) => Math.sin(t * 1.7 + s) * .5 + Math.sin(t * 3.1 + s * 2.3) * .3 + Math.sin(t * 7.3 + s * .7) * .2;

let D = [], uid = 0;
const def = s => D.push(s);
const nid = p => p + (uid++);

/* ---------------- luz: rig de iluminação por silhueta ---------------- */
// amb: cor ambiente (multiplica) · k: direção da luz principal (sombra do lado oposto) · rims: luzes de recorte
function rig(o) {
  const { amb = '#ffffff', k = [-1, -.3], sh = '#1a1030', shO = .45, shD = 40, rims = [], bloom = 0 } = o;
  const id = nid('rg');
  let s = `<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feFlood flood-color="${amb}" result="a"/><feComposite in="a" in2="SourceAlpha" operator="in" result="a2"/>
    <feBlend in="SourceGraphic" in2="a2" mode="multiply" result="base"/>
    <feOffset in="SourceAlpha" dx="${f1(shD * k[0])}" dy="${f1(shD * k[1])}" result="so"/>
    <feComposite in="SourceAlpha" in2="so" operator="out" result="s1"/>
    <feGaussianBlur in="s1" stdDeviation="${f1(shD * .45)}" result="s2"/>
    <feComposite in="s2" in2="SourceAlpha" operator="in" result="s3"/>
    <feFlood flood-color="${sh}" flood-opacity="${shO}"/><feComposite in2="s3" operator="in" result="s4"/>
    <feComposite in="s4" in2="base" operator="over" result="r0"/>`;
  rims.forEach((r, i) => {
    const d = r.w || 8;
    s += `<feOffset in="SourceAlpha" dx="${f1(-d * r.k[0])}" dy="${f1(-d * r.k[1])}" result="ro${i}"/>
    <feComposite in="SourceAlpha" in2="ro${i}" operator="out" result="rm${i}"/>
    <feGaussianBlur in="rm${i}" stdDeviation="${f1(d * .3)}" result="rb${i}"/>
    <feComposite in="rb${i}" in2="SourceAlpha" operator="in" result="rc${i}"/>
    <feFlood flood-color="${r.c}" flood-opacity="${r.o ?? 1}"/><feComposite in2="rc${i}" operator="in" result="rl${i}"/>
    <feBlend in="rl${i}" in2="r${i}" mode="screen" result="r${i + 1}"/>`;
    if (r.glow) s += `<feGaussianBlur in="rl${i}" stdDeviation="${f1(d * 1.6)}" result="rg${i}"/><feBlend in="rg${i}" in2="r${i + 1}" mode="screen" result="r${i + 1}"/>`;
  });
  s += `<feMerge><feMergeNode in="r${rims.length}"/></feMerge></filter>`;
  def(s);
  return id;
}

/* ---------------- câmera com paralaxe ---------------- */
let CAM = { x: 540, y: 960, z: 1, r: 0, x0: 540, y0: 960, z0: 1 };
function setCam(x, y, z, r = 0, base) { CAM = { x, y, z, r, x0: base ? base[0] : x, y0: base ? base[1] : y, z0: base ? base[2] : z }; }
function lay(p, content, filter = '') {
  const z = CAM.z0 * (1 + (CAM.z / CAM.z0 - 1) * p), x = CAM.x0 + (CAM.x - CAM.x0) * p, y = CAM.y0 + (CAM.y - CAM.y0) * p;
  return `<g transform="translate(540,960) rotate(${f1(CAM.r)}) scale(${Math.round(z * 1000) / 1000}) translate(${f1(-x)},${f1(-y)})"${filter ? ` filter="url(#${filter})"` : ''}>${content}</g>`;
}

/* ---------------- rosto ---------------- */
function head(o = {}) {
  const { ex = 'neutro', age = 0, turn = 0, blink = 0, look = [0, 0], glasses = age > .6 } = o;
  const SK = mix('#F4C39C', '#EDBA97', age), SD = mix('#DC9A74', '#C98B6B', age);
  const H = mix('#35200F', '#E4E4EA', age), HD = mix('#22140A', '#B5B7BF', age), HL = mix('#7A4E2C', '#FFFFFF', age);
  const fx = turn * 34, sgn = turn >= 0 ? 1 : -1, at = Math.abs(turn);
  let s = '';
  s += `<path d="M-128 10 C-140 -130 -66 -176 ${f1(4 - fx * .3)} -168 C76 -176 140 -120 128 10 C130 60 120 84 108 92 L-108 92 C-120 84 -130 60 -128 10Z" fill="${HD}"/>`;
  const ear = (side) => { const vis = side * turn > .4 ? 0 : 1; return `<g transform="translate(${f1(side * 121 + fx * .35)},16)" opacity="${vis}"><ellipse rx="25" ry="34" fill="${SK}"/><path d="M${-side * 2} -16 Q${side * 10} 0 ${-side * 2} 16" stroke="${SD}" stroke-width="7" fill="none" stroke-linecap="round"/></g>`; };
  s += ear(-1) + ear(1);
  s += `<ellipse rx="122" ry="138" fill="${SK}"/>`;
  s += `<ellipse cx="${f1(-sgn * 70 - fx * .4)}" cy="30" rx="${f1(40 + 40 * at)}" ry="110" fill="${SD}" opacity="${op(.12 + .2 * at)}"/>`;
  // cabelo da frente + topete
  const hx = fx * .3, q = 1 - age * .25;
  s += `<g transform="translate(${f1(hx)},0)">
    <path d="M-126 -4 C-134 -120 -64 -168 0 -162 C72 -168 134 -110 126 -4 C116 -50 96 -76 62 -84 C20 -92 -40 -86 -80 -70 C-106 -58 -118 -38 -126 -4Z" fill="${H}"/>
    <g transform="translate(0,-100) scale(1,${q}) translate(0,100)">
    <path d="M-84 -102 C-96 -212 44 -262 142 -196 C106 -190 90 -176 84 -150 C50 -176 -22 -158 -84 -102Z" fill="${H}"/>
    <path d="M-40 -150 C-10 -200 60 -214 112 -196" stroke="${HL}" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M-60 -126 C-40 -170 10 -190 60 -186" stroke="${HL}" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5"/></g>
    <path d="M-118 -30 L-112 34 L-100 -18Z" fill="${H}"/><path d="M118 -30 L112 34 L100 -18Z" fill="${H}"/></g>`;
  // olhos
  const eye = (x, sx) => {
    if (ex === 'riso') return `<path d="M${f1(x - 24 * sx)} 10 Q${f1(x)} -18 ${f1(x + 24 * sx)} 10" stroke="#2B1A10" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    const big = ex === 'susto' ? 1.22 : 1, open = clamp(1 - blink, .06, 1);
    return `<g transform="translate(${f1(x)},4) scale(${f1(sx * big * 100) / 100},${f1(big * open * 100) / 100})">
      <ellipse rx="27" ry="33" fill="#fff"/>
      <circle cx="${f1(look[0] + turn * 7)}" cy="${f1(look[1] + 3)}" r="${ex === 'susto' ? 12 : 18}" fill="#5A341B"/>
      <circle cx="${f1(look[0] + turn * 7)}" cy="${f1(look[1] + 3)}" r="${ex === 'susto' ? 7 : 10}" fill="#120A05"/>
      <circle cx="${f1(look[0] + turn * 7 + 6)}" cy="${f1(look[1] - 6)}" r="6" fill="#fff"/><circle cx="${f1(look[0] + turn * 7 - 6)}" cy="${f1(look[1] + 9)}" r="3" fill="#fff" opacity=".8"/>
      <path d="M-29 -2 Q0 -42 29 -2" stroke="#2B1A10" stroke-width="6" fill="none" stroke-linecap="round"/>
      ${ex === 'emocao' ? `<ellipse cx="0" cy="28" rx="22" ry="6" fill="#BDE8FF" opacity=".8"/>` : ''}</g>`;
  };
  const eL = -48 + fx * 1.1, eR = 48 + fx * .85;
  s += eye(eL, turn > 0 ? 1 : 1 + turn * .35) + eye(eR, turn < 0 ? 1 : 1 - turn * .35);
  // sobrancelhas
  const by = ex === 'susto' ? -24 : ex === 'serio' ? 4 : ex === 'riso' ? -12 : ex === 'emocao' ? -10 : 0;
  const bt = ex === 'serio' ? 10 : ex === 'emocao' ? -6 : 0;
  const BR = mix('#2E1B0D', '#C7C8CE', age);
  s += `<path d="M${f1(eL - 32)} ${-46 + by} Q${f1(eL - 4)} ${-64 + by} ${f1(eL + 26)} ${-52 + by + bt}" stroke="${BR}" stroke-width="13" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M${f1(eR + 32)} ${-46 + by} Q${f1(eR + 4)} ${-64 + by} ${f1(eR - 26)} ${-52 + by + bt}" stroke="${BR}" stroke-width="13" fill="none" stroke-linecap="round"/>`;
  // nariz
  const nx = fx * 1.25;
  s += `<path d="M${f1(nx - 2)} 22 Q${f1(nx + 14 * sgn + 6 * turn)} 50 ${f1(nx - 4)} 58" stroke="${SD}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  // boca
  const mx = fx * 1.05, ms = 1 - .2 * at;
  let m = '';
  if (ex === 'feliz') m = `<path d="M-40 -6 Q0 40 40 -6 Q0 12 -40 -6Z" fill="#6E2A24"/><path d="M-30 0 Q0 10 30 0 L27 7 Q0 15 -27 7Z" fill="#fff"/>`;
  else if (ex === 'riso') m = `<path d="M-48 -12 Q0 74 48 -12 Q0 2 -48 -12Z" fill="#5E2420"/><ellipse cx="0" cy="30" rx="22" ry="12" fill="#E07A72"/><path d="M-38 -6 Q0 6 38 -6 L35 4 Q0 14 -35 4Z" fill="#fff"/>`;
  else if (ex === 'susto') m = `<ellipse cy="6" rx="22" ry="30" fill="#5A1E1E"/><ellipse cy="22" rx="13" ry="8" fill="#E06C6C"/>`;
  else if (ex === 'serio') m = `<path d="M-24 4 Q0 -2 24 4" stroke="#8A3B32" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  else if (ex === 'emocao') m = `<path d="M-32 -4 Q0 24 32 -4" stroke="#8A3B32" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  else m = `<path d="M-24 0 Q0 10 24 0" stroke="#8A3B32" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  s += `<g transform="translate(${f1(mx)},92) scale(${f1(ms * 100) / 100},1)">${m}</g>`;
  s += `<circle cx="${f1(-80 + fx)}" cy="62" r="21" fill="#FF8A80" opacity=".3"/><circle cx="${f1(80 + fx * .8)}" cy="62" r="21" fill="#FF8A80" opacity=".3"/>`;
  if (age > .25) {
    const w = op(range(age, .25, .9));
    s += `<g opacity="${w}" stroke="${SD}" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M${f1(-50 + fx * .5)} -92 Q${f1(fx * .5)} -102 ${f1(50 + fx * .5)} -92"/><path d="M${f1(-40 + fx * .5)} -76 Q${f1(fx * .5)} -84 ${f1(40 + fx * .5)} -76"/>
      <path d="M${f1(eL - 36)} 4 l-14 -6 M${f1(eL - 36)} 14 l-14 4 M${f1(eR + 36)} 4 l14 -6 M${f1(eR + 36)} 14 l14 4"/>

  s += `<g style="mix-blend-mode:screen"><path d="M440 -100 L640 -100 L1000 1500 L80 1500Z" fill="#7FA0FF" opacity=".08" filter="url(#bl30)"/></g>`;
  const mirror = (x, y, w = 300) => `<rect x="${f1(x - w / 2)}" y="${f1(y - 14)}" width="${w}" height="28" rx="14" fill="url(#chrome)"/><rect x="${f1(x - w / 2)}" y="${f1(y - 14)}" width="${w}" height="28" rx="14" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>`;
  const photon = (x, y, k = 1) => `<g style="mix-blend-mode:screen"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(90 * k)}" fill="url(#glowC)"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(16 * k)}" fill="#fff"/></g>`;
  const ring = (x, y, ph) => ph < 1 ? `<g style="mix-blend-mode:screen"><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(40 + 160 * ph)}" ry="${f1(10 + 30 * ph)}" fill="none" stroke="#00E5FF" stroke-width="${f1(8 * (1 - ph))}" opacity="${op(1 - ph)}"/></g>` : '';
  // posição do fóton: ping-pong entre yA e yB, período p
  const bounce = (tt, p) => { const c = tt / p, f = c % 2; return { u: f < 1 ? f : 2 - f, n: Math.floor(c), fr: c % 1 }; };
  if (t < EV.moving) {
    const k = range(t, EV.clock, EV.moving), yA = 640, yB = 1340;
    s += mirror(540, yA) + mirror(540, yB);
    const b = bounce(t - EV.clock, .55), y = lerp(yB - 20, yA + 20, b.u);
    for (let j = 1; j < 8; j++) { const bb = bounce(t - EV.clock - j * .025, .55); s += `<circle cx="540" cy="${f1(lerp(yB - 20, yA + 20, bb.u))}" r="${16 - j * 1.8}" fill="#9FF4FF" opacity="${op(.5 - j * .06)}"/>`; }
    s += photon(540, y) + ring(540, b.n % 2 ? yA : yB, b.fr * 2.2);
    s += `<text x="540" y="1480" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="900" font-size="54" fill="#9FF4FF" opacity=".9">1 TIQUE = SOBE E DESCE</text>`;
    s = `<g transform="translate(540,960) scale(${f1(lerp(1.15, 1, easeOut(k)) * 1000) / 1000}) translate(-540,-960)">${s}</g>`;
  } else if (t < EV.compare) {
    const k = range(t, EV.moving, EV.compare), x0 = -100, x1 = 1180, yA = 760, yB = 1260;
    const p = .55, X = tt => lerp(x0, x1, clamp((tt - EV.moving) / (EV.compare - EV.moving)));
    const cx = X(t);
    // nave transparente carregando o relógio
    s += `<g transform="translate(${f1(cx)},${yB + 60})" opacity=".85"><path d="M-220 0 Q-220 -40 -160 -40 L180 -40 Q260 -40 280 0 Q260 40 180 40 L-160 40 Q-220 40 -220 0Z" fill="#26304A" stroke="#4FF0FF" stroke-width="4"/>${plumeBlue(160, t).replace('<g style="mix-blend-mode:screen">', '<g style="mix-blend-mode:screen" transform="translate(-220,0) rotate(90)">')}</g>`;
    s += mirror(cx, yA) + mirror(cx, yB);
    // trilha em zigue-zague
    const pts = [];
    for (let tt = EV.moving; tt <= t; tt += .02) { const b = bounce(tt - EV.moving, p); pts.push(`${f1(X(tt))},${f1(lerp(yB - 20, yA + 20, b.u))}`); }
    s += `<g style="mix-blend-mode:screen"><polyline points="${pts.join(' ')}" stroke="#00E5FF" stroke-width="16" fill="none" opacity=".5" filter="url(#bl8)"/><polyline points="${pts.join(' ')}" stroke="#CFF8FF" stroke-width="5" fill="none"/></g>`;
    const b = bounce(t - EV.moving, p);
    s += photon(cx, lerp(yB - 20, yA + 20, b.u)) + ring(cx, b.n % 2 ? yA : yB, b.fr * 2.2);
    // comparação: caminho vertical
    if (k > .45) { const q = easeOut(range(k, .45, .6)); s += `<g opacity="${op(q)}"><line x1="300" y1="${yB - 20}" x2="300" y2="${yA + 20}" stroke="#FFB347" stroke-width="8" stroke-dasharray="20 14"/><text x="300" y="${yA - 40}" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="900" font-size="44" fill="#FFB347">PARADO</text>
      <text x="${f1(Math.min(cx, 860))}" y="${yB + 190}" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="900" font-size="44" fill="#00E5FF">EM MOVIMENTO</text></g>`; }
    s += `<text x="540" y="1640" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="800" font-size="46" fill="#fff" opacity=".85">VISTO DA TERRA</text>`;
  } else {
    // dois relógios lado a lado: Terra (rápido) x Nave (devagar)
    const k = range(t, EV.compare, EV.einstein), yA = 700, yB = 1300;
    const L = 290, R = 790;
    const bT = bounce(t - EV.compare, .3), bN = bounce(t - EV.compare, 1.2);
    s += mirror(L, yA, 240) + mirror(L, yB, 240) + mirror(R, yA, 240) + mirror(R, yB, 240);
    s += photon(L, lerp(yB - 20, yA + 20, bT.u), .9) + ring(L, bT.n % 2 ? yA : yB, bT.fr * 2.2);
    s += photon(R, lerp(yB - 20, yA + 20, bN.u), .9) + ring(R, bN.n % 2 ? yA : yB, bN.fr * 1.2);
    s += `<rect x="538" y="600" width="4" height="820" fill="#2A3550"/>`;
    const lab = (x, c, a, b) => `<text x="${x}" y="1440" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="900" font-size="58" fill="${c}">${a}</text><text x="${x}" y="1520" text-anchor="middle" font-family="Montserrat,'DejaVu Sans',sans-serif" font-weight="800" font-size="42" fill="#fff" opacity=".85">${b}</text>`;
    s += lab(L, '#FFB347', 'TERRA', `${Math.floor((t - EV.compare) / .3)} TIQUES`) + lab(R, '#00E5FF', 'NAVE', `${Math.floor((t - EV.compare) / 1.2)} TIQUES`);
    s = `<g transform="translate(540,960) scale(${f1(lerp(1.08, 1, easeOut(k)) * 1000) / 1000}) translate(-540,-960)">${s}</g>`;
  }
  return s;
}

/* ---------------- textos ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) { const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = x.html; el.style.setProperty('--y', x.y + 'px'); el.style.setProperty('--fs', x.fs + 'px'); textHost.appendChild(el); x.el = el; }

/* ---------------- controle + som ---------------- */
const W0 = 1080, H0 = 1920, params = new URLSearchParams(location.search);
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W0, innerHeight / H0));
addEventListener('resize', fit); fit();
const audio = window.AUDIO_SRC ? new Audio(window.AUDIO_SRC) : null;
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); if (audio) { audio.currentTime = offset; audio.play(); } }
function pause() { offset = current(); playing = false; if (audio) audio.pause(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { pause(); offset = 0; play(); }
  if (e.code === 'ArrowRight') { const p = playing; pause(); offset = Math.min(TOTAL, offset + 3); if (p) play(); }
  if (e.code === 'ArrowLeft') { const p = playing; pause(); offset = Math.max(0, offset - 3); if (p) play(); }
});
window.__total = TOTAL;
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
