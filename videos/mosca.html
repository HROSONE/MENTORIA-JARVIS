<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Você é uma Mosca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00E5FF; --s:1; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;
    transform:translate(-50%,-50%) scale(var(--s));background:#000}
  #c{display:block;width:1080px;height:1920px}
  .ov{position:absolute;left:50px;right:50px;top:var(--y);text-align:center;color:#fff;
    font-family:'Montserrat',system-ui,sans-serif;font-weight:900;font-size:var(--fs);line-height:1;
    letter-spacing:-0.01em;opacity:0;transform:translateY(40px) scale(.92);
    transition:opacity .25s ease, transform .45s cubic-bezier(.2,.9,.3,1.25);
    text-shadow:0 10px 40px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.7);pointer-events:none}
  .ov.on{opacity:1;transform:none}
  .a{color:var(--accent)}
  .sm{display:block;font-size:.36em;letter-spacing:.25em;margin-bottom:.12em}
  .btn{display:inline-block;border:10px solid var(--accent);border-radius:999px;padding:.28em .75em;
    background:rgba(0,0,0,.45);box-shadow:0 0 60px rgba(0,229,255,.35)}
  .diag{display:flex;flex-direction:column;align-items:center;gap:18px}
  .diag svg{width:120px;height:150px}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:#fff;font:800 54px 'Montserrat',sans-serif;background:rgba(0,0,0,.55);cursor:pointer;gap:30px;text-align:center}
  #start small{font-size:30px;font-weight:800;opacity:.6}
  #start.hide{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="texts"></div>
  <div id="start">▶ CLIQUE ou ESPAÇO<small>ESPAÇO pausa · R reinicia · ← → avança/volta 2s</small></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   ROTEIRO / TEMPOS — ajuste "dur" (segundos) para casar com a sua fala.
   Os textos são relativos ao início de cada trecho, então tudo se move junto.
   ===================================================================== */
const SEGMENTS = [
  { id:'almoco',     dur:4.2 }, // "Você está lá, de boa, almoçando no prato do humano."
  { id:'mao',        dur:5.4 }, // "De repente, uma mão gigante vem na sua direção pra te dar um tapa. Em câmera lenta."
  { id:'desvia',     dur:3.6 }, // "Você desvia fácil. Mas por que isso acontece?"
  { id:'mosca',      dur:3.8 }, // "Porque você não é qualquer um. Você é uma mosca."
  { id:'olhos',      dur:6.0 }, // "...a SUA cabeça é composta por milhares de olhos."
  { id:'graus',      dur:9.0 }, // "...visão panorâmica de quase 360 graus. Você enxerga ele por todos os lados..."
  { id:'impressiona',dur:3.0 }, // "Mas isso nem é o mais impressionante."
  { id:'fracoes',    dur:6.5 }, // "Cada um dos seus olhos capta frações do ambiente. ...visão extraordinária."
  { id:'movimento',  dur:8.5 }, // "...cérebro é especialista em sentir cintilações e movimentos... vibrações da mão..."
  { id:'instinto',   dur:7.0 }, // "...olhos conectados diretamente ao corpo e aos músculos... Automaticamente."
  { id:'inscreve',   dur:4.0 }, // "E se você gostou de ser uma mosca se inscreve."
];
const ARROW = `<svg viewBox="0 0 120 150"><path d="M60 5 V120 M20 85 L60 130 L100 85" fill="none" stroke="#00E5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TEXTS = [
  { seg:'mao',       from:0.5, to:2.7, y:220,  fs:120, html:'MÃO <span class="a">GIGANTE</span>' },
  { seg:'mao',       from:3.0, to:5.4, y:220,  fs:110, html:'CÂMERA LENTA' },
  { seg:'desvia',    from:1.8, to:3.6, y:240,  fs:150, html:'POR QUÊ<span class="a">?</span>' },
  { seg:'mosca',     from:1.9, to:3.8, y:230,  fs:210, html:'<span class="a">MOSCA</span>' },
  { seg:'olhos',     from:2.2, to:6.0, y:200,  fs:130, html:'<span class="a">MILHARES</span><br>DE OLHOS' },
  { seg:'graus',     from:0.8, to:5.6, y:150,  fs:230, html:'<span class="sm">QUASE</span><span id="deg">0°</span>' },
  { seg:'fracoes',   from:0.8, to:3.6, y:220,  fs:140, html:'FRAÇÕES' },
  { seg:'fracoes',   from:3.8, to:6.5, y:200,  fs:100, html:'VISÃO<br><span class="a">EXTRAORDINÁRIA</span>' },
  { seg:'movimento', from:0.6, to:3.2, y:220,  fs:110, html:'CINTILAÇÕES' },
  { seg:'movimento', from:3.4, to:5.8, y:220,  fs:110, html:'MOVIMENTOS' },
  { seg:'instinto',  from:0.8, to:3.9, y:150,  fs:100, html:`<div class="diag"><span>OLHOS</span>${ARROW}<span class="a">MÚSCULOS</span></div>` },
  { seg:'instinto',  from:4.7, to:7.0, y:230,  fs:120, html:'<span class="a">AUTOMÁTICO</span>' },
  { seg:'inscreve',  from:0.6, to:4.0, y:1480, fs:110, html:'<span class="btn">SE INSCREVE</span>' },
];
const ACCENT = new THREE.Color('#00E5FF');

let acc = 0; for (const s of SEGMENTS) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
const SEG = Object.fromEntries(SEGMENTS.map(s => [s.id, s]));

/* ---------------- utilidades ---------------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeIn = x => Math.pow(clamp(x), 3);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UPV = V(0, 1, 0);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const bez = (a, b, c, k) => a.clone().multiplyScalar((1 - k) ** 2).addScaledVector(b, 2 * k * (1 - k)).addScaledVector(c, k * k);

/* ---------------- renderer ---------------- */
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a221c);
scene.fog = new THREE.Fog(0x2a221c, 9, 30);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.004, 80);

const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: rt.texture }, uMosaic: { value: 0 }, uCell: { value: 34 }, uRes: { value: new THREE.Vector2(W, H) },
    uVig: { value: .35 }, uFlash: { value: 0 }, uTime: { value: 0 }, uTint: { value: ACCENT.clone() }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uMosaic,uCell,uVig,uFlash,uTime; uniform vec2 uRes; uniform vec3 uTint;
    varying vec2 vUv;
    const vec2 S = vec2(1.0, 1.7320508);
    vec4 hexInfo(vec2 p){
      vec4 hC = floor(vec4(p, p - vec2(0.5, 1.0)) / S.xyxy) + 0.5;
      vec4 h = vec4(p - hC.xy*S, p - (hC.zw + 0.5)*S);
      return dot(h.xy,h.xy) < dot(h.zw,h.zw) ? vec4(h.xy, hC.xy*S) : vec4(h.zw, (hC.zw+0.5)*S);
    }
    float hexD(vec2 p){ p=abs(p); return max(dot(p, S*0.5), p.x); }
    void main(){
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      vec3 col = base;
      if(uMosaic > 0.001){
        vec2 px = vUv*uRes/uCell;
        vec4 h = hexInfo(px);
        vec2 cUv = h.zw*uCell/uRes;
        vec2 sUv = cUv + h.xy*uCell/uRes*0.45;
        vec3 fc = texture2D(tDiffuse, clamp(sUv, 0.0, 1.0)).rgb;
        float d = hexD(h.xy);
        float n = fract(sin(dot(h.zw, vec2(12.9898,78.233)))*43758.5453);
        fc *= 0.82 + 0.36*n;
        fc *= 1.0 - 0.45*smoothstep(0.1, 0.5, d);
        float edge = smoothstep(0.42, 0.48, d);
        fc = mix(fc, uTint*0.35, edge*0.6);
        col = mix(base, fc, uMosaic);
      }
      float v = length((vUv-0.5)*vec2(1.0,1.15));
      col *= 1.0 - uVig*smoothstep(0.3, 0.95, v);
      col += uFlash;
      float gr = fract(sin(dot(vUv*uRes + uTime*61.0, vec2(12.9898,78.233)))*43758.5453);
      col += (gr-0.5)*0.012;
      gl_FragColor = vec4(max(col, 0.0), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ---------------- texturas procedurais ---------------- */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAXANI;
  return t;
}
const clothTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#f2ebde'; g.fillRect(0, 0, 256, 256);
  g.fillStyle = 'rgba(170,34,32,.55)'; g.fillRect(0, 0, 128, 256); g.fillRect(0, 0, 256, 128);
  g.globalAlpha = .06; for (let i = 0; i < 256; i += 3) { g.fillStyle = i % 2 ? '#000' : '#fff'; g.fillRect(0, i, 256, 1); }
});
clothTex.repeat.set(16, 13);
const woodTex = canvasTex(512, 512, (g) => {
  g.fillStyle = '#5b3d28'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 512; i += 64) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(i, 0, 3, 512); }
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${rnd() > .5 ? '255,220,180' : '0,0,0'},.05)`; g.fillRect(rnd() * 512, rnd() * 512, 2, 40 + rnd() * 80); }
});
woodTex.repeat.set(8, 8);
const stripeTex = canvasTex(256, 128, (g) => {
  g.fillStyle = '#6a6a62'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#141412';
  for (const u of [.06, .19, .31, .44, .56, .69, .81, .94]) g.fillRect(u * 256 - 9, 0, 18, 128);
  for (let i = 0; i < 600; i++) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(rnd() * 256, rnd() * 128, 2, 2); }
});
const abdTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#6e6650'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) { g.fillStyle = 'rgba(20,18,12,.75)'; g.fillRect(x * 32, y * 32, 32, 32); }
  for (let i = 0; i < 800; i++) { g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(rnd() * 256, rnd() * 256, 2, 2); }
});
// olho composto: mosaico hexagonal de facetas
function eyeTextures() {
  const cols = 16, r = 1024 / cols / Math.sqrt(3), w = Math.sqrt(3) * r, rows = 18, h = Math.round(rows * 1.5 * r);
  const path = (g, cx, cy, rr) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); g.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); } g.closePath(); };
  const each = (fn) => { for (let row = -1; row <= rows; row++) for (let col = -1; col <= cols; col++) fn(col * w + (row % 2 ? w / 2 : 0), row * 1.5 * r); };
  const map = canvasTex(1024, h, (g) => {
    g.fillStyle = '#1a0302'; g.fillRect(0, 0, 1024, h);
    each((cx, cy) => {
      const gr = g.createRadialGradient(cx - r * .2, cy - r * .25, 1, cx, cy, r);
      gr.addColorStop(0, '#e2583a'); gr.addColorStop(.45, '#9c2313'); gr.addColorStop(1, '#3c0704');
      path(g, cx, cy, r * .92); g.fillStyle = gr; g.fill();
      g.fillStyle = 'rgba(255,225,205,.35)'; g.beginPath(); g.arc(cx - r * .25, cy - r * .3, r * .14, 0, 7); g.fill();
    });
  });
  const emi = canvasTex(1024, h, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, 1024, h);
    g.strokeStyle = '#fff'; g.lineWidth = 3; each((cx, cy) => { path(g, cx, cy, r * .92); g.stroke(); });
  });
  map.repeat.set(6, 3); emi.repeat.set(6, 3);
  return { map, emi };
}

/* ---------------- luzes ---------------- */
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x8a6a55, 1.0));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.6);
sun.position.set(5, 12, -9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 1, far: 40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffe2c0, 0.9); fill.position.set(-4, 6, 8); scene.add(fill);
const lamp = new THREE.PointLight(0xffd29a, 70, 0, 2); lamp.position.set(0, 8.5, 0); scene.add(lamp);

/* ---------------- cenário: cozinha / mesa ---------------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .7, ...o });
const shadowAll = (o) => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), std(0xffffff, { map: woodTex }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -7.5; scene.add(floor);
  const wallM = std(0x8a7560, { roughness: .95 });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), wallM); back.position.set(0, 6, -12); scene.add(back);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), wallM); side.rotation.y = Math.PI / 2; side.position.set(-12, 6, 0); scene.add(side);
  // janela
  const win = new THREE.Mesh(new THREE.PlaneGeometry(7, 8), new THREE.MeshBasicMaterial({ color: 0xcfe6ff })); win.position.set(4, 4, -11.95); scene.add(win);
  const frameM = std(0xefe8dc);
  for (const [x, y, w, h] of [[4, 8, 7.4, .35], [4, 0, 7.4, .35], [.5, 4, .35, 8.3], [7.5, 4, .35, 8.3], [4, 4, .25, 8], [4, 4, 7, .25]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, .2), frameM); b.position.set(x, y, -11.9); scene.add(b);
  }
  // armário ao fundo
  const cab = new THREE.Mesh(new THREE.BoxGeometry(6, 9, 2.5), std(0x6b4a33)); cab.position.set(-7, -3, -10.5); scene.add(cab);
  // luminária pendente
  const shade = new THREE.Mesh(new THREE.ConeGeometry(1.4, 1.2, 32, 1, true), std(0x222222, { side: THREE.DoubleSide }));
  shade.position.set(0, 9.4, 0); scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.35, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff0d0 })); bulb.position.set(0, 8.9, 0); scene.add(bulb);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, 8), std(0x111111)); cord.position.set(0, 14, 0); scene.add(cord);
  // mesa
  const top = new THREE.Mesh(new THREE.BoxGeometry(10, .25, 8), std(0xffffff, { map: clothTex, roughness: .9 }));
  top.position.set(0, -.125, .4); top.receiveShadow = true; scene.add(top);
  const drape = new THREE.Mesh(new THREE.BoxGeometry(10.05, 1.2, 8.05), std(0xffffff, { map: clothTex, roughness: .9 }));
  drape.position.set(0, -.7, .4); scene.add(drape);
  for (const [x, z] of [[-4.5, -3.2], [4.5, -3.2], [-4.5, 4], [4.5, 4]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.5, 7.3, .5), std(0x4a3020)); leg.position.set(x, -3.9, z); scene.add(leg);
  }
}

/* ---------------- prato e comida ---------------- */
const plate = new THREE.Group(); scene.add(plate);
{
  const pts = [[0, .005], [.72, .005], [.78, .012], [.8, .03], [.86, .05], [1.12, .12], [1.16, .135], [1.15, .145], [1.1, .14], [.85, .062], [.8, .052], [0, .05]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  const dish = new THREE.Mesh(new THREE.LatheGeometry(pts, 96),
    new THREE.MeshPhysicalMaterial({ color: 0xf6f3ec, roughness: .22, clearcoat: .7, side: THREE.DoubleSide }));
  plate.add(dish);
  // arroz
  const grain = new THREE.CapsuleGeometry(.011, .03, 2, 6);
  const rice = new THREE.InstancedMesh(grain, std(0xf4efe2, { roughness: .5 }), 650);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < 650; i++) {
    const a = rnd() * TAU, rr = Math.sqrt(rnd()) * .34, hh = .13 * (1 - (rr / .34) ** 2);
    e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e);
    m4.compose(V(-.38 + Math.cos(a) * rr, .06 + rnd() * hh, -.12 + Math.sin(a) * rr), q, V(1, 1, 1));
    rice.setMatrixAt(i, m4);
  }
  plate.add(rice);
  // bife
  const steak = new THREE.Mesh(new RoundedBoxGeometry(.56, .12, .4, 4, .05), std(0x6a381f, { roughness: .6 }));
  steak.position.set(.4, .11, -.3); steak.rotation.y = .4; plate.add(steak);
  for (let i = -1; i <= 1; i++) {
    const mark = new THREE.Mesh(new THREE.BoxGeometry(.04, .01, .36), std(0x2a1409));
    mark.position.set(i * .14, .062, 0); mark.rotation.y = .5; steak.add(mark);
  }
  // ervilhas
  const peaM = std(0x5f9e3a, { roughness: .45 });
  for (let i = 0; i < 26; i++) {
    const a = rnd() * TAU, rr = Math.sqrt(rnd()) * .14;
    const p = new THREE.Mesh(new THREE.SphereGeometry(.034, 14, 10), peaM);
    p.position.set(-.3 + Math.cos(a) * rr, .085 + rnd() * .02, .45 + Math.sin(a) * rr); plate.add(p);
  }
  // gotinha de molho (onde a mosca come)
  const drop = new THREE.Mesh(new THREE.SphereGeometry(.035, 16, 10), new THREE.MeshPhysicalMaterial({ color: 0x7a3a12, roughness: .1, clearcoat: 1 }));
  drop.scale.set(1, .25, 1); drop.position.set(.2 + Math.sin(.6) * .07, .052, .35 + Math.cos(.6) * .07); plate.add(drop);
  shadowAll(plate);
  // talheres e copo
  const metal = std(0xcfd3d6, { metalness: .95, roughness: .25 });
  const fork = new THREE.Group();
  const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };
  fork.add(at(new THREE.Mesh(new THREE.BoxGeometry(.09, .025, 1.0), metal), 0, 0, .45));
  for (let i = 0; i < 4; i++) fork.add(at(new THREE.Mesh(new THREE.BoxGeometry(.02, .02, .35), metal), -.06 + i * .04, 0, -.2));
  fork.position.set(1.55, .015, .2); scene.add(fork); shadowAll(fork);
  const knife = new THREE.Mesh(new THREE.BoxGeometry(.12, .02, 1.5), metal); knife.position.set(-1.55, .012, .25); scene.add(knife); shadowAll(knife);
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(.32, .28, 1.2, 32, 1, true),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .22, roughness: .05, side: THREE.DoubleSide }));
  glass.position.set(1.7, .6, -1.4); scene.add(glass);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(.3, .27, .8, 32), new THREE.MeshPhysicalMaterial({ color: 0xbfe0ff, transparent: true, opacity: .3, roughness: .05 }));
  water.position.set(1.7, .41, -1.4); scene.add(water);
}

/* ---------------- humano ---------------- */
const M = { skin: std(0xd9a07e, { roughness: .55, emissive: 0x3a1a0c }), shirt: std(0x34506b, { roughness: .85 }), hair: std(0x2a1c14, { roughness: .9 }) };
const SHOULDER_R = V(-1.35, 4.0, -4.1), SHOULDER_L = V(1.35, 4.0, -4.1);

function placeLimb(m, a, b, r) {
  const d = b.clone().sub(a), len = d.length();
  m.position.copy(a).addScaledVector(d, .5); m.scale.set(r, len, r);
  m.quaternion.setFromUnitVectors(UPV, d.normalize());
}
function solveArm(S, Wp, pole, up, fore, joint) {
  const L1 = 2.95, L2 = 2.95;
  const dir = Wp.clone().sub(S); const d = Math.min(dir.length(), L1 + L2 - .001); dir.normalize();
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const p = pole.clone().addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = S.clone().addScaledVector(dir, a).addScaledVector(p, h);
  placeLimb(up, S, E, .38); placeLimb(fore, E, Wp, .3); joint.position.copy(E);
}

const nerveMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uColor: { value: ACCENT.clone().multiplyScalar(2.2) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

function makeFly() {
  const root = new THREE.Group(); root.rotation.order = 'YXZ';
  const body = new THREE.Group(); body.scale.setScalar(FLY_SCALE); root.add(body);
  const lift = new THREE.Group(); lift.position.y = .36; body.add(lift);
  const dark = std(0x1c1b19, { roughness: .45, metalness: .2 });

  thorax.scale.set(1, .88, 1.15); lift.add(thorax);
  const abG = new THREE.SphereGeometry(.4, 32, 24).rotateX(Math.PI / 2);
  const abd = new THREE.Mesh(abG, new THREE.MeshPhysicalMaterial({ map: abdTex, roughness: .35, metalness: .3, iridescence: .7, clearcoat: .5 }));
  abd.scale.set(1, .72, 1.25); abd.position.set(0, -.04, -.68); lift.add(abd);
  // pelinhos
  const bristle = new THREE.InstancedMesh(new THREE.ConeGeometry(.007, .05, 4), dark, 90);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < 90; i++) {
    const n = V(rnd() * 2 - 1, rnd() * .9 + .1, rnd() * 2 - 1).normalize();
    const p = n.clone().multiply(V(.36, .32, .41));
    q.setFromUnitVectors(UPV, n); m4.compose(p, q, V(1, 1, 1)); bristle.setMatrixAt(i, m4);

  const skull = new THREE.Mesh(new THREE.SphereGeometry(.24, 32, 24), dark); skull.scale.set(1.2, 1, .75); skull.position.z = .12; head.add(skull);
  const frons = new THREE.Mesh(new THREE.SphereGeometry(.1, 16, 12), std(0xa7a28e, { metalness: .6, roughness: .3 })); frons.scale.set(.7, 1.3, .5); frons.position.set(0, .04, .3); head.add(frons);

    eye.scale.set(.78, 1.05, .95); eye.position.set(s * .19, .04, .2); eye.rotation.y = s * .6; head.add(eye); eyes.push(eye);
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(.012, .02, .14, 6), dark); ant.position.set(s * .05, .06, .37); ant.rotation.x = 1.9; head.add(ant);
  }

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.04, .05, .22, 10), std(0x3a3226)); stem.position.y = -.11; prob.add(stem);
  const pad = new THREE.Mesh(new THREE.SphereGeometry(.07, 14, 10), std(0x4a3e2e)); pad.scale.set(1.4, .5, 1.2); pad.position.y = -.23; prob.add(pad);
  // asas
  const wingShape = (s) => { const sh = new THREE.Shape(); sh.absellipse(s * .16, .5, .17, .5, 0, TAU); return sh; };
  const wingMat = new THREE.MeshPhysicalMaterial({ color: 0xeef4fa, transparent: true, opacity: .45, roughness: .1, iridescence: 1, side: THREE.DoubleSide, depthWrite: false });
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.rotation.order = 'ZYX'; piv.position.set(s * .12, .3, .05);
    const wm = new THREE.Mesh(new THREE.ShapeGeometry(wingShape(s), 24).rotateX(-Math.PI / 2), wingMat);
    const vein = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(wingShape(s), 24).rotateX(-Math.PI / 2)), new THREE.LineBasicMaterial({ color: 0x3a3a38, transparent: true, opacity: .6 }));
    piv.add(wm, vein); lift.add(piv); wings.push(piv); piv.userData.s = s;
  }
  // pernas
  const legM = dark;
  const LEGS = [[[.12, -.2, .18], [.42, .05, .42], [.48, -.36, .62]], [[.15, -.22, 0], [.55, .08, .02], [.65, -.36, 0]], [[.12, -.2, -.18], [.45, .05, -.42], [.55, -.36, -.6]]];
  const nerves = new THREE.Group(); lift.add(nerves);

const F = V(.2, .052, .35), YAW = .6;
const ff = V(Math.sin(YAW), 0, Math.cos(YAW)), fr = V(Math.cos(YAW), 0, -Math.sin(YAW));

const P1 = off(.75, .75, .45), P2 = off(-.2, .55, .8);

let st;
function reset() {
  st = {
    camPos: V(), camTgt: V(), fov: 40, camUp: UPV.clone(),
    hand: { pos: HP.REST.pos.clone(), rx: 0, ry: HP.REST.ry, arm: true, scale: 1 },
    fly: { pos: F.clone(), yaw: YAW, pitch: 0, flying: false, vis: true, eatSpeed: 1 },
    mosaic: 0, vig: .35, sector: 0, sectorR: .46, pointer: null, ripples: 0, rippleT: 0, nerves: 0, eyeGlow: 0, deg: null
  };
}
const cam = (p, t, fov) => { st.camPos.copy(p); st.camTgt.copy(t); st.fov = fov; };
const setHand = (pos, rx, ry, arm = true, scale = 1) => Object.assign(st.hand, { pos: pos.clone(), rx, ry, arm, scale });
const lerpPose = (A, B, k) => [A.pos.clone().lerp(B.pos, k), lerp(A.rx, B.rx, k), lerp(A.ry, B.ry, k)];
const headWorld = () => fly.head.getWorldPosition(V());

let T = 0;
function applyFly() {
  const f = st.fly;
  fly.root.visible = f.vis;
  fly.root.position.copy(f.pos);
  fly.root.rotation.set(f.pitch, f.yaw, 0);
  const at = T * f.eatSpeed;
  if (!f.flying) {
    fly.head.rotation.x = .2 + .1 * Math.sin(at * 7);
    fly.prob.scale.y = 1 + .3 * Math.sin(at * 7 + 1.2);
    for (const w of fly.wings) { const s = w.userData.s; w.rotation.set(.05, s * .35, 0); }
  } else {
    fly.head.rotation.x = 0; fly.prob.scale.y = .7;
    const flap = Math.sin(T * TAU * 27);
    for (const w of fly.wings) { const s = w.userData.s; w.rotation.set(0, s * 1.3, -s * (.2 + .85 * flap)); }
  }
  fly.root.updateMatrixWorld(true);
}

/* ---------------- cenas do roteiro ---------------- */
const SHOTS = {
  // "Você está lá, de boa, almoçando no prato do humano."
  almoco(lt, d) {
    const k = easeInOut(lt / d);
    cam(off(.38, .3, 1.15).lerp(off(.22, .17, .8), k), off(0, .035, 0), 35);
  },
  // "De repente, uma mão gigante vem... Em câmera lenta."
  mao(lt, d) {
    let pose;
    if (lt < 1.0) pose = lerpPose(HP.REST, HP.UP, easeInOut(range(lt, .1, 1.0)));
    else pose = lerpPose(HP.UP, HP.MID, easeOut(range(lt, 1.0, d)));
    setHand(...pose);
    st.fly.eatSpeed = .25; st.vig = .55;
    cam(off(.3, .14, .55), off(0, .04, 0).lerp(pose[0], .27), 72);
  },
  // "Você desvia fácil. Mas por que isso acontece?"
  desvia(lt, d) {
    const kh = easeIn(range(lt, 0, .45));
    setHand(...lerpPose(HP.MID, HP.HIT, kh));
    if (lt > 1.6) { const kl = easeInOut(range(lt, 1.6, d)); setHand(HP.HIT.pos.clone().add(V(0, .25 * kl, 0)), -.1 * kl, .3); }
    if (lt > .1) {
      st.fly.flying = true; st.fly.pitch = -.2;
      st.fly.pos = bez(F, off(.1, .5, 0), P1, easeOut(range(lt, .1, .9))).add(hoverV(lt).multiplyScalar(range(lt, .6, 1)));
    }
    const k2 = easeInOut(range(lt, 1.3, 2.3));
    cam(off(.9, .9, 2.0).lerp(off(.2, .06, .7, P1), k2), off(.3, .35, 0).lerp(P1, k2), lerp(50, 36, k2));
  },
  // "Porque você não é qualquer um. Você é uma mosca."
  mosca(lt, d) {
    const a = lerp(-.8, .5, easeInOut(lt / d));
    const dir = ff.clone().applyAxisAngle(UPV, a);
    cam(F.clone().addScaledVector(dir, .65).add(V(0, .12, 0)), off(0, .035, 0), 35);
  },
  // "...a SUA cabeça é composta por milhares de olhos."
  olhos(lt, d) {
    applyFly();
    const e = fly.eyes[1].getWorldPosition(V());
    const out = e.clone().sub(headWorld()).normalize().add(V(0, .25, 0)).addScaledVector(ff, .3).normalize();
    const k = easeInOut(range(lt, 0, d * .85));
    cam(e.clone().addScaledVector(out, lerp(.45, .072, k)), e, 35);
    st.eyeGlow = smooth(range(lt, 2.0, 3.0)) * (.75 + .25 * Math.sin(lt * 5));
  },
  // "...visão panorâmica de quase 360 graus. Você enxerga ele por todos os lados, enquanto finge que está só comendo."
  graus(lt, d) {
    const rise = easeInOut(range(lt, 5.4, 6.6));
    st.camUp = ff.clone();
    cam(off(0, lerp(1.9, 3.8, rise), 0), off(0, 0, 0), 50);
    const k = easeOut(range(lt, .8, 4.6));
    st.sector = 1; st.sweepK = k; st.sectorR = lerp(.46, .95, rise);
    st.deg = Math.round(360 * k);
    if (lt > 5.6) {
      const th = YAW + Math.PI + (lt - 5.6) * 1.6;
      const pos = F.clone().add(V(Math.sin(th) * .8, .5, Math.cos(th) * .8));
      setHand(pos, -.15, th + Math.PI, false, easeOut(range(lt, 5.6, 6.2)));
      if (lt > 6.0) st.pointer = pos;
    }
  },
  // "Mas isso nem é o mais impressionante."
  impressiona(lt, d) {
    const k = easeInOut(lt / d);
    cam(off(.05, .09, .52).lerp(off(.03, .05, .32), k), off(0, .04, 0), 32);
    setHand(HP.FAR.pos.clone().add(V(Math.sin(lt) * .2, 0, 0)), HP.FAR.rx, HP.FAR.ry);
  },
  // "Cada um dos seus olhos capta frações do ambiente. Isso te dá uma visão extraordinária."
  fracoes(lt, d) {
    st.fly.vis = false; applyFly();
    const hp = V(F.x - .4 + .5 * Math.sin(lt * .6), 2.1 + .2 * Math.sin(lt * .9), F.z - 1.6);
    setHand(hp, -.5, .3);
    const eye = headWorld().addScaledVector(ff, .02).add(V(0, .015, 0));
    cam(eye, hp.clone().lerp(humanHead.getWorldPosition(V()), .3), 80);
    st.mosaic = smooth(range(lt, 0, .7)) * (1 - smooth(range(lt, d - .45, d)));
  },
  // "...cérebro é especialista em sentir cintilações e movimentos... vibrações da mão dele antes mesmo dela chegar perto."
  movimento(lt, d) {
    const pose = lerpPose(HP.FAR, HP.NEAR, easeInOut(lt / d));
    setHand(...pose);
    cam(off(.8, .35, 1.4), off(-.1, .04, 0).lerp(pose[0], .3), 60);
    st.ripples = smooth(range(lt, .4, 1.0)) * (1 - smooth(range(lt, d - .4, d)));
    st.rippleT = lt;
  },
  // "...olhos conectados diretamente ao seu corpo e aos seus músculos, você desvia... quase por instinto. Automaticamente."
  instinto(lt, d) {
    setHand(...lerpPose(HP.NEAR, HP.HIT, easeIn(range(lt, 4.0, 4.4))));
    st.nerves = smooth(range(lt, .2, 1.0)) * (1 - smooth(range(lt, 6.0, 6.9)));
    st.eyeGlow = st.nerves * .6;
    st.vig = lerp(.35, .8, st.nerves * (1 - range(lt, 4, 5)));
    if (lt > 3.95) {
      st.fly.flying = true; st.fly.pitch = -.2;
      st.fly.pos = bez(F, off(-.05, .4, .1), P2, easeOut(range(lt, 3.95, 4.8))).add(hoverV(lt).multiplyScalar(range(lt, 4.6, 5)));
    }
    const kc = easeInOut(range(lt, 3.9, 5.0));
    cam(off(.5, .12, .22).lerp(off(1.2, .7, 1.5), kc), off(0, .035, 0).lerp(st.fly.pos, kc), lerp(35, 45, kc));
  },
  // "E se você gostou de ser uma mosca se inscreve."
  inscreve(lt, d) {
    setHand(HP.HIT.pos, 0, .3);
    st.fly.flying = true; st.fly.pitch = -.12;
    st.fly.pos = P2.clone().add(hoverV(lt + 10));
    cam(off(.06, .05, .55, P2), P2.clone().add(V(0, -.01, 0)), 36);
  },
};
const IMPACTS = [SEG.desvia.start + .45, SEG.instinto.start + 4.4];

/* ---------------- textos ---------------- */
const textHost = document.getElementById('texts');
for (const x of TEXTS) {
  const el = document.createElement('div'); el.className = 'ov'; el.innerHTML = x.html;
  el.style.setProperty('--y', x.y + 'px'); el.style.setProperty('--fs', x.fs + 'px');
  textHost.appendChild(el); x.el = el; x.a = SEG[x.seg].start + x.from; x.b = SEG[x.seg].start + x.to;
}
const degEl = document.getElementById('deg');

/* ---------------- quadro ---------------- */
function frame(t) {
  T = t; reset();
  const s = [...SEGMENTS].reverse().find(s => t >= s.start) || SEGMENTS[0];
  const lt = Math.min(t - s.start, s.dur);
  SHOTS[s.id](lt, s.dur);

  // impacto: tremor + flash
  let shake = 0, flash = 0;
  for (const it of IMPACTS) if (t > it && t < it + 1.2) { const e = t - it; shake += Math.exp(-e * 6); flash += Math.exp(-e * 14) * .35; }
  plate.position.y = shake * .02 * Math.sin(t * 90);

  applyFly();
  // mão + braço
  hand.position.copy(st.hand.pos); hand.rotation.set(st.hand.rx, st.hand.ry, 0); hand.scale.setScalar(st.hand.scale);
  hand.visible = st.hand.scale > .01;
  hand.updateMatrixWorld(true);
  armR.visible = st.hand.arm;
  if (st.hand.arm) solveArm(SHOULDER_R, hand.localToWorld(WRIST_LOCAL.clone()), V(-1, -.3, 0), armUpper, armFore, elbowJ);

  // olhos / nervos
  nerveMat.uniforms.uTime.value = t; nerveMat.uniforms.uOpacity.value = st.nerves; fly.nerves.visible = st.nerves > .01;

  // vibrações (ondas saindo da mão)
  let glow = 0;
  const palm = hand.localToWorld(V(0, -.15, .3));
  const dist = palm.distanceTo(F);
  ripples.forEach((r, i) => {
    r.visible = st.ripples > .01;
    if (!r.visible) return;
    const ph = (st.rippleT * .45 + i / ripples.length) % 1;
    const rad = Math.max(.01, ph * dist * 1.2);
    r.position.copy(palm); r.lookAt(st.camPos); r.scale.setScalar(rad);
    r.material.opacity = st.ripples * Math.pow(1 - ph, 1.1) * (.7 + .3 * Math.sin(t * 37 + i * 2));
    glow += Math.exp(-(((rad - dist) / .15) ** 2)) * st.ripples;
  });
  eyeMat.emissiveIntensity = Math.max(st.eyeGlow, glow * 1.4) * 2.2;

  // setor de visão 360
  sector.visible = st.sector > 0;
  if (sector.visible) {
    sector.position.copy(F).add(V(0, .06, 0)); sector.rotation.y = YAW; sector.scale.setScalar(st.sectorR);
    sector.material.uniforms.uSweep.value = TAU * .95 * st.sweepK;
  }
  pointer.visible = pointerDot.visible = !!st.pointer;
  if (st.pointer) { const a = headWorld(); placeLimb(pointer, a, st.pointer, .008); pointerDot.position.copy(a); }
  if (degEl && st.deg !== null) degEl.textContent = st.deg + '°';

  // câmera
  camera.up.copy(st.camUp);
  const sh = shake * .025;
  camera.position.copy(st.camPos).add(V(Math.sin(t * 71) * sh, Math.sin(t * 83) * sh, Math.cos(t * 67) * sh));
  camera.fov = st.fov; camera.updateProjectionMatrix();
  camera.lookAt(st.camTgt);

  postMat.uniforms.uMosaic.value = st.mosaic;
  postMat.uniforms.uVig.value = st.vig;
  postMat.uniforms.uFlash.value = flash;
  postMat.uniforms.uTime.value = t;

  for (const x of TEXTS) {
    if (window.__render) { // modo exportação: anima o texto quadro a quadro
      const k = Math.min(range(t, x.a, x.a + .3), 1 - range(t, x.b - .25, x.b)), e = easeOut(k);
      x.el.style.transition = 'none'; x.el.style.opacity = k;
      x.el.style.transform = `translateY(${(1 - e) * 40}px) scale(${.92 + .08 * e})`;
    } else x.el.classList.toggle('on', t >= x.a && t < x.b);
  }

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* ---------------- controle / reprodução ---------------- */
const stage = document.getElementById('stage'), startEl = document.getElementById('start');
const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / W, innerHeight / H));
addEventListener('resize', fit); fit();
const params = new URLSearchParams(location.search);
let playing = false, offset = parseFloat(params.get('t') || '0'), t0 = 0;
const current = () => playing ? Math.min(TOTAL, offset + (performance.now() - t0) / 1000) : offset;
function play() { if (playing) return; playing = true; t0 = performance.now(); startEl.classList.add('hide'); }
function pause() { offset = current(); playing = false; }
function seek(t) { offset = clamp(t, 0, TOTAL); t0 = performance.now(); }
startEl.addEventListener('click', play);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!playing) play(); else pause(); }
  if (e.code === 'KeyR') { seek(0); play(); }
  if (e.code === 'ArrowRight') seek(current() + 2);
  if (e.code === 'ArrowLeft') seek(current() - 2);
});
window.__total = TOTAL;
window.__seek = (t) => { playing = false; offset = t; frame(t); };
window.__ready = true;
if (params.has('hideui')) startEl.classList.add('hide');
if (params.has('still')) frame(offset);
else (function loop() { frame(current()); requestAnimationFrame(loop); })();
</script>
</body>
