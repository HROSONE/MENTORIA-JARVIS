<!doctype html><html><head><meta charset="utf-8"><title>dev cabra</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { renderer, scene, cam } from './js/motor.js';
import { criarCabra, ventoU, passoAndar, passoSalto } from './js/cabra.js';
scene.background = new THREE.Color(0xe8a868);
scene.add(new THREE.HemisphereLight(0xffd9a8, 0x5a4636, 0.9));
const sol = new THREE.DirectionalLight(0xffc27a, 3); sol.position.set(4, 3, 3); sol.castShadow = true; scene.add(sol);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x7a5a44, roughness: 1 })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; scene.add(chao);
const C = criarCabra({ bode: true, dens: +(new URLSearchParams(location.search).get('dens') || 1) });
scene.add(C.grupo);
window.__C = C;
window.__tiro = (o) => {
  ventoU.value = o.t || 0;
  C.pose(o.pose || {});
  const c = o.cam; cam.fov = c.fov || 35; cam.updateProjectionMatrix(); cam.position.set(...c.pos); cam.lookAt(...c.alvo);
  renderer.render(scene, cam);
};
window.__ready = true;
</script></body></html>
